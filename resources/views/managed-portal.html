<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F1117">
<title>LevelUpGrowth</title>
<!--
  MANAGED-1/MANAGED-3 (RFC-0029, DEC-0086) — the managed portal, enterprise build (Owner 2026-10-05: "score 5/10 make
  it enterprise grade"). Email, Billing, Account and service status for a client whose website we host and run.
  The app's own tokens, fonts and component vocabulary (public/app/index.html); nothing technical, no file manager.
  The server enforces the boundary (App\Core\Managed\ManagedWorkspaces); this page only decides what is drawn.
-->
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<script>(function(){try{var t=localStorage.getItem('lu_theme')||'dark';var l=t==='light'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);if(l)document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
:root{
  --bg:#0F1117;--s1:#171A21;--s2:#1E2230;--s3:#252A3A;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --p:#6C5CE7;--p2:#9B8DF8;--pg:rgba(108,92,231,.22);--ps:rgba(108,92,231,.12);
  --ac:#00E5A8;--as:rgba(0,229,168,.10);--bl:#6FA8FF;--bs:rgba(111,168,255,.12);--am:#F59E0B;--ams:rgba(245,158,11,.13);--rd:#F87171;--rds:rgba(248,113,113,.13);
  --t1:#E8EDF5;--t2:#9AA5BC;--t3:#8B94A8;
  --fh:'Bricolage Grotesque','Inter',sans-serif;--fb:'Inter',system-ui,sans-serif;
  --r:10px;--rg:16px;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.18);
  --ease:cubic-bezier(.16,1,.3,1);--safe-b:env(safe-area-inset-bottom,0px)
}
html[data-theme="light"]{color-scheme:light;
  --bg:#F7F6F4;--s1:#FFFFFF;--s2:#F5F3F2;--s3:#ECEAE7;--bd:rgba(15,13,10,.08);--bd2:#DCDAD6;
  --p:#050505;--p2:#3a3a3a;--pg:rgba(5,5,5,.14);--ps:rgba(5,5,5,.06);
  --ac:#12664A;--as:rgba(50,174,136,.11);--bl:#3860BE;--bs:rgba(56,96,190,.09);--am:#8A5406;--ams:rgba(161,98,7,.10);--rd:#C62828;--rds:rgba(198,40,40,.08);
  --t1:#0B0B0C;--t2:#4F4F55;--t3:#6B6B70;--sh:0 1px 2px rgba(15,13,10,.04),0 6px 20px rgba(15,13,10,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);font:400 14px/1.55 var(--fb);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
/* ── shell ── */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:248px;flex:none;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.brand img{width:32px;height:32px}
.brand b{display:block;font:700 14px var(--fh);letter-spacing:-.01em}
.brand span{display:block;font-size:10.5px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.org{margin:4px 12px 10px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--s2);display:flex;gap:10px;align-items:center}
.org .av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font:700 13px var(--fh);flex:none}
html[data-theme="light"] .org .av{background:#0B0B0C}
.org b{display:block;font:600 12.5px/1.3 var(--fb)}
.org span{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);margin-top:2px}
.nav-l{font:600 10.5px var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--t3);padding:14px 22px 6px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.ni{display:flex;align-items:center;gap:11px;min-height:42px;padding:0 12px;border-radius:9px;border:0;background:none;color:var(--t2);font:500 14px var(--fb);cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s}
.ni svg{width:19px;height:19px;flex:none}
.ni:hover{background:var(--s2);color:var(--t1)}
.ni.on{background:var(--ps);color:var(--t1);font-weight:600;box-shadow:inset 3px 0 0 var(--p)}
html[data-theme="light"] .ni.on{background:rgba(5,5,5,.06)}
.side-foot{margin-top:auto;padding:12px 12px calc(14px + var(--safe-b));border-top:1px solid var(--bd);display:grid;gap:10px}
.help{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--s2);border:1px solid var(--bd);font-size:12px;color:var(--t2)}
.help svg{width:18px;height:18px;color:var(--t1);flex:none;margin-top:1px}
.help b{display:block;color:var(--t1);font-size:12.5px;margin-bottom:2px}
.help a{color:var(--t1);text-decoration:none;font-weight:600}
.seg{display:flex;gap:2px;padding:3px;background:var(--s3);border-radius:8px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:6px;font:600 11.5px var(--fb);color:var(--t2);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--s1);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:64px;padding:0 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--bd)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);min-width:0}
.crumb b{color:var(--t1);font-weight:600}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.health{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--bd2);background:var(--s1);font:600 12.5px var(--fb);cursor:pointer;color:var(--t1)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ac);box-shadow:0 0 0 3px var(--as)}.dot.warn{background:var(--am);box-shadow:0 0 0 3px var(--ams)}.dot.bad{background:var(--rd);box-shadow:0 0 0 3px var(--rds)}.dot.unknown{background:var(--t3)}
.me{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd2);background:var(--s2);font:700 12px var(--fh);cursor:pointer;display:grid;place-items:center}
.burger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--bd2);background:var(--s1);cursor:pointer;place-items:center}
.burger svg{width:18px;height:18px}
.menu{position:absolute;right:0;top:44px;min-width:240px;background:var(--s1);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:6px;z-index:40}
.menu .h{padding:10px 12px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.menu .h b{display:block;font-size:13px}.menu .h span{font-size:12px;color:var(--t3)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left}
.menu button:hover{background:var(--s2)}
.menu svg{width:16px;height:16px;color:var(--t2)}
.pop{position:absolute;right:0;top:44px;width:340px;background:var(--s1);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:16px;z-index:40}
.wrap{padding:32px 32px 24px;max-width:1180px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph h1{font:700 28px/1.15 var(--fh);letter-spacing:-.02em;margin:0}
.ph p{margin:6px 0 0;color:var(--t2);font-size:14.5px;max-width:64ch}
.foot{margin-top:auto;padding:18px 32px calc(18px + var(--safe-b));border-top:1px solid var(--bd);display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between;color:var(--t3);font-size:12px}
.staff{display:flex;gap:10px;align-items:center;background:var(--bs);border:1px solid var(--bd2);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--t2);margin-bottom:20px}
.staff a{color:var(--t1);font-weight:600}
/* ── components ── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--bd)}
.card-h h2{font:650 15.5px var(--fh);letter-spacing:-.005em;margin:0}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--t3)}
.card-b{padding:20px 22px}
.stack>*+*{margin-top:20px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g-bill{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.tile{padding:18px 20px}
.tile .k{display:flex;align-items:center;gap:8px;font:600 11px var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.tile .k .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--s2);color:var(--t1)}
.tile .k .ic svg{width:16px;height:16px}
.tile .v{font:700 24px/1.2 var(--fh);letter-spacing:-.015em;margin-top:14px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--t2);margin-top:4px}
.svc{display:flex;gap:14px;align-items:flex-start;padding:18px 20px}
.svc .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.svc .ic svg{width:20px;height:20px}
.svc .ic.ok{background:var(--as);color:var(--ac)}.svc .ic.warn{background:var(--ams);color:var(--am)}.svc .ic.bad{background:var(--rds);color:var(--rd)}.svc .ic.unknown{background:var(--s2);color:var(--t3)}
.svc b{display:block;font:600 14px var(--fb)}
.svc span{display:block;font-size:12.5px;color:var(--t2);margin-top:2px}
.svc em{display:block;font-style:normal;font-size:11.5px;color:var(--t3);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font:600 11.5px var(--fb);white-space:nowrap;background:var(--s3);color:var(--t2)}
.pill.ok{background:var(--as);color:var(--ac)}.pill.warn{background:var(--ams);color:var(--am)}.pill.bad{background:var(--rds);color:var(--rd)}.pill.info{background:var(--bs);color:var(--bl)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s1);color:var(--t1);font:600 13px var(--fb);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--s2)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{opacity:.92}
.btn.ghost{border-color:transparent;background:none;color:var(--t2)}.btn.ghost:hover{background:var(--s2);color:var(--t1)}
.btn.danger{color:var(--rd)}
.btn.sm{min-height:32px;padding:0 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.inp{width:100%;min-height:44px;padding:0 13px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font:400 14px var(--fb)}
.inp:focus{outline:2px solid var(--pg);border-color:var(--p)}
.lbl{display:block;font:600 12px var(--fb);color:var(--t2);margin-bottom:6px}
.hint{font-size:12px;color:var(--t3);margin-top:6px}
.field+.field{margin-top:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:600 11px var(--fb);letter-spacing:.07em;text-transform:uppercase;color:var(--t3);text-align:left;padding:12px 22px;border-bottom:1px solid var(--bd);background:var(--s2)}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.ini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--fh);flex:none;color:#fff}
.person b{display:block;font-weight:600;overflow-wrap:anywhere}.person span{display:block;font-size:12.5px;color:var(--t3)}
.bar{height:6px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2))}
html[data-theme="light"] .bar i{background:#0B0B0C}
.bar.ok i{background:var(--ac)}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--bd)}
.check:first-child{border-top:0;padding-top:0}
.check .ic{width:32px;height:32px;border-radius:9px;background:var(--as);color:var(--ac);display:grid;place-items:center;flex:none}
.check .ic svg{width:16px;height:16px}
.check b{display:block;font-weight:600}.check span{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;counter-reset:s}
.step{position:relative;padding:4px 18px 0 0}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12.5px var(--fh);background:var(--s2);border:1px solid var(--bd2);color:var(--t2);position:relative;z-index:1}
.step.cur .n{background:var(--p);border-color:var(--p);color:#fff}
.step:not(:last-child)::after{content:"";position:absolute;left:30px;right:0;top:19px;height:1px;background:var(--bd2)}
.step b{display:block;margin-top:12px;font-weight:600}.step span{display:block;font-size:12.5px;color:var(--t2);margin-top:3px;padding-right:8px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px solid var(--bd);border-radius:12px;background:var(--s2)}
.feat .ic{width:34px;height:34px;border-radius:9px;background:var(--s1);border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.feat .ic svg{width:17px;height:17px}
.feat b{display:block;font-weight:600;font-size:13.5px}.feat span{display:block;font-size:12.5px;color:var(--t2);margin-top:2px}
.hero{padding:26px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero h2{font:700 21px/1.25 var(--fh);letter-spacing:-.015em;margin:10px 0 6px}
.hero p{margin:0;color:var(--t2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:13.5px}
.kv dt{color:var(--t3)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ring{--v:0;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--v)*1%),var(--s3) 0);display:grid;place-items:center;margin:auto}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--s1);display:grid;place-items:center;text-align:center}
.ring b{display:block;font:700 26px/1 var(--fh)}.ring span{display:block;font-size:11px;color:var(--t3);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.doc{display:flex;align-items:center;gap:14px;padding:14px 22px;border-top:1px solid var(--bd)}
.doc:first-child{border-top:0}
.doc .ic{width:38px;height:38px;border-radius:10px;background:var(--s2);border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.doc .ic svg{width:18px;height:18px}
.doc b{display:block;font-weight:600}.doc span{display:block;font-size:12.5px;color:var(--t3)}
.doc .r{margin-left:auto}
.prof{display:flex;align-items:center;gap:18px;padding:24px}
.prof .ini{width:64px;height:64px;font-size:22px;border-radius:18px}
.prof h2{margin:0;font:700 20px var(--fh)}.prof p{margin:2px 0 0;color:var(--t2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row b{display:block;font-weight:600}.row span{display:block;font-size:12.5px;color:var(--t3);margin-top:1px}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{transition:none!important}}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--t1);color:var(--bg);padding:12px 16px;border-radius:12px;font:600 13px var(--fb);box-shadow:0 12px 40px rgba(0,0,0,.35);transition:opacity .25s var(--ease),transform .25s var(--ease);z-index:90;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dlg-b{position:fixed;inset:0;background:rgba(5,6,10,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.dlg{width:min(500px,100%);background:var(--s1);border:1px solid var(--bd2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.dlg .card-b{padding:22px 24px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--bd);background:var(--s2)}
.msg{font-size:13px;margin-top:12px}.msg.ok{color:var(--ac)}.msg.bad{color:var(--rd)}
.scrim{display:none}
@media (max-width:1080px){.g3{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-102%);transition:transform .25s var(--ease);visibility:hidden}
  .side.open{transform:none;visibility:visible;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .crumb .co,.crumb .sep{display:none}.crumb b{font:700 16px var(--fh)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(5,6,10,.5);z-index:60}
  .burger{display:grid}
  .top{padding:0 16px}
  .wrap{padding:22px 16px}
  .foot{padding:16px}
  .g3,.g2,.g-bill{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:16px}.step:not(:last-child)::after{display:none}
  .health .t{display:none}
  .pop{position:fixed;left:16px;right:16px;top:70px;width:auto}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--bd)}
  .tbl.cards td{padding:0;border:0}
  .tbl.cards td.full{grid-column:1/-1}
  .tbl.cards td.num{text-align:left}
  .card-h,.card-b,.doc,.row{padding-left:16px;padding-right:16px}
  .hero{padding:20px}
  .ph h1{font-size:24px}
}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side" aria-label="Main">
    <div class="brand"><img src="/img/logo-icon-40.png" alt=""><div><b>LevelUpGrowth</b><span>Managed Hosting</span></div></div>
    <div class="org"><div class="av" id="org-av">—</div><div style="min-width:0"><b id="org-name">—</b><span><i class="dot ok" style="width:6px;height:6px;box-shadow:none"></i>Managed account</span></div></div>
    <div class="nav-l">Workspace</div>
    <nav class="nav" aria-label="Pages">

      $('me').textContent = initials(r.json.user.name || r.json.user.email);

      var nm = m.display_name || m.address;
      return '<tr><td class="full"><div class="person"><div class="ini" style="background:' + hue(m.address) + '">' + esc(initials(nm)) + '</div><div style="min-width:0"><b>' + esc(nm) + '</b><span>' + esc(m.address) + '</span></div></div></td>' +
        '<td><span class="pill ' + cls + '">' + esc(lbl) + '</span></td>' +
        '<td class="num" style="min-width:150px">' + (m.storage_used_mb != null ? '<div style="font-size:12.5px;color:var(--t2);margin-bottom:6px">' + esc(m.storage_used_mb) + ' MB of ' + esc(m.quota_mb) + ' MB</div><div class="bar"><i style="width:' + pct + '%"></i></div>' : '<span style="color:var(--t3)">—</span>') + '</td>' +
        '<td class="num full"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">' + b + '</div></td></tr>';
    }).join('');
    $('content').innerHTML = head('Email', 'Mailboxes on ' + E.domain + ' for everyone on your team.', canAdd ? '<button class="btn pri" id="add">' + I.plus + 'Add a person</button>' : '') + '<div class="stack">' +
      '<div class="grid g3">' +
        tile(I.user, 'Mailboxes', used + (limit ? ' / ' + limit : ''), limit ? Math.max(0, limit - used) + ' available in your package' : '') +
        tile(I.db, 'Storage used', (s.storage_used_mb || 0) + ' MB', 'Across all mailboxes') +
        tile(I.mail, 'Domain', E.domain, 'Mail delivered by LevelUpGrowth') +
      '</div>' +
      '<div class="card"><div class="card-h"><div><h2>People</h2><p>' + (list.length ? list.length + ' mailbox' + (list.length === 1 ? '' : 'es') : 'No mailboxes yet') + '</p></div></div>' +
        (list.length ? '<table class="tbl cards"><thead><tr><th>Person</th><th>Status</th><th class="num">Storage</th><th class="num"><span class="sr">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="card-b" style="text-align:center;padding:40px 22px"><div style="width:48px;height:48px;margin:0 auto 12px;border-radius:14px;background:var(--s2);display:grid;place-items:center">' + I.user + '</div><b>Add the first person</b><div style="color:var(--t2);margin-top:4px">They will get a link to choose their own password.</div>' + (canAdd ? '<div style="margin-top:16px"><button class="btn pri" id="add2">' + I.plus + 'Add a person</button></div>' : '') + '</div>') +
      '</div>' +
      '<div class="card"><div class="row"><div><b>Passwords stay private</b><span>Each person chooses their own password from a one-time link. Nobody else sees it, including us.</span></div>' + I.shield.replace('<svg', '<svg style="width:22px;height:22px;flex:none;color:var(--ac)"') + '</div></div>' +
    '</div>';
    ['add', 'add2'].forEach(function (id) { var x = $(id); if (x) x.onclick = addPerson; });
    document.querySelectorAll('[data-act]').forEach(function (b) { b.onclick = function () { mbAction(b); }; });
  }
  function tile(ic, k, v, s) { return '<div class="card tile"><div class="k"><span class="ic">' + ic + '</span>' + esc(k) + '</div><div class="v">' + esc(v) + '</div>' + (s ? '<div class="s">' + esc(s) + '</div>' : '') + '</div>'; }

  function mbAction(b) {
    var a = b.getAttribute('data-act'), id = +b.getAttribute('data-id');
    var run = function () {
      b.disabled = true;
      req('POST', 'infrastructure/business-email/domains/' + E.domainId + '/actions/' + a, { id: id }).then(function (r) {
        var j = r.json || {}; toast(j.message || (r.ok ? 'Done.' : 'That did not work. Please try again.'));
        if (r.ok) setTimeout(function () { go('email'); }, 900); else b.disabled = false;
      });
    };
    if (a === 'delete-mailbox') confirmDlg('Remove ' + b.getAttribute('data-addr') + '?', 'The mailbox and its mail are removed for good. We confirm every removal with you before it happens.', 'Request removal', run); else run();
  }

  function dialog(title, body, okLabel, onOk) {
    var bg = document.createElement('div'); bg.className = 'dlg-b';
    bg.innerHTML = '<div class="dlg" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="card-h"><h2>' + esc(title) + '</h2><button class="btn ghost sm" data-x aria-label="Close">✕</button></div><div class="card-b">' + body + '<div class="msg" data-msg></div></div><div class="dlg-f"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>' + esc(okLabel) + '</button></div></div>';
    document.body.appendChild(bg);
    var close = function () { bg.remove(); document.removeEventListener('keydown', k); }, k = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', k);
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.querySelectorAll('[data-x]').forEach(function (x) { x.onclick = close; });
    var ok = bg.querySelector('[data-ok]'), msg = bg.querySelector('[data-msg]');
    ok.onclick = function () { onOk({ el: bg, ok: ok, msg: msg, close: close }); };
    var f = bg.querySelector('input'); (f || ok).focus();
    return bg;
  }
  function confirmDlg(t, text, okL, run) { dialog(t, '<div style="color:var(--t2)">' + esc(text) + '</div>', okL, function (d) { d.close(); run(); }); }

  function addPerson() {
    var bg = dialog('Add a person',
      '<div style="color:var(--t2);margin-bottom:18px">We send them a link to choose their own password. Their mailbox is ready as soon as they do.</div>' +
      '<div class="field"><label class="lbl" for="ap-n">Full name</label><input class="inp" id="ap-n" autocomplete="off" placeholder="Maria Santos"></div>' +
      '<div class="field"><label class="lbl" for="ap-l">New email address</label><div style="display:flex;align-items:center;border:1px solid var(--bd2);border-radius:var(--r);background:var(--s2);overflow:hidden"><input class="inp" id="ap-l" style="border:0;border-radius:0" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="maria"><span style="padding:0 13px;color:var(--t3);white-space:nowrap;border-left:1px solid var(--bd2);align-self:stretch;display:flex;align-items:center">@' + esc(E.domain) + '</span></div></div>' +
      '<div class="field"><label class="lbl" for="ap-t">Send the setup link to</label><input class="inp" id="ap-t" type="email" autocomplete="off" placeholder="name@gmail.com"><div class="hint">An address they can open today, such as their personal email.</div></div>',
      'Send setup link', function (d) {
        var n = d.el.querySelector('#ap-n').value.trim(), l = d.el.querySelector('#ap-l').value.trim().toLowerCase(), t = d.el.querySelector('#ap-t').value.trim();
        var bad = function (m) { d.msg.className = 'msg bad'; d.msg.textContent = m; };
        if (!n) return bad('Add their full name.');
        if (!/^[a-z0-9][a-z0-9._-]{0,62}$/.test(l)) return bad('Use letters, numbers, dots or dashes for the new address.');
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t)) return bad('Enter the email address the setup link should go to.');
        if (t.toLowerCase().split('@')[1] === String(E.domain).toLowerCase()) return bad('Send the link to an address they can already open, not the new one.');
        d.ok.disabled = true; d.msg.className = 'msg'; d.msg.textContent = 'Sending…';
        req('POST', 'infrastructure/business-email/domains/' + E.domainId + '/actions/create-mailbox', { local_part: l, display_name: n, setup_recipient: t }).then(function (r) {
          var j = r.json || {};
          if (r.ok && (j.state === 'pending' || j.state === 'done')) { d.close(); toast(j.message || 'Setup link sent.'); go('email'); }
          else { d.ok.disabled = false; bad(j.message || 'That did not work. Please try again.'); }
        });
      });
    var n = bg.querySelector('#ap-n'), l = bg.querySelector('#ap-l');
    n.addEventListener('input', function () { if (!l.dataset.t) l.value = (n.value.trim().split(/\s+/)[0] || '').toLowerCase().replace(/[^a-z0-9._-]/g, ''); });
    l.addEventListener('input', function () { l.dataset.t = '1'; });
  }

  /* ═══ Billing ═══ */
  function pageBilling() {
    var p = P.data.package, c = contact();
    if (!p) { $('content').innerHTML = head('Billing', '') + '<div class="card"><div class="card-b">Your package details are being added. Call ' + esc(c.phone) + ' if you need them now.</div></div>'; return; }
    var s = new Date(p.term_start + 'T00:00:00'), e = new Date(p.term_end + 'T00:00:00'), pct = Math.max(0, Math.min(100, Math.round(100 * (Date.now() - s) / (e - s))));
    var sup = p.support, supPct = sup ? Math.max(0, Math.min(100, Math.round(100 * sup.days_left / 90))) : 0;
    var incl = (p.inclusions || []).filter(function (x) { return !/IT support/i.test(x); });
    var icons = [I.server, I.db, I.mail, I.shield];
    var desc = { 'Dedicated website hosting': 'Your own server, kept online, fast and up to date.', 'Database management': 'Your member and site data, maintained and tuned.', 'Business email hosting': 'Professional email on your own domain.', 'Backups and security management': 'Encrypted nightly backups, certificates and protection.' };
    $('content').innerHTML = head('Billing', 'Your package with LevelUpGrowth.') + '<div class="stack">' +
      '<div class="card hero"><div><span class="pill ' + (p.active ? 'ok' : 'warn') + '">' + (p.active ? I.check.replace('<svg', '<svg style="width:12px;height:12px"') + 'Active' : 'Renewal due') + '</span>' +
        '<h2>' + esc(p.name) + '</h2><p>Three-year term, paid in full. Nothing more is due until ' + fmtDate(p.term_end, true) + '.</p>' +
        '<div style="margin-top:22px"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--t3);margin-bottom:8px"><span>' + fmtDate(p.term_start) + '</span><span>' + p.days_left.toLocaleString() + ' days left</span><span>' + fmtDate(p.term_end) + '</span></div><div class="bar"><i style="width:' + Math.max(pct, 2) + '%"></i></div></div></div>' +
        '<dl class="kv"><dt>Amount paid</dt><dd style="font:700 22px var(--fh)">' + money(p.currency, p.amount) + '</dd><dt>Paid on</dt><dd>' + fmtDate(p.paid_at) + '</dd><dt>Term</dt><dd>3 years</dd><dt>Valid until</dt><dd>' + fmtDate(p.term_end) + '</dd><dt>Renewal date</dt><dd>' + fmtDate(p.term_end) + '</dd></dl></div>' +
      '<div class="grid g-bill">' +
        '<div class="card"><div class="card-h"><div><h2>What your package includes</h2><p>Run and looked after by LevelUpGrowth.</p></div></div><div class="card-b">' +
          incl.map(function (x, i) { return '<div class="check"><div class="ic">' + (icons[i] || I.check) + '</div><div><b>' + esc(x) + '</b><span>' + esc(desc[x] || '') + '</span></div></div>'; }).join('') + '</div></div>' +
        (sup ? '<div class="card"><div class="card-h"><div><h2>IT support</h2><p>' + esc(sup.label || '') + '</p></div><span class="pill ' + (sup.active ? 'ok' : '') + '">' + (sup.active ? 'Active' : 'Ended') + '</span></div><div class="card-b" style="text-align:center">' +
          '<div class="ring" style="--v:' + supPct + '"><div><div><b>' + sup.days_left + '</b><span>days left</span></div></div></div>' +
          '<div style="margin-top:16px;color:var(--t2);font-size:13px">' + (sup.active ? 'Included until ' + fmtDate(sup.until, true) + '.' : 'Ended ' + fmtDate(sup.until, true) + '. Ongoing support can be added at any time.') + '</div>' +
          '<div style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap"><a class="btn sm" href="tel:' + esc(c.phone.replace(/\s/g, '')) + '">' + I.phone + 'Call support</a>' + (c.email ? '<a class="btn sm" href="mailto:' + esc(c.email) + '">' + I.mail + 'Email</a>' : '') + '</div></div></div>' : '') +
      '</div>' +
      '<div class="card"><div class="card-h"><div><h2>Payments</h2><p>Every payment on this account.</p></div></div>' +
        '<table class="tbl cards"><thead><tr><th>Date</th><th>Description</th><th>Reference</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>' +
        '<tr><td>' + fmtDate(p.paid_at) + '</td><td class="full"><b>' + esc(p.name) + '</b><div style="font-size:12.5px;color:var(--t3)">' + fmtDate(p.term_start) + ' – ' + fmtDate(p.term_end) + '</div></td><td>' + (p.invoice_ref ? 'Invoice ' + esc(p.invoice_ref) : '—') + '</td><td class="num"><b>' + money(p.currency, p.amount) + '</b></td><td><span class="pill ok">Paid</span></td></tr>' +
        '</tbody></table></div>' +
      '<div class="card"><div class="card-h"><div><h2>Documents</h2><p>Copies for your records.</p></div></div>' +
        (p.invoice_ref ? '<div class="doc"><div class="ic">' + I.doc + '</div><div><b>Invoice ' + esc(p.invoice_ref) + '</b><span>' + esc(p.name) + ' · ' + fmtDate(p.paid_at) + '</span></div><div class="r"><span class="pill">On request</span></div></div>' : '') +
        (p.receipt_ref ? '<div class="doc"><div class="ic">' + I.doc + '</div><div><b>Official receipt ' + esc(p.receipt_ref) + '</b><span>Paid in full · ' + money(p.currency, p.amount) + '</span></div><div class="r">' + (p.has_receipt ? '<button class="btn sm" id="dl">' + I.down + 'Download PDF</button>' : '<span class="pill">On request</span>') + '</div></div>' : '') +
      '</div>' +
    '</div>';
    var dl = $('dl'); if (dl) dl.onclick = function () {
      fetch(API + q('managed/receipt'), { headers: { Authorization: 'Bearer ' + (localStorage.getItem('lu_token') || '') } })
        .then(function (r) { if (!r.ok) throw 0; return r.blob(); })
        .then(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Receipt-' + (p.receipt_ref || '') + '.pdf'; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000); })
        .catch(function () { toast('The receipt could not be downloaded just now.'); });
    };
  }

  /* ═══ Account ═══ */
  function pageAccount() {
    var u = P.data.user || {}, c = contact(), th = localStorage.getItem('lu_theme') || 'dark';
    var role = { owner: 'Owner', admin: 'Administrator', member: 'Member', viewer: 'Viewer' }[u.role] || 'Member';
    $('content').innerHTML = head('Account', 'Your sign-in and preferences.') + '<div class="stack">' +
      '<div class="card prof"><div class="ini" style="background:' + hue(u.email || '') + '">' + esc(initials(u.name || u.email)) + '</div><div style="min-width:0"><h2>' + esc(u.name || '') + '</h2><p>' + esc(u.email || '') + '</p>' +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><span class="pill info">' + esc(role) + '</span><span class="pill">' + esc(P.data.workspace.name) + '</span></div></div></div>' +
      '<div class="card"><div class="card-h"><div><h2>Security</h2><p>Keep your sign-in safe.</p></div></div>' +
        '<div class="row"><div><b>Password</b><span>Use at least 10 characters with letters and numbers.</span></div><button class="btn" id="pw">Change password</button></div>' +
        '<div class="row"><div><b>Sign out</b><span>Ends your session on this device.</span></div><button class="btn" id="so">' + I.out + 'Sign out</button></div>' +
      '</div>' +
      '<div class="card"><div class="card-h"><div><h2>Appearance</h2><p>Choose how the portal looks on this device.</p></div></div>' +
        '<div class="row"><div><b>Theme</b><span>Dark, light, or follow your device.</span></div><div class="seg" style="min-width:220px" id="acc-th">' +
          ['dark', 'light', 'system'].map(function (t) { return '<button type="button" role="radio" aria-checked="' + (t === th) + '" data-t="' + t + '">' + { dark: 'Dark', light: 'Light', system: 'Auto' }[t] + '</button>'; }).join('') + '</div></div>' +
      '</div>' +
      '<div class="card"><div class="card-h"><div><h2>Support</h2><p>Your hosting and email are looked after by LevelUpGrowth.</p></div></div>' +
        '<div class="row"><div><b>Phone</b><span>' + esc(c.phone) + '</span></div><a class="btn" href="tel:' + esc(c.phone.replace(/\s/g, '')) + '">' + I.phone + 'Call</a></div>' +
        (c.email ? '<div class="row"><div><b>Email</b><span>' + esc(c.email) + '</span></div><a class="btn" href="mailto:' + esc(c.email) + '">' + I.mail + 'Write</a></div>' : '') +
      '</div>' +
    '</div>';
    $('pw').onclick = changePw; $('so').onclick = signOut;
    $('acc-th').querySelectorAll('button').forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute('data-t')); pageAccount(); }; });
  }
  function changePw() {
    dialog('Change password',
      '<div class="field"><label class="lbl" for="pw-c">Current password</label><input class="inp" id="pw-c" type="password" autocomplete="current-password"></div>' +
      '<div class="field"><label class="lbl" for="pw-n">New password</label><input class="inp" id="pw-n" type="password" autocomplete="new-password"><div class="hint">At least 10 characters, with letters and numbers.</div></div>' +
      '<div class="field"><label class="lbl" for="pw-r">Repeat new password</label><input class="inp" id="pw-r" type="password" autocomplete="new-password"></div>',
      'Change password', function (d) {
        var cu = d.el.querySelector('#pw-c').value, n = d.el.querySelector('#pw-n').value, n2 = d.el.querySelector('#pw-r').value, bad = function (m) { d.msg.className = 'msg bad'; d.msg.textContent = m; };
        if (n.length < 10 || !/[A-Za-z]/.test(n) || !/\d/.test(n)) return bad('Use at least 10 characters with letters and numbers.');
        if (n !== n2) return bad('The two new passwords do not match.');
        d.ok.disabled = true;
        req('PUT', 'auth/password', { current_password: cu, password: n, password_confirmation: n2 }).then(function (r) {
          if (r.ok) { d.close(); toast('Your password is changed.'); } else { d.ok.disabled = false; bad((r.json && r.json.message) || 'That did not work.'); }
        });
      });
  }

  /* ── theme, sign out ── */
  function applyTheme(t) {
    var l = t === 'light' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    if (l) document.documentElement.setAttribute('data-theme', 'light'); else document.documentElement.removeAttribute('data-theme');
    document.querySelector('meta[name="theme-color"]').setAttribute('content', l ? '#F7F6F4' : '#0F1117');
    document.querySelectorAll('#theme-seg button').forEach(function (b) { b.setAttribute('aria-checked', b.getAttribute('data-t') === t ? 'true' : 'false'); });
  }
  function setTheme(t) { try { localStorage.setItem('lu_theme', t); } catch (e) {} applyTheme(t); req('PUT', 'user/preferences', { theme: t }); }
  function signOut() {
    var rt = localStorage.getItem('lu_refresh_token'), done = function () { ['lu_token', 'lu_refresh_token', 'lu_user', 'lu_user_id'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} }); location.replace('/app/'); };
    (rt ? req('POST', 'auth/logout', { refresh_token: rt }) : Promise.resolve()).then(done, done);
  }

  document.querySelectorAll('.ni').forEach(function (b) { b.onclick = function () { go(b.getAttribute('data-page')); }; });
  document.querySelectorAll('#theme-seg button').forEach(function (b) { b.onclick = function () { setTheme(b.getAttribute('data-t')); if (P.page === 'account') pageAccount(); }; });
  $('health').onclick = function (e) { e.stopPropagation(); healthPop(); };
  $('me').onclick = function (e) { e.stopPropagation(); meMenu(); };
  $('burger').onclick = function () { drawer(!$('side').classList.contains('open')); };
  $('scrim').onclick = function () { drawer(false); };
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if (P.data && h !== P.page && TITLES[h]) go(h); });
  $('yr').textContent = new Date().getFullYear();
  applyTheme(localStorage.getItem('lu_theme') || 'dark');
  boot();
  setInterval(function () { req('GET', q('managed/portal')).then(function (r) { if (r.ok) { P.data = r.json; paintHealth(); } }); }, 300000);
})();
</script>
</body>
