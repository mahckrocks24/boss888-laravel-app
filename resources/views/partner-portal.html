<style>
/* AFF-PORTAL-2 (Owner 2026-10-07: "6/10, level it up to enterprise level"): the affiliate portal in the marketing site's glass language.
   Tokens follow lug-glass.css; the shell is an aurora ground, a glass top bar, a sidebar on desktop and scrolling tabs on phones.
   Every class the portal's script writes (card, btn, pill, tbl, stat, seg, inp, fld, sb-*, banner, chart, feed, msg, ovl, mdl) keeps its name. */
:root{--bg:#f6f5fb;--ground:#f6f5fb;--s1:rgba(255,255,255,.72);--s2:rgba(17,19,36,.045);--bd:rgba(17,19,36,.09);--bd2:rgba(17,19,36,.16);--t1:#15172a;--t2:#4b4f66;--t3:#7a7f96;--ac:#6d4aff;--ac2:#8b6cff;--ac-ink:#fff;--cu:#0f9f78;--cu-soft:rgba(15,159,120,.14);--ac-soft:rgba(109,74,255,.12);--am:#b7791f;--rd:#d0384a;--rim:rgba(255,255,255,.75);--sh:0 1px 2px rgba(18,20,28,.05),0 12px 36px -14px rgba(50,30,120,.22);--r:12px;--rg:20px;--f:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--fh:Manrope,var(--f);--grad:linear-gradient(135deg,#7C3AED,#3B82F6);--grad2:linear-gradient(90deg,#8C25D2,#4C86DE,#25C6D2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d18;--ground:#0b0d18;--s1:rgba(22,25,44,.72);--s2:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.16);--t1:#eef0fa;--t2:#b4b9cf;--t3:#8289a3;--ac:#a996ff;--ac2:#bcadff;--cu:#4fd1a3;--cu-soft:rgba(79,209,163,.16);--ac-soft:rgba(169,150,255,.16);--am:#e0a84a;--rd:#ff6b7c;--rim:rgba(255,255,255,.12);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 40px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d18;--ground:#0b0d18;--s1:rgba(22,25,44,.72);--s2:rgba(255,255,255,.05);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.16);--t1:#eef0fa;--t2:#b4b9cf;--t3:#8289a3;--ac:#a996ff;--ac2:#bcadff;--cu:#4fd1a3;--cu-soft:rgba(79,209,163,.16);--ac-soft:rgba(169,150,255,.16);--am:#e0a84a;--rd:#ff6b7c;--rim:rgba(255,255,255,.12);--sh:0 1px 2px rgba(0,0,0,.4),0 14px 40px -14px rgba(0,0,0,.6);color-scheme:dark}
/* SCROLLER-1: the same thin page scroller as the marketing site (site-glass.css §22) */
html{scrollbar-width:thin;scrollbar-color:rgba(36,30,72,.28) transparent}html::-webkit-scrollbar{width:10px;height:10px}html::-webkit-scrollbar-track{background:transparent}html::-webkit-scrollbar-thumb{background:rgba(36,30,72,.28);border-radius:10px;border:3px solid transparent;background-clip:content-box}
@media (prefers-color-scheme:dark){html{scrollbar-color:rgba(255,255,255,.26) transparent}html::-webkit-scrollbar-thumb{background:rgba(255,255,255,.26);background-clip:content-box}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t1);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh;position:relative}
a{color:var(--ac)}button{font:inherit}
/* the aurora ground (static; phones never blur) */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.aurora i:nth-child(1){width:560px;height:560px;left:-180px;top:-200px;background:radial-gradient(closest-side,#c4b5fd,transparent)}
.aurora i:nth-child(2){width:520px;height:520px;right:-160px;top:12%;background:radial-gradient(closest-side,#99f6e4,transparent)}
.aurora i:nth-child(3){width:600px;height:600px;left:30%;bottom:-260px;background:radial-gradient(closest-side,#bfdbfe,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aurora i{opacity:.28}}
:root[data-theme="dark"] .aurora i{opacity:.28}
@media (max-width:899px){.aurora i{filter:none;opacity:.35;background:radial-gradient(closest-side,rgba(196,181,253,.6),transparent)}}
/* glass */
.glass,.card,.top,.mdl,.side,.auth-card{background:var(--s1);border:1px solid var(--bd);box-shadow:inset 0 1px 0 var(--rim),var(--sh);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
@media (max-width:899px){.glass,.card,.top,.mdl,.side,.auth-card{-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--bg) 70%,#fff 30%)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .glass,:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .top,:root:not([data-theme="light"]) .mdl,:root:not([data-theme="light"]) .side,:root:not([data-theme="light"]) .auth-card{background:#161a2e}}}
/* top bar */
.top{position:sticky;top:0;z-index:5;border-radius:0;border-left:0;border-right:0;border-top:0;box-shadow:none}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;font:700 16px/1 var(--fh);letter-spacing:-.01em;color:var(--t1);text-decoration:none}.brand img{width:28px;height:28px;border-radius:8px}
.brand small{font:600 12px/1 var(--f);color:var(--t2);padding:5px 9px;border:1px solid var(--bd);border-radius:999px;background:var(--s2)}
.sp{flex:1}.who{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;display:inline-flex;align-items:center;gap:8px}
.who:before{content:attr(data-ini);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font:700 12px/1 var(--f)}
#signout{white-space:nowrap}@media (max-width:520px){.who{display:none}.brand small{display:none}}
/* layout */
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:22px 16px 72px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:76px;border-radius:var(--rg);padding:10px;display:flex;flex-direction:column;gap:4px}
.side .tabs{display:flex;flex-direction:column;gap:4px;margin:0;border:0;overflow:visible}
.side .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--t2);font-weight:600;font-size:14px;cursor:pointer}
.side .tab:hover{background:var(--s2);color:var(--t1)}
.side .tab[aria-selected="true"]{background:var(--ac-soft);color:var(--t1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
.side .tab svg{width:18px;height:18px;flex:none;color:var(--t3)}.side .tab[aria-selected="true"] svg{color:var(--ac)}
.side-foot{margin-top:8px;padding-top:10px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.side-foot .btn{width:100%}
.main{min-width:0}
@media (max-width:899px){.shell{display:block}.side{position:static;padding:6px;margin:0 0 16px;border-radius:14px}.side .tabs{flex-direction:row;overflow-x:auto;scrollbar-width:none}.side .tabs::-webkit-scrollbar{display:none}.side .tab{width:auto;white-space:nowrap;padding:9px 12px}.side .tab svg{display:none}.side-foot{display:none}}
/* type */
h1{font:800 clamp(24px,3vw,32px)/1.1 var(--fh);letter-spacing:-.025em;margin:0 0 6px;color:var(--t1)}
h2{font:700 17px/1.25 var(--fh);margin:0 0 4px;letter-spacing:-.01em;color:var(--t1)}
.sub{color:var(--t2);margin:0 0 18px;font-size:14px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.hero{display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:4px 0 18px}
.hero .sub{margin:0;max-width:62ch}
/* cards and grids */
.card{border-radius:var(--rg);padding:20px}.card+.card{margin-top:14px}.grid>.card+.card{margin-top:0}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media (max-width:480px){.g4{grid-template-columns:1fr 1fr}}
.stat{position:relative;overflow:hidden}
.stat .k{font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font:800 28px/1.1 var(--fh);letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--t1)}
.stat .h{font-size:12.5px;color:var(--t3);margin-top:4px}
.stat.hi .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .ico{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac)}.stat .ico svg{width:16px;height:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid transparent;background:var(--grad);color:#fff;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -10px rgba(60,24,150,.6);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--s1);color:var(--t1);border-color:var(--bd2);box-shadow:inset 0 1px 0 var(--rim)}.btn.ghost:hover{background:var(--s2)}
.btn.quiet{background:transparent;color:var(--t2);border-color:transparent;box-shadow:none}.btn.quiet:hover{color:var(--t1);background:var(--s2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{background:var(--rd);box-shadow:none}.btn.danger:hover{filter:brightness(1.08)}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.fld label{font-size:13px;font-weight:600;color:var(--t2)}
.inp{width:100%;min-height:44px;padding:0 14px;border-radius:var(--r);border:1px solid var(--bd2);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--t1);font:inherit;font-size:15px}
.inp:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
textarea.inp{min-height:84px;padding:10px 14px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.inp{flex:1 1 220px}
.err{color:var(--rd);font-size:13px;margin:4px 0 10px}.ok{color:var(--cu);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;color:var(--t2)}.chk .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd2);display:grid;place-items:center;margin-top:1px;background:var(--s1)}.chk[aria-checked="true"] .box{background:var(--ac);border-color:var(--ac)}.chk[aria-checked="true"] .box:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px}.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;color:var(--t2);font-weight:600;font-size:13px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--s1);color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);padding:0 10px 10px;white-space:nowrap}.tbl td{padding:12px 10px;border-top:1px solid var(--bd);vertical-align:middle}.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover td{background:var(--s2)}
@media (max-width:700px){.tbl.cards thead{display:none}.tbl.cards tr{display:block;border-top:1px solid var(--bd);padding:10px 0}.tbl.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 2px}.tbl.cards td:before{content:attr(data-l);color:var(--t3);font-size:12px;font-weight:600}.tbl.cards .num{text-align:right}.tbl tbody tr:hover td{background:transparent}}
.mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--s2);color:var(--t2);white-space:nowrap}.pill.g{background:var(--cu-soft);color:var(--cu)}.pill.a{background:rgba(183,121,31,.14);color:var(--am)}.pill.p{background:var(--ac-soft);color:var(--ac)}
.pill.g:before,.pill.p:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.link{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 8px 8px 12px;min-width:0}.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t1)}
.empty{color:var(--t3);text-align:center;padding:28px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--t1);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s;pointer-events:none;z-index:50}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* the door: sign in and apply */
.auth{position:relative;z-index:1;max-width:1040px;margin:clamp(20px,6vh,64px) auto 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:28px;align-items:center}
.auth-copy{display:flex;flex-direction:column;gap:14px}

.auth-copy ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:8px}.auth-copy li{display:flex;gap:10px;align-items:flex-start;color:var(--t2);font-size:15px}.auth-copy li svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--cu)}

.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.code .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}

.sb-lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}.sb-lbl .you{color:var(--ac)}.sb-lbl .them{color:var(--cu)}

.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}.subnav button{border:1px solid var(--bd);background:var(--s1);color:var(--t2);font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer}.subnav button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
.lead-hd{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.tcode{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border:1.5px dashed color-mix(in srgb,var(--ac) 55%,transparent);border-radius:12px;background:var(--ac-soft)}.tcode b{font:700 18px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}

<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="top-in">
  <a class="brand" href="/affiliates/"><img src="/img/logo-icon-40.png" alt="">LevelUpGrowth <small>Affiliate Program</small></a>
  <span class="sp"></span><span class="who" id="who" data-ini=""></span>
  <button class="btn quiet sm hide" id="signout" type="button">Sign out</button>
</div></header>
<main class="wrap" id="app"><div class="card" style="max-width:520px;margin:40px auto"><div class="skeleton" style="width:40%"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var A = document.getElementById('app'), S = { me: null, tab: 'overview', days: 30, plan: 199 };
  var PLANS = [['Starter', 19], ['AI Lite', 49], ['Growth', 99], ['Pro', 199], ['Agency', 399]], DOMAIN = 18.17;
  function tok() { try { return localStorage.getItem('lu_partner_token') || localStorage.getItem('lu_token') || ''; } catch (e) { return ''; } }
  function rtok() { try { return localStorage.getItem('lu_partner_refresh') || localStorage.getItem('lu_refresh_token') || ''; } catch (e) { return ''; } }
  function save(j) { try { localStorage.setItem('lu_partner_token', j.access_token); if (j.refresh_token) localStorage.setItem('lu_partner_refresh', j.refresh_token); } catch (e) {} }
  function clearTok() { try { localStorage.removeItem('lu_partner_token'); localStorage.removeItem('lu_partner_refresh'); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function usd(minor) { var n = (minor || 0) / 100; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function money(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function day(s) { if (!s) return '—'; var d = new Date(String(s).replace(' ', 'T') + (String(s).length <= 19 ? 'Z' : '')); return isNaN(d) ? s : d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200); }
  function teamParam() { try { return (new URLSearchParams(location.search).get('team') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24); } catch (e) { return ''; } }
  // a dialog drawn by the page (never the browser's own): resolves true / false, or the text typed when a field is asked for
  function modal(o) {
    return new Promise(function (res) {
      var ov = document.createElement('div'); ov.className = 'ovl';
      ov.innerHTML = '<div class="mdl" role="dialog" aria-modal="true" aria-labelledby="mdl-t"><h2 id="mdl-t">' + esc(o.title) + '</h2>' + (o.body ? '<p class="sub" style="margin:0">' + o.body + '</p>' : '') +
        (o.field ? '<div class="fld" style="margin:14px 0 0"><label for="mdl-f">' + esc(o.field) + '</label><textarea class="inp" id="mdl-f" maxlength="300"></textarea></div>' : '') +
        '<div class="row"><button class="btn ghost" type="button" data-x="0">' + esc(o.cancel || 'Cancel') + '</button><button class="btn' + (o.danger ? ' danger' : '') + '" type="button" data-x="1">' + esc(o.ok || 'OK') + '</button></div></div>';
      document.body.appendChild(ov);
      var done = function (v) { document.removeEventListener('keydown', key); ov.remove(); res(v); };
      var key = function (e) { if (e.key === 'Escape') done(false); };
      document.addEventListener('keydown', key);
      ov.addEventListener('click', function (e) { if (e.target === ov) return done(false); var x = e.target.getAttribute && e.target.getAttribute('data-x'); if (x === '0') done(false); if (x === '1') done(o.field ? ($('mdl-f').value.trim() || '') : true); });
      (o.field ? $('mdl-f') : ov.querySelector('[data-x="1"]')).focus();
    });
  }
  function copy(text) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied'); }, function () { window.prompt('Copy this:', text); }); }
  var refreshing = null;
  function api(method, path, body, retry) {
    var h = { 'Accept': 'application/json' }; if (body) h['Content-Type'] = 'application/json'; var t = tok(); if (t) h.Authorization = 'Bearer ' + t;
    return fetch('/api' + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && !retry && rtok()) {
          refreshing = refreshing || fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ refresh_token: rtok() }) })
            .then(function (x) { return x.json().then(function (k) { if (x.ok && k.access_token) { save(k); return true; } return false; }); }).catch(function () { return false; }).then(function (v) { refreshing = null; return v; });
          return refreshing.then(function (okk) { return okk ? api(method, path, body, true) : { status: 401, ok: false, j: j }; });
        }
        return { status: r.status, ok: r.ok, j: j };
      });
    });
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    if (!tok()) { try { var q = new URLSearchParams(location.search); if (q.get('apply') || q.get('team')) return apply(false); } catch (e) {} return signin(); }
    api('GET', '/partner/me').then(function (r) {
      if (r.status === 401) { clearTok(); return signin(); }
      if (!r.ok) { A.innerHTML = '<div class="card empty">We could not load your affiliate account. Please try again.</div>'; return; }
      S.me = r.j; $('who').textContent = r.j.user.name; $('who').setAttribute('data-ini', (r.j.user.name || '?').trim().charAt(0).toUpperCase()); $('signout').classList.remove('hide');
      var p = r.j.partner;
      if (!p) return apply(true);
      if (p.status === 'pending') return note('Application received', 'Thanks, ' + esc(r.j.user.name) + '. We review every application by hand, usually within 2 working days, and email you at ' + esc(r.j.user.email) + '.', '<div class="link" style="margin-top:14px"><code>' + esc(p.channel_url || '') + '</code></div>');
      if (p.status === 'rejected') return note('About your application', esc(p.decision_note || 'We could not approve your application this time.'), '<p class="sub" style="margin-top:12px">You can write to us if your channel has changed.</p>');
      if (p.status !== 'approved') return note('Your affiliate account is ' + esc(p.status), 'Write to us if you think this is a mistake.', '');
      render(); afterCheckout();
    });
  }
  $('signout').addEventListener('click', function () { clearTok(); location.reload(); });
  function note(t, body, extra) { A.innerHTML = '<div class="auth one"><div class="auth-card"><h1>' + t + '</h1><p class="sub">' + body + '</p>' + extra + '</div></div>'; }
  var CHK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  // the door's left column: what the programme is, in the marketing page's words
  function authCopy(title) {
    return '<div class="auth-copy"><span class="eyebrow">LevelUpGrowth Affiliate Program</span><h1>' + title + '</h1>' +
      '<ul><li>' + CHK + '<span>Up to 20% of each of their first 6 monthly payments, split your way between their discount and your commission.</span></li>' +
      '<li>' + CHK + '<span>Codes only: no links, no cookies. A business is yours when it signs up with your code.</span></li>' +
      '<li>' + CHK + '<span>Paid on the 15th by PayPal or Wise, from $50, after a 30-day hold.</span></li>' +
      '<li>' + CHK + '<span>One login for your affiliate account and your own business on LevelUpGrowth.</span></li></ul></div>';
  }

  function signin(msg) {
    A.innerHTML = '<div class="auth">' + authCopy('Your codes, your referrals, <span class="grad">your earnings.</span>') + '<div class="auth-card"><span class="eyebrow">Affiliate login</span><h1 style="margin-top:6px">Welcome back</h1><p class="sub">Sign in with your LevelUpGrowth login.</p>' +
      '<form id="f-in"><div class="fld"><label for="in-e">Email</label><input class="inp" id="in-e" type="email" autocomplete="email" required></div>' +
      '<div class="fld"><label for="in-p">Password</label><input class="inp" id="in-p" type="password" autocomplete="current-password" required></div>' +
      '<p class="err" id="in-err" ' + (msg ? '' : 'hidden') + '>' + esc(msg || '') + '</p><button class="btn" style="width:100%" type="submit">Sign in</button></form>' +
      '<p class="sub" style="margin:16px 0 0;text-align:center">New here? <a href="#" id="go-apply">Apply to become an affiliate</a> · <a href="/affiliates/">About the programme</a></p></div></div>';
    $('go-apply').addEventListener('click', function (e) { e.preventDefault(); apply(false); });
    $('f-in').addEventListener('submit', function (e) {
      e.preventDefault(); var b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Signing in…';
      api('POST', '/auth/login', { email: $('in-e').value.trim(), password: $('in-p').value }).then(function (r) {
        if (r.ok && r.j.access_token) { save(r.j); return boot(); }
        b.disabled = false; b.textContent = 'Sign in'; var er = $('in-err'); er.hidden = false;
        er.textContent = r.status === 429 ? 'Too many attempts. Try again in a few minutes.' : 'That email and password do not match.';
      });
    });
  }

  function apply(signedIn) {
    var who = signedIn && S.me ? S.me.user : null;
    A.innerHTML = '<div class="auth">' + authCopy('Recommend us. <span class="grad">Earn while their business grows.</span>') + '<div class="auth-card"><span class="eyebrow">Application</span><h1 style="margin-top:6px">Become an affiliate</h1>' +
      '<p class="sub">Share your own code. On every business that signs up with it, you choose how to split the reward: up to 20% of their monthly plan for 6 months, 15% of a yearly plan, 10% of new domains, shared between their discount and your commission.</p>' +
      '<form id="f-ap">' + (who ? '<p class="sub">Applying as <b>' + esc(who.name) + '</b> (' + esc(who.email) + ').</p>' :
        '<div class="fld"><label for="ap-n">Your name</label><input class="inp" id="ap-n" autocomplete="name" required></div>' +
        '<div class="fld"><label for="ap-e">Email</label><input class="inp" id="ap-e" type="email" autocomplete="email" required></div>' +
        '<div class="fld"><label for="ap-p">Password</label><input class="inp" id="ap-p" type="password" autocomplete="new-password" required><span class="sub" style="margin:0;font-size:12px">At least 8 characters, one capital letter and one number.</span></div>') +
      '<div class="fld"><label for="ap-d">Name to show on your codes <span style="color:var(--t3);font-weight:400">optional</span></label><input class="inp" id="ap-d" maxlength="120" placeholder="Your channel or brand name"></div>' +
      '<div class="fld"><label for="ap-c">Where you publish</label><input class="inp" id="ap-c" required placeholder="youtube.com/@yourchannel, a blog, a page"></div>' +
      '<div class="fld"><label for="ap-a">Your audience <span style="color:var(--t3);font-weight:400">optional</span></label><textarea class="inp" id="ap-a" maxlength="500" placeholder="Who watches or reads you, and roughly how many"></textarea></div>' +
      // RFC-0028: joining a Team Leader's team (codes only: the code is typed, or filled in from an invitation)
      '<div class="fld"><label for="ap-team">Team code <span style="color:var(--t3);font-weight:400">optional, if a Team Leader invited you</span></label><input class="inp" id="ap-team" maxlength="24" placeholder="e.g. CHEFREDTEAM" style="text-transform:uppercase;font-family:ui-monospace,monospace" autocomplete="off" value="' + esc(teamParam()) + '"></div>' +
      '<div class="chk" id="ap-t" role="checkbox" aria-checked="false" tabindex="0"><span class="box"></span><span>I accept the <a href="/legal/affiliates/" target="_blank" rel="noopener">affiliate terms</a>, including saying clearly that my code is an affiliate code.</span></div>' +
      '<p class="err" id="ap-err" hidden></p><button class="btn" style="width:100%;margin-top:14px" type="submit">Send application</button></form>' +
      (who ? '' : '<p class="sub" style="margin:16px 0 0;text-align:center">Already have an account? <a href="#" id="go-in">Sign in</a> and apply from there.</p>') + '</div></div>';
    var t = $('ap-t'); var tog = function () { t.setAttribute('aria-checked', t.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); };
    t.addEventListener('click', function (e) { if (e.target.tagName !== 'A') tog(); }); t.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tog(); } });
    if ($('go-in')) $('go-in').addEventListener('click', function (e) { e.preventDefault(); signin(); });
    $('f-ap').addEventListener('submit', function (e) {
      e.preventDefault(); var er = $('ap-err'); er.hidden = true; var b = e.target.querySelector('button[type=submit]');
      var body = { channel_url: $('ap-c').value.trim(), audience: $('ap-a').value.trim(), display_name: $('ap-d').value.trim(), accept_terms: t.getAttribute('aria-checked') === 'true', team_code: $('ap-team').value.trim() || null };
      if (!body.accept_terms) { er.textContent = 'Please accept the affiliate terms.'; er.hidden = false; return; }
      if (!who) { body.name = $('ap-n').value.trim(); body.email = $('ap-e').value.trim(); body.password = $('ap-p').value; }
      b.disabled = true; b.textContent = 'Sending…';
      api('POST', who ? '/partner/apply' : '/partners/apply', body).then(function (r) {
        if (r.ok) { if (r.j.access_token) save(r.j); return boot(); }
        b.disabled = false; b.textContent = 'Send application';
        var j = r.j || {}, m = j.error || (j.errors ? j.errors[Object.keys(j.errors)[0]][0] : '') || j.message || 'That did not go through. Please try again.';
        er.textContent = m; er.hidden = false;
        if (j.code === 'has_account') { er.innerHTML = esc(m) + ' <a href="#" id="go-in2">Sign in</a>'; $('go-in2').addEventListener('click', function (x) { x.preventDefault(); signin(); }); }
      });
    });
  }

  // ---------------------------------------------------------------- the portal
  // codes only (Owner 2026-10-05: "remove the custom URL and just do vouchers"): no links tab, no clicks
  var TABS = [['overview', 'Overview'], ['referrals', 'Referrals'], ['codes', 'Codes'], ['money', 'Earnings']];
  // RFC-0028: a Team Leader gets a Team tab next to their own
  function tabs() { var t = TABS.slice(); if (S.me && S.me.partner && S.me.partner.tier === 'leader') t.splice(1, 0, ['team', 'Team']); return t; }
  function render() {
    var p = S.me.partner;

    var biz = S.me.has_workspace
      ? '<a class="btn ghost sm" href="/app/">Open my business workspace &rarr;</a>'
      : '<button class="btn ghost sm" type="button" id="open-biz">Open a business account</button>';
    var ICO = { overview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
      referrals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      codes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
      money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>',
      team: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m23 11-3-3-3 3M20 8v8"/></svg>' };
    A.innerHTML = '<div class="shell"><aside class="side"><nav class="tabs" role="tablist">' + tabs().map(function (t) { return '<button class="tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + (ICO[t[0]] || '') + t[1] + '</button>'; }).join('') + '</nav>' +
        '<div class="side-foot"><span class="eyebrow" style="padding:0 12px">Your business</span>' + (S.me.has_workspace ? biz.replace(' sm', '') : '<span class="sub" style="margin:0;font-size:12.5px;padding:0 12px">Open one from the card above, same login.</span>') + '<a class="btn quiet sm" href="/affiliates/">About the programme</a></div></aside>' +
      '<div class="main"><div class="hero"><div><span class="eyebrow">Affiliate portal</span><h1>Hi ' + esc(S.me.user.name.split(' ')[0]) + '</h1><p class="sub">Share your codes. A business counts as yours when it signs up with one of them, and you earn on its <b>first 6 monthly payments</b>.</p></div><div class="row" id="hero-biz"></div></div>' +
      (S.me.has_workspace ? '' : '<div class="card offer" style="margin:0 0 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div style="min-width:0;max-width:62ch"><h2 style="margin:0 0 4px">Run your own business on LevelUpGrowth too</h2><p class="sub" style="margin:0">Open a business account with this same login: Arthur builds your website, Sarah and the AI team handle your marketing. Your affiliate account stays as it is.</p></div><button class="btn" type="button" id="open-biz">Open a business account</button></div>') +
      leaderBanner() + '<section id="pane"></section></div></div>';
    if (S.me.has_workspace) $('hero-biz').innerHTML = biz;
    Array.prototype.forEach.call(A.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { S.tab = b.getAttribute('data-t'); try { history.replaceState(null, '', '#' + S.tab); } catch (e) {} render(); }); });
    if ($('open-biz')) $('open-biz').addEventListener('click', function () {
      var card = this.closest('.card');
      if (!card) { card = document.createElement('div'); card.className = 'card'; card.style.marginBottom = '14px'; $('pane').insertBefore(card, $('pane').firstChild); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

      $('biz-name').focus();
      $('biz-go').addEventListener('click', function () {

          if (x.ok && x.j && x.j.access_token) {
            try {
              localStorage.setItem('lu_token', x.j.access_token); if (x.j.refresh_token) localStorage.setItem('lu_refresh_token', x.j.refresh_token);
              if (x.j.current_workspace_id) localStorage.setItem('lu_workspace_id', String(x.j.current_workspace_id));
              if (x.j.user && x.j.user.id) localStorage.setItem('lu_user_id', String(x.j.user.id));
              localStorage.removeItem('lu_user'); localStorage.setItem('lu_boot_action', 'arthur');   // like a sign-up: Arthur first
            } catch (e) {}
            b.textContent = 'Opening your workspace…'; location.href = '/app/'; return;

          var e = $('biz-err'); e.hidden = false; e.textContent = (x.j && (x.j.error || x.j.message)) || 'That did not go through. Please try again.';
        });
      });
    });
    if (S.tab === 'team' && !(S.me.partner.tier === 'leader')) S.tab = 'overview';
    bindLeaderBanner();
    ({ overview: overview, referrals: referrals, codes: codes, money: earnings, team: team })[S.tab]();
  }
  function pane(h) { $('pane').innerHTML = h; }

  // the next payout date (the 15th) and how far the ready balance is from the minimum
