<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Affiliate portal · LevelUpGrowth</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<style>
:root{--bg:#f5f6fa;--s1:#ffffff;--s2:#f0f1f6;--bd:#e3e5ee;--bd2:#cfd3e0;--t1:#12141c;--t2:#4a5063;--t3:#7a8094;--ac:#6d4aff;--ac2:#8b6cff;--ac-ink:#fff;--cu:#0fa47a;--cu-soft:rgba(15,164,122,.14);--ac-soft:rgba(109,74,255,.12);--am:#b7791f;--rd:#d0384a;--sh:0 1px 2px rgba(18,20,28,.06),0 8px 24px rgba(18,20,28,.06);--r:10px;--rg:16px;--f:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f19;--s1:#121725;--s2:#182033;--bd:#232c42;--bd2:#2f3a55;--t1:#eef1f8;--t2:#b3bacb;--t3:#8089a0;--ac:#8b6cff;--ac2:#a48bff;--cu:#2cc79a;--cu-soft:rgba(44,199,154,.16);--ac-soft:rgba(139,108,255,.16);--am:#e0a84a;--rd:#ff6b7c;--sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b0f19;--s1:#121725;--s2:#182033;--bd:#232c42;--bd2:#2f3a55;--t1:#eef1f8;--t2:#b3bacb;--t3:#8089a0;--ac:#8b6cff;--ac2:#a48bff;--cu:#2cc79a;--cu-soft:rgba(44,199,154,.16);--ac-soft:rgba(139,108,255,.16);--am:#e0a84a;--rd:#ff6b7c}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t1);font:400 15px/1.55 var(--f);-webkit-font-smoothing:antialiased}
a{color:var(--ac)}button{font:inherit}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;color:var(--t1);text-decoration:none}.brand img{width:26px;height:26px}.brand small{font-weight:600;color:var(--t3);font-size:13px;padding:2px 8px;border:1px solid var(--bd);border-radius:999px}
.sp{flex:1}.who{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}#signout{white-space:nowrap}@media (max-width:520px){.who{display:none}.brand small{display:none}}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 64px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;border-bottom:1px solid var(--bd)}.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--t2);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}.tab[aria-selected="true"]{color:var(--t1);border-color:var(--ac)}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--t2);margin:0 0 18px;font-size:14px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--rg);padding:18px;box-shadow:var(--sh)}.card+.card{margin-top:14px}.grid>.card+.card{margin-top:0}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.stat .k{font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}.stat .h{font-size:12px;color:var(--t3);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:var(--r);border:1px solid transparent;background:var(--ac);color:var(--ac-ink);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--t1);border-color:var(--bd2)}.btn.ghost:hover{background:var(--s2)}.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.quiet{background:transparent;color:var(--t2);border-color:transparent}.btn.quiet:hover{color:var(--t1);background:var(--s2)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.fld label{font-size:13px;font-weight:600;color:var(--t2)}
.inp{width:100%;min-height:42px;padding:0 13px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--s1);color:var(--t1);font:inherit;font-size:15px}.inp:focus{outline:2px solid var(--ac-soft);border-color:var(--ac)}
textarea.inp{min-height:84px;padding:10px 13px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.inp{flex:1 1 220px}
.err{color:var(--rd);font-size:13px;margin:4px 0 10px}.ok{color:var(--cu);font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;color:var(--t2)}.chk .box{flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd2);display:grid;place-items:center;margin-top:1px;background:var(--s1)}.chk[aria-checked="true"] .box{background:var(--ac);border-color:var(--ac)}.chk[aria-checked="true"] .box:after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px}.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;color:var(--t2);font-weight:600;font-size:13px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--s1);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t3);padding:0 10px 9px;white-space:nowrap}.tbl td{padding:11px 10px;border-top:1px solid var(--bd);vertical-align:top}.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:700px){.tbl.cards thead{display:none}.tbl.cards tr{display:block;border-top:1px solid var(--bd);padding:10px 0}.tbl.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 2px}.tbl.cards td:before{content:attr(data-l);color:var(--t3);font-size:12px;font-weight:600}.tbl.cards .num{text-align:right}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--s2);color:var(--t2);white-space:nowrap}.pill.g{background:var(--cu-soft);color:var(--cu)}.pill.a{background:rgba(183,121,31,.14);color:var(--am)}.pill.p{background:var(--ac-soft);color:var(--ac)}
.link{display:flex;gap:8px;align-items:center;background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:8px 8px 8px 12px;min-width:0}.link code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--t1)}
.empty{color:var(--t3);text-align:center;padding:26px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--t1);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s;pointer-events:none;z-index:50}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.auth{max-width:440px;margin:28px auto}
/* split bar */
.sb{margin:0 0 20px}.sb-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}.sb-t{font-weight:700;font-size:14px}.sb-b{font-size:12px;color:var(--t3)}
.sb-lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}.sb-lbl .you{color:var(--ac)}.sb-lbl .them{color:var(--cu)}
.sb-track{position:relative;height:44px;border-radius:12px;overflow:hidden;background:var(--s2);cursor:pointer;touch-action:none;user-select:none;outline:none;border:1px solid var(--bd)}
.sb-track:focus-visible{box-shadow:0 0 0 3px var(--ac-soft);border-color:var(--ac)}
.sb-them{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cu),color-mix(in srgb,var(--cu) 75%,#fff))}.sb-you{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}.sb-lbl .you{text-align:right}
.sb-ticks{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:var(--tick) 100%;mix-blend-mode:overlay}
.sb-h{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.28),0 0 0 3px rgba(255,255,255,.6);display:grid;place-items:center;transition:left .08s}
.sb-h:before{content:"";width:2px;height:12px;background:var(--bd2);box-shadow:-4px 0 0 var(--bd2),4px 0 0 var(--bd2)}
.sb-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px}.sb-money{font-size:13px;color:var(--t2);margin-top:8px;min-height:20px}.sb-warn{color:var(--am);font-weight:600}
@media (prefers-reduced-motion:reduce){.sb-h,.toast{transition:none}}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="/"><img src="/img/favicon-32.png" alt="">LevelUpGrowth <small>Affiliates</small></a>
  <span class="sp"></span><span class="who" id="who"></span>
  <button class="btn quiet sm hide" id="signout" type="button">Sign out</button>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var A = document.getElementById('app'), S = { me: null, tab: 'overview', days: 30, plan: 199 };
  var PLANS = [['Starter', 19], ['AI Lite', 49], ['Growth', 99], ['Pro', 199], ['Agency', 399]], DOMAIN = 18.17;
  function tok() { try { return localStorage.getItem('lu_partner_token') || localStorage.getItem('lu_token') || ''; } catch (e) { return ''; } }
  function rtok() { try { return localStorage.getItem('lu_partner_refresh') || localStorage.getItem('lu_refresh_token') || ''; } catch (e) { return ''; } }
  function save(j) { try { localStorage.setItem('lu_partner_token', j.access_token); if (j.refresh_token) localStorage.setItem('lu_partner_refresh', j.refresh_token); } catch (e) {} }
  function clearTok() { try { localStorage.removeItem('lu_partner_token'); localStorage.removeItem('lu_partner_refresh'); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }
  function usd(minor) { var n = (minor || 0) / 100; return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function money(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function day(s) { if (!s) return '—'; var d = new Date(String(s).replace(' ', 'T') + (String(s).length <= 19 ? 'Z' : '')); return isNaN(d) ? s : d.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 2200); }
  function copy(text) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied'); }, function () { window.prompt('Copy this:', text); }); }
  var refreshing = null;
  function api(method, path, body, retry) {
    var h = { 'Accept': 'application/json' }; if (body) h['Content-Type'] = 'application/json'; var t = tok(); if (t) h.Authorization = 'Bearer ' + t;
    return fetch('/api' + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401 && !retry && rtok()) {
          refreshing = refreshing || fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ refresh_token: rtok() }) })
            .then(function (x) { return x.json().then(function (k) { if (x.ok && k.access_token) { save(k); return true; } return false; }); }).catch(function () { return false; }).then(function (v) { refreshing = null; return v; });
          return refreshing.then(function (okk) { return okk ? api(method, path, body, true) : { status: 401, ok: false, j: j }; });
        }
        return { status: r.status, ok: r.ok, j: j };
      });
    });
  }

  // ---------------------------------------------------------------- boot
  function boot() {
    if (!tok()) { try { if (new URLSearchParams(location.search).get('apply')) return apply(false); } catch (e) {} return signin(); }
    api('GET', '/partner/me').then(function (r) {
      if (r.status === 401) { clearTok(); return signin(); }
      if (!r.ok) { A.innerHTML = '<div class="card empty">We could not load your affiliate account. Please try again.</div>'; return; }
      S.me = r.j; $('who').textContent = r.j.user.name; $('signout').classList.remove('hide');
      var p = r.j.partner;
      if (!p) return apply(true);
      if (p.status === 'pending') return note('Application received', 'Thanks, ' + esc(r.j.user.name) + '. We review every application by hand, usually within 2 working days, and email you at ' + esc(r.j.user.email) + '.', '<div class="link" style="margin-top:14px"><code>' + esc(p.channel_url || '') + '</code></div>');
      if (p.status === 'rejected') return note('About your application', esc(p.decision_note || 'We could not approve your application this time.'), '<p class="sub" style="margin-top:12px">You can write to us if your channel has changed.</p>');
      if (p.status !== 'approved') return note('Your affiliate account is ' + esc(p.status), 'Write to us if you think this is a mistake.', '');
      render();
    });
  }
  $('signout').addEventListener('click', function () { clearTok(); location.reload(); });
  function note(t, body, extra) { A.innerHTML = '<div class="auth card"><h1>' + t + '</h1><p class="sub">' + body + '</p>' + extra + '</div>'; }

  function signin(msg) {
    A.innerHTML = '<div class="auth"><div class="card"><h1>Affiliate portal</h1><p class="sub">Sign in with your LevelUpGrowth login to see your referrals, links, codes and earnings.</p>' +
      '<form id="f-in"><div class="fld"><label for="in-e">Email</label><input class="inp" id="in-e" type="email" autocomplete="email" required></div>' +
      '<div class="fld"><label for="in-p">Password</label><input class="inp" id="in-p" type="password" autocomplete="current-password" required></div>' +
      '<p class="err" id="in-err" ' + (msg ? '' : 'hidden') + '>' + esc(msg || '') + '</p><button class="btn" style="width:100%" type="submit">Sign in</button></form>' +
      '<p class="sub" style="margin:16px 0 0;text-align:center">New here? <a href="#" id="go-apply">Apply to become an affiliate</a></p></div></div>';
    $('go-apply').addEventListener('click', function (e) { e.preventDefault(); apply(false); });
    $('f-in').addEventListener('submit', function (e) {
      e.preventDefault(); var b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Signing in…';
      api('POST', '/auth/login', { email: $('in-e').value.trim(), password: $('in-p').value }).then(function (r) {
        if (r.ok && r.j.access_token) { save(r.j); return boot(); }
        b.disabled = false; b.textContent = 'Sign in'; var er = $('in-err'); er.hidden = false;
        er.textContent = r.status === 429 ? 'Too many attempts. Try again in a few minutes.' : 'That email and password do not match.';
      });
    });
  }

  function apply(signedIn) {
    var who = signedIn && S.me ? S.me.user : null;
    A.innerHTML = '<div class="auth" style="max-width:560px"><div class="card"><h1>Become a LevelUpGrowth affiliate</h1>' +
      '<p class="sub">Share your link or your own code. On every business you bring, you choose how to split the reward: up to 20% of their monthly plan for 6 months, 15% of a yearly plan, 10% of new domains, shared between their discount and your commission.</p>' +
      '<form id="f-ap">' + (who ? '<p class="sub">Applying as <b>' + esc(who.name) + '</b> (' + esc(who.email) + ').</p>' :
        '<div class="fld"><label for="ap-n">Your name</label><input class="inp" id="ap-n" autocomplete="name" required></div>' +
        '<div class="fld"><label for="ap-e">Email</label><input class="inp" id="ap-e" type="email" autocomplete="email" required></div>' +
        '<div class="fld"><label for="ap-p">Password</label><input class="inp" id="ap-p" type="password" autocomplete="new-password" required><span class="sub" style="margin:0;font-size:12px">At least 8 characters, one capital letter and one number.</span></div>') +
      '<div class="fld"><label for="ap-d">Name to show on your codes <span style="color:var(--t3);font-weight:400">optional</span></label><input class="inp" id="ap-d" maxlength="120" placeholder="Your channel or brand name"></div>' +
      '<div class="fld"><label for="ap-c">Where you publish</label><input class="inp" id="ap-c" required placeholder="youtube.com/@yourchannel, a blog, a page"></div>' +
      '<div class="fld"><label for="ap-a">Your audience <span style="color:var(--t3);font-weight:400">optional</span></label><textarea class="inp" id="ap-a" maxlength="500" placeholder="Who watches or reads you, and roughly how many"></textarea></div>' +
      '<div class="chk" id="ap-t" role="checkbox" aria-checked="false" tabindex="0"><span class="box"></span><span>I accept the <a href="/legal/affiliates/" target="_blank" rel="noopener">affiliate terms</a>, including saying clearly when a link or code is an affiliate link.</span></div>' +
      '<p class="err" id="ap-err" hidden></p><button class="btn" style="width:100%;margin-top:14px" type="submit">Send application</button></form>' +
      (who ? '' : '<p class="sub" style="margin:16px 0 0;text-align:center">Already have an account? <a href="#" id="go-in">Sign in</a> and apply from there.</p>') + '</div></div>';
    var t = $('ap-t'); var tog = function () { t.setAttribute('aria-checked', t.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); };
    t.addEventListener('click', function (e) { if (e.target.tagName !== 'A') tog(); }); t.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tog(); } });
    if ($('go-in')) $('go-in').addEventListener('click', function (e) { e.preventDefault(); signin(); });
    $('f-ap').addEventListener('submit', function (e) {
      e.preventDefault(); var er = $('ap-err'); er.hidden = true; var b = e.target.querySelector('button[type=submit]');
      var body = { channel_url: $('ap-c').value.trim(), audience: $('ap-a').value.trim(), display_name: $('ap-d').value.trim(), accept_terms: t.getAttribute('aria-checked') === 'true' };
      if (!body.accept_terms) { er.textContent = 'Please accept the affiliate terms.'; er.hidden = false; return; }
      if (!who) { body.name = $('ap-n').value.trim(); body.email = $('ap-e').value.trim(); body.password = $('ap-p').value; }
      b.disabled = true; b.textContent = 'Sending…';
      api('POST', who ? '/partner/apply' : '/partners/apply', body).then(function (r) {
        if (r.ok) { if (r.j.access_token) save(r.j); return boot(); }
        b.disabled = false; b.textContent = 'Send application';
        var j = r.j || {}, m = j.error || (j.errors ? j.errors[Object.keys(j.errors)[0]][0] : '') || j.message || 'That did not go through. Please try again.';
        er.textContent = m; er.hidden = false;
        if (j.code === 'has_account') { er.innerHTML = esc(m) + ' <a href="#" id="go-in2">Sign in</a>'; $('go-in2').addEventListener('click', function (x) { x.preventDefault(); signin(); }); }
      });
    });
  }

  // ---------------------------------------------------------------- the portal
  // codes only (Owner 2026-10-05: "remove the custom URL and just do vouchers"): no links tab, no clicks
  var TABS = [['overview', 'Overview'], ['referrals', 'Referrals'], ['codes', 'Codes'], ['money', 'Earnings']];
  function render() {
    var p = S.me.partner;
    A.innerHTML = '<h1>Hi ' + esc(S.me.user.name.split(' ')[0]) + '</h1><p class="sub">Share your codes. A business counts as yours when it signs up with one of them.</p>' +
      '<nav class="tabs" role="tablist">' + TABS.map(function (t) { return '<button class="tab" role="tab" data-t="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + '</button>'; }).join('') + '</nav><section id="pane"></section>';
    Array.prototype.forEach.call(A.querySelectorAll('.tab'), function (b) { b.addEventListener('click', function () { S.tab = b.getAttribute('data-t'); try { history.replaceState(null, '', '#' + S.tab); } catch (e) {} render(); }); });
    ({ overview: overview, referrals: referrals, codes: codes, money: earnings })[S.tab]();
  }
  function pane(h) { $('pane').innerHTML = h; }

  function overview() {
    pane('<p class="empty">Loading…</p>');
    api('GET', '/partner/overview?days=' + S.days).then(function (r) {
      var o = r.j || {}, m = o.money || {}, p = S.me.partner;
      var seg = '<div class="seg" role="group" aria-label="Period">' + [[30, '30 days'], [90, '90 days'], [0, 'All time']].map(function (d) { return '<button data-d="' + d[0] + '" aria-pressed="' + (S.days === d[0]) + '">' + d[1] + '</button>'; }).join('') + '</div>';
      pane('<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>How you are doing</h2>' + seg + '</div>' +
        '<div class="grid g4">' + [['Sign-ups', o.signups, 'with your codes'], ['Paying', o.paying, 'businesses paying now'], ['Active codes', o.codes, 'ready to share'], ['Earned', usd(o.earned_minor), 'in this period']]
          .map(function (s) { return '<div class="card stat"><div class="k">' + s[0] + '</div><div class="v">' + esc(s[1] == null ? 0 : s[1]) + '</div><div class="h">' + s[2] + '</div></div>'; }).join('') + '</div>' +
        '<div class="grid g3" style="margin-top:12px">' + [['Waiting', m.pending, 'held ' + S.me.hold_days + ' days after each payment, in case of refunds'], ['Ready to pay', m.payable, 'paid on the 15th from ' + usd(S.me.min_payout)], ['Paid to you', m.paid, 'all time']]
          .map(function (s) { return '<div class="card stat"><div class="k">' + s[0] + '</div><div class="v">' + usd(s[1]) + '</div><div class="h">' + s[2] + '</div></div>'; }).join('') + '</div>' +
        (o.codes ? '' : '<div class="card" style="margin-top:14px"><h2>Create your first code</h2><p class="sub">A code with no discount keeps the full ' + (p.budgets.monthly / 100) + '% of their monthly plan for ' + S.me.months + ' payments for you. Or give your audience part of it.</p><button class="btn" type="button" id="go-codes">Create a code</button></div>') +
        '<div class="card" style="margin-top:14px"><h2>By code</h2><p class="sub">Make a different code for each video or post to see which one works.</p>' +
          (o.by_code && o.by_code.length ? '<table class="tbl cards"><thead><tr><th>Code</th><th class="num">Sign-ups</th><th class="num">Paying</th><th class="num">Earned</th></tr></thead><tbody>' +
            o.by_code.map(function (s) { return '<tr><td data-l="Code"><b style="font-family:ui-monospace,monospace">' + esc(s.code) + '</b></td><td class="num" data-l="Sign-ups">' + s.signups + '</td><td class="num" data-l="Paying">' + s.paying + '</td><td class="num" data-l="Earned">' + usd(s.earned) + '</td></tr>'; }).join('') + '</tbody></table>'
            : '<p class="empty">No sign-ups with your codes in this period yet.</p>') + '</div>');
      Array.prototype.forEach.call($('pane').querySelectorAll('.seg button'), function (b) { b.addEventListener('click', function () { S.days = +b.getAttribute('data-d'); overview(); }); });
      if ($('go-codes')) $('go-codes').addEventListener('click', function () { S.tab = 'codes'; render(); });
      bindCopy();
    });
  }
  function bindCopy() { Array.prototype.forEach.call($('pane').querySelectorAll('[data-copy]'), function (b) { b.addEventListener('click', function () { copy(b.getAttribute('data-copy')); }); }); }

  function referrals() {
    pane('<p class="empty">Loading…</p>');
    api('GET', '/partner/referrals').then(function (r) {
      var rows = (r.j && r.j.referrals) || [];
      pane('<div class="card"><h2>Businesses you brought</h2><p class="sub">You see who joined and what you earned, never their work or their customers.</p>' +
        (rows.length ? '<table class="tbl cards"><thead><tr><th>Who</th><th>Joined</th><th>Code</th><th>Plan</th><th>Status</th><th class="num">Payments</th><th class="num">Earned</th></tr></thead><tbody>' +
          rows.map(function (x) {
            var pc = x.status === 'Paying' ? 'g' : (x.status === 'Signed up' ? 'p' : '');
            return '<tr><td data-l="Who">' + esc(x.who) + '</td><td data-l="Joined">' + day(x.joined) + '</td><td data-l="Code">' + esc(String(x.via || '').replace(/^code /, '')) + '</td><td data-l="Plan"><span>' + esc(x.plan) + (x.trial ? ' <span class="pill a">trial</span>' : '') + '</span></td><td data-l="Status"><span class="pill ' + pc + '">' + esc(x.status) + '</span></td><td class="num" data-l="Payments">' + esc(x.payments) + '</td><td class="num" data-l="Earned">' + usd(x.earned_minor) + '</td></tr>';
          }).join('') + '</tbody></table>' : '<p class="empty">Nobody yet. Share one of your codes to get started.</p>') + '</div>');
    });
  }

  // ---------------------------------------------------------------- codes and the split bar
  var KINDS = [['monthly', 'Monthly plans', 'first 6 monthly payments'], ['yearly', 'Yearly plans', 'the yearly payment, once'], ['domain', 'Domains', 'new domain registrations']];
  function codes() {
    pane('<p class="empty">Loading…</p>');
    api('GET', '/partner/codes').then(function (r) {
      var cs = (r.j && r.j.codes) || [];
      pane('<div class="card" id="builder"></div><div class="card"><h2>Your codes</h2><p class="sub">Changing a code only affects new customers. Everyone keeps the terms they joined on.</p>' +
        (cs.length ? '<table class="tbl cards"><thead><tr><th>Code</th><th>Customer gets</th><th class="num">Used</th><th>Status</th><th></th></tr></thead><tbody>' + cs.map(function (c) {
          return '<tr><td data-l="Code"><b style="font-family:ui-monospace,monospace">' + esc(c.code) + '</b></td><td data-l="Customer gets" style="color:var(--t2)">' + esc(c.describe) + '<div style="font-size:12px;color:var(--ac)">You earn ' + (c.commission.commission_monthly_bps / 100) + '% monthly' + (S.me.yearly_live ? ', ' + (c.commission.commission_yearly_bps / 100) + '% yearly' : '') + ', ' + (c.commission.commission_domain_bps / 100) + '% domains</div></td>' +
            '<td class="num" data-l="Used">' + c.redemptions + (c.max ? ' / ' + c.max : '') + '</td><td data-l="Status"><span class="pill ' + (c.status === 'active' ? 'g' : '') + '">' + (c.status === 'active' ? 'Active' : 'Paused') + '</span></td>' +
            '<td class="num" data-l=""><button class="btn ghost sm" data-copy="' + esc(c.code) + '">Copy code</button> <button class="btn quiet sm" data-st="' + c.id + '" data-to="' + (c.status === 'active' ? 'paused' : 'active') + '">' + (c.status === 'active' ? 'Pause' : 'Resume') + '</button></td></tr>';
        }).join('') + '</tbody></table>' : '<p class="empty">No codes yet. Create your first one above.</p>') + '</div>');
      bindCopy(); builder();
      Array.prototype.forEach.call($('pane').querySelectorAll('[data-st]'), function (b) { b.addEventListener('click', function () { api('PUT', '/partner/codes/' + b.getAttribute('data-st'), { status: b.getAttribute('data-to') }).then(function (x) { toast(x.j && x.j.ok ? 'Saved' : ((x.j && x.j.error) || 'Not saved')); codes(); }); }); });
    });
  }

  function builder() {
    var p = S.me.partner, B = p.budgets, st = { monthly: 500, yearly: 500, domain: 500 };
    var kinds = KINDS.filter(function (k) { return k[0] !== 'yearly' || S.me.yearly_live; });
    var host = $('builder');
    host.innerHTML = '<h2>Create a code</h2><p class="sub">Drag each bar to split the reward. Left gives you more; right gives the customer a bigger discount.</p>' +
      '<div class="row" style="margin-bottom:16px"><div class="fld" style="flex:1 1 220px;margin:0"><label for="c-code">Code</label><input class="inp" id="c-code" maxlength="20" placeholder="e.g. CHEFRED10" style="text-transform:uppercase;font-family:ui-monospace,monospace" autocomplete="off"></div>' +
      '<div class="fld" style="flex:0 1 auto;margin:0"><label>Show money for</label><div class="seg" id="c-plan">' + PLANS.map(function (x) { return '<button type="button" data-p="' + x[1] + '" aria-pressed="' + (S.plan === x[1]) + '">' + x[0] + '</button>'; }).join('') + '</div></div></div>' +
      '<div class="row" style="margin-bottom:16px;gap:6px"><span style="font-size:13px;color:var(--t3);margin-right:4px">Presets</span>' +
        [['max', 'Max earnings'], ['std', 'Standard 5% off'], ['even', 'Even split'], ['disc', 'Max discount']].map(function (x) { return '<button type="button" class="btn ghost sm" data-pre="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>' +
      kinds.map(function (k) { return '<div class="sb" id="sb-' + k[0] + '"></div>'; }).join('') +
      '<div class="row"><div class="fld" style="flex:1 1 180px;margin:0"><label for="c-end">Ends <span style="color:var(--t3);font-weight:400">optional</span></label><input class="inp" id="c-end" type="text" placeholder="YYYY-MM-DD" inputmode="numeric" maxlength="10"></div>' +
      '<div class="fld" style="flex:1 1 180px;margin:0"><label for="c-max">Use limit <span style="color:var(--t3);font-weight:400">optional</span></label><input class="inp" id="c-max" inputmode="numeric" placeholder="No limit" maxlength="6"></div></div>' +
      '<p class="err" id="c-err" hidden></p><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" id="c-save" type="button">Create code</button></div>';
    function bar(k) {
      var el = $('sb-' + k[0]), max = B[k[0]], v = st[k[0]], you = max - v, pct = max ? (v / max) * 100 : 0;   // the handle sits at the customer's share: right = bigger discount
      var price = k[0] === 'domain' ? DOMAIN : (k[0] === 'yearly' ? S.plan * 10 : S.plan), n = k[0] === 'monthly' ? S.me.months : 1;
      var earn = price * you / 10000, pays = price - price * v / 10000;
      var line = k[0] === 'monthly' ? 'You earn ' + money(earn) + ' a month for ' + n + ' months (' + money(earn * n) + ') · they pay ' + money(pays) + ' a month'
        : (k[0] === 'yearly' ? 'On a ' + money(price) + ' yearly plan: you earn ' + money(earn) + ' once · they pay ' + money(pays) : 'On a .com at ' + money(price) + ': you earn ' + money(earn) + ' · they pay ' + money(pays));
      el.innerHTML = '<div class="sb-hd"><span class="sb-t">' + k[1] + '</span><span class="sb-b">' + (max / 100) + '% to split · ' + k[2] + '</span></div>' +
        '<div class="sb-lbl"><span class="them">Customer saves ' + (v / 100) + '%</span><span class="you">You earn ' + (you / 100) + '%</span></div>' +
        '<div class="sb-track" role="slider" tabindex="0" aria-label="' + k[1] + ' split" aria-valuemin="0" aria-valuemax="' + (max / 100) + '" aria-valuenow="' + (v / 100) + '" aria-valuetext="You earn ' + (you / 100) + '%, customer saves ' + (v / 100) + '%" style="--tick:' + (500 / max * 100) + '%">' +
          '<div class="sb-them" style="width:' + pct + '%"></div><div class="sb-you" style="width:' + (100 - pct) + '%"></div><div class="sb-ticks"></div><div class="sb-h" style="left:' + pct + '%"></div></div>' +
        '<div class="sb-ends"><span>◀ less discount, more for you</span><span>bigger discount, less for you ▶</span></div>' +
        '<div class="sb-money">' + (you === 0 ? '<span class="sb-warn">You earn nothing on this code.</span> ' : '') + line + '</div>';
      var tr = el.querySelector('.sb-track');
      var set = function (bps) { bps = Math.max(0, Math.min(max, Math.round(bps / 100) * 100)); if (bps !== st[k[0]]) { st[k[0]] = bps; bar(k); el.querySelector('.sb-track').focus({ preventScroll: true }); } };
      var at = function (x) { var r = tr.getBoundingClientRect(); var f = Math.max(0, Math.min(1, (x - r.left) / r.width)); set(f * max); };
      tr.addEventListener('pointerdown', function (e) { tr.setPointerCapture(e.pointerId); at(e.clientX); var mv = function (ev) { at(ev.clientX); }; var up = function () { tr.removeEventListener('pointermove', mv); tr.removeEventListener('pointerup', up); }; tr.addEventListener('pointermove', mv); tr.addEventListener('pointerup', up); });
      tr.addEventListener('keydown', function (e) {
        var c = st[k[0]], d = { ArrowRight: 100, ArrowUp: 100, ArrowLeft: -100, ArrowDown: -100, PageUp: 500, PageDown: -500 }[e.key];
        if (e.key === 'Home') { e.preventDefault(); return set(0); } if (e.key === 'End') { e.preventDefault(); return set(max); }
        if (d) { e.preventDefault(); set(c + d); }
      });
    }
    function all() { kinds.forEach(bar); }
    all();
    Array.prototype.forEach.call(host.querySelectorAll('#c-plan button'), function (b) { b.addEventListener('click', function () { S.plan = +b.getAttribute('data-p'); Array.prototype.forEach.call(host.querySelectorAll('#c-plan button'), function (x) { x.setAttribute('aria-pressed', x === b); }); all(); }); });
    Array.prototype.forEach.call(host.querySelectorAll('[data-pre]'), function (b) { b.addEventListener('click', function () {
      var w = b.getAttribute('data-pre');
      kinds.forEach(function (k) { var m = B[k[0]]; st[k[0]] = w === 'max' ? 0 : w === 'disc' ? m : w === 'std' ? Math.min(500, m) : Math.floor(m / 200) * 100; }); all();
    }); });
    $('c-save').addEventListener('click', function () {
      var er = $('c-err'); er.hidden = true; var b = this; b.disabled = true;
      api('POST', '/partner/codes', { code: $('c-code').value, monthly: st.monthly, yearly: S.me.yearly_live ? st.yearly : 0, domain: st.domain, ends_at: $('c-end').value.trim() || null, max: $('c-max').value.trim() || null }).then(function (x) {
        b.disabled = false;
        if (x.j && x.j.ok) { toast('Code ' + x.j.code + ' created'); codes(); return; }
        er.hidden = false; er.textContent = (x.j && (x.j.error || x.j.message)) || 'That did not work.';
      });
    });
  }

  // RFC-0026 section 7: how the affiliate is paid - PayPal or Wise now, a bank account once bank payouts open
  function payoutBox() {
    var box = $('payout-box'); if (!box) return;
    api('GET', '/partner/payout').then(function (r) {
      var d = r.j || {}, ms = d.methods || {}, cur = d.method || (d.bank_available ? 'stripe' : 'paypal'), sel = cur;
      function draw() {
        var keys = Object.keys(ms);
        var h = (d.method ? '<p style="margin:0 0 12px">' + (d.ready ? '<span class="pill g">Ready to be paid</span> ' : '<span class="pill a">Not ready yet</span> ') +
            '<span style="color:var(--t2);font-size:14px">' + esc(ms[d.method] || d.method) + (d.email && d.method !== 'stripe' ? ' · ' + esc(d.email) : '') + '</span></p>' : '<p class="sub" style="margin:0 0 12px">Choose where your money goes. Payouts go out on the 15th once your ready balance is at least ' + usd(S.me.min_payout) + '.</p>') +
          '<div class="seg" role="group" aria-label="Payout method" style="margin-bottom:12px">' + keys.map(function (k) { return '<button type="button" data-pm="' + k + '" aria-pressed="' + (sel === k) + '">' + esc(ms[k]) + '</button>'; }).join('') + '</div>';
        if (sel === 'stripe') {
          h += d.method === 'stripe' && d.ready ? '<div class="row"><button class="btn ghost" id="pm-dash" type="button">View my payouts</button></div>'
            : '<div class="row"><input class="inp" id="pm-cc" maxlength="2" placeholder="Country code, e.g. US" style="max-width:220px;text-transform:uppercase"><button class="btn" id="pm-bank" type="button">' + (d.method === 'stripe' ? 'Finish bank set-up' : 'Connect my bank') + '</button></div>' +
              (d.due && d.due.length ? '<p class="sub" style="margin:8px 0 0">Still needed: ' + d.due.length + ' detail' + (d.due.length === 1 ? '' : 's') + '.</p>' : '');
        } else {
          h += '<div class="row"><input class="inp" id="pm-email" type="email" autocomplete="email" placeholder="Email of your ' + esc(ms[sel] || '') + ' account" value="' + esc(d.method === sel ? (d.email || '') : '') + '"><button class="btn" id="pm-save" type="button">Save</button></div>';
        }
        if (!d.bank_available) h += '<p class="sub" style="margin:10px 0 0;font-size:13px">Direct bank payouts open soon. Until then we pay by PayPal or Wise.</p>';
        h += '<p class="err" id="pm-err" hidden></p>';
        box.innerHTML = h;
        Array.prototype.forEach.call(box.querySelectorAll('[data-pm]'), function (b) { b.addEventListener('click', function () { sel = b.getAttribute('data-pm'); draw(); }); });
        var err = function (m) { var e = $('pm-err'); e.hidden = false; e.textContent = m; };
        if ($('pm-save')) $('pm-save').addEventListener('click', function () { api('POST', '/partner/payout/manual', { method: sel, email: $('pm-email').value }).then(function (x) { if (x.j && x.j.ok) { toast('Saved'); payoutBox(); } else err((x.j && (x.j.error || x.j.message)) || 'Not saved.'); }); });
        if ($('pm-bank')) $('pm-bank').addEventListener('click', function () { api('POST', '/partner/payout/stripe', { country: ($('pm-cc').value || '').trim() }).then(function (x) { if (x.j && x.j.ok && x.j.url) location.href = x.j.url; else err((x.j && (x.j.error || x.j.message)) || 'Not available.'); }); });
        if ($('pm-dash')) $('pm-dash').addEventListener('click', function () { api('POST', '/partner/payout/stripe/dashboard').then(function (x) { if (x.j && x.j.ok) window.open(x.j.url, '_blank', 'noopener'); else err('Not available right now.'); }); });
      }
      draw();
    });
  }

  function earnings() {
    pane('<p class="empty">Loading…</p>');
    api('GET', '/partner/money').then(function (r) {
      var m = r.j || {}, b = m.balances || {};
      var payNote = '<div id="payout-box"><p class="sub" style="margin:0">Loading…</p></div>';
      pane('<div class="grid g3">' + [['Waiting', b.pending, m.next_release ? 'next release ' + day(m.next_release) : 'held 30 days after each payment'], ['Ready to pay', b.payable, 'paid on the 15th from ' + usd(m.min_payout)], ['Paid to you', b.paid, 'all time']]
        .map(function (s) { return '<div class="card stat"><div class="k">' + s[0] + '</div><div class="v">' + usd(s[1]) + '</div><div class="h">' + s[2] + '</div></div>'; }).join('') + '</div>' +
        '<div class="card" style="margin-top:14px"><h2>How you get paid</h2>' + payNote + '</div>' +
        ((m.payouts || []).length ? '<div class="card"><h2>Payouts</h2><table class="tbl cards"><thead><tr><th>Month</th><th>Paid to</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>' + m.payouts.map(function (p) {
          return '<tr><td data-l="Month">' + esc(p.period) + '</td><td data-l="Paid to">' + esc({ stripe: 'Bank account', paypal: 'PayPal', wise: 'Wise' }[p.method] || p.method) + '</td><td class="num" data-l="Amount">' + usd(p.amount_minor) + '</td><td data-l="Status"><span class="pill ' + (p.status === 'paid' ? 'g' : '') + '">' + esc({ draft: 'Being sent', paid: 'Paid', failed: 'Failed', cancelled: 'Cancelled' }[p.status] || p.status) + '</span></td></tr>';
        }).join('') + '</tbody></table></div>' : '') +
        '<div class="card"><h2>Every commission</h2>' + ((m.commissions || []).length ? '<table class="tbl cards"><thead><tr><th>Date</th><th>For</th><th class="num">Price</th><th class="num">Rate</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>' +
          m.commissions.map(function (c) {
            var lab = { pending: 'Waiting', payable: 'Ready', paid: 'Paid', void: 'Void' }[c.status] || c.status;
            return '<tr><td data-l="Date">' + day(c.created_at) + '</td><td data-l="For">' + (c.source_type === 'adjustment' && !c.rate_bps ? (c.amount_minor < 0 ? 'Reversal' : 'Adjustment') : ({ monthly: 'Monthly plan', yearly: 'Yearly plan', domain: 'Domain' }[c.kind] || c.kind)) + (c.note ? ' <span style="color:var(--t3)">· ' + esc(c.note) + '</span>' : '') + '</td><td class="num" data-l="Price">' + (c.base_minor ? usd(c.base_minor) : '—') + '</td><td class="num" data-l="Rate">' + (c.rate_bps ? (c.rate_bps / 100) + '%' : '—') + '</td><td class="num" data-l="Amount" style="' + (c.amount_minor < 0 ? 'color:var(--rd)' : '') + '">' + usd(c.amount_minor) + '</td><td data-l="Status"><span class="pill ' + (c.status === 'paid' ? 'g' : c.status === 'payable' ? 'p' : '') + '">' + lab + '</span></td></tr>';
          }).join('') + '</tbody></table>' : '<p class="empty">No commissions yet.</p>') + '</div>');
      payoutBox();
    });
  }

  try { var h = (location.hash || '').slice(1); if (TABS.some(function (t) { return t[0] === h; })) S.tab = h; } catch (e) {}
  boot();
})();
</script>
</body>
