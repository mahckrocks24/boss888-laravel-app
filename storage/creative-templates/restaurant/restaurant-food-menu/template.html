<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Restaurant Food Menu — Dark Charcoal & Orange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500;1,600&family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   STUDIO TEMPLATE — Restaurant Food Menu
   Dark charcoal + orange D-shape, circular food photo,
   limited-offer green badge, full-width bottom contact bar.
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: {{primary}};
  --bg:      {{bg}};
  --text:    {{text}};
  --accent:  {{accent}};
  --bar-bg:  #111111;
}

html, body { background: #050810; }

/* (1) Canvas locked to exactly 1080×1080 */
.canvas {
  position: relative;
  width: 1080px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  color: var(--text);
}

/* Wood-grain subtle texture overlay */
.canvas::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 2px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.01) 0px, transparent 3px, transparent 160px);
  pointer-events: none;
  z-index: 0;
}

/* Faint radial glow around food photo area */
.canvas::after {
  content: "";
  position: absolute;
  left: 42%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 620px;
  height: 620px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,107,0,0.08) 0%, transparent 65%);
  z-index: 1;
  pointer-events: none;
}

/* ── ORANGE D-SHAPE (right edge, half-circle) ── */
.d-shape {
  position: absolute;
  right: -60px;
  top: 50%;
  transform: translateY(-50%);
  width: 300px;
  height: 460px;
  background: var(--primary);
  border-radius: 460px 0 0 460px;
  z-index: 2;
  box-shadow: -8px 0 24px rgba(0,0,0,0.25);
}

/* "FREE HOME DELIVERY" rotated label on D-shape */
.delivery-text {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%) rotate(-90deg);
  transform-origin: center center;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #FFFFFF;
  text-transform: uppercase;
  white-space: nowrap;
  z-index: 3;
}

/* Green "Limited Offer" circular badge — overlapping D-shape bottom-right */
.limited-badge {
  position: absolute;
  right: 40px;
  top: calc(50% + 190px);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 6;
  box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.1;
}
.limited-badge .bt {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.limited-badge .bb {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── LOGO TOP-LEFT ── */
.logo {
  position: absolute;
  top: 50px;
  left: 50px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  z-index: 10;
  font-family: 'Montserrat', sans-serif;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--text);
  text-transform: uppercase;
}
.logo::before {
  content: "🍴";
  font-size: 18px;
  color: var(--primary);
  display: inline-block;
  transform: translateY(-1px);
}

/* ── SOCIAL ICONS TOP-RIGHT ── */
.socials-top {
  position: absolute;
  top: 50px;
  right: 50px;
  display: flex;
  gap: 8px;
  z-index: 10;
}
.socials-top span {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #FFFFFF;
  color: var(--bg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0;
}

/* ── MAIN HEADLINE (left-center) ── */
.headline-block {
  position: absolute;
  left: 40px;
  top: 40%;
  transform: translateY(-50%);
  width: 440px;
  z-index: 10;
  text-align: left;
}
.headline-block .h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: 54px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -1px;
  line-height: 1;
  display: block;
  text-transform: uppercase;
}
.headline-block .h2 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 600;
  font-size: 68px;
  color: var(--primary);
  line-height: 1.05;
  letter-spacing: -1.5px;
  display: block;
  margin: 4px 0 2px;
}
.headline-block .h3 {
  font-family: 'Montserrat', sans-serif;
  font-size: 54px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -1px;
  line-height: 1;
  display: block;
  text-transform: uppercase;
}

/* ── CIRCULAR FOOD PHOTO ── */
.photo-frame {
  position: absolute;
  left: 42%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 340px;
  height: 340px;
  border-radius: 50%;
  border: 5px solid #FFFFFF;
  overflow: hidden;
  z-index: 5;
  box-shadow: 0 14px 32px rgba(0,0,0,0.45);
}
.photo-frame [data-field="image"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.photo-frame [data-field="image"] img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Arc decorators around food photo */
.arc {
  position: absolute;
  left: 42%;
  top: 50%;
  width: 400px;
  height: 400px;
  margin-left: -200px;
  margin-top: -200px;
  border-radius: 50%;
  border: 2px solid transparent;
  z-index: 3;
  pointer-events: none;
}
.arc.top    { border-top-color: rgba(255,255,255,0.5); transform: rotate(-10deg); }
.arc.bottom { border-bottom-color: rgba(255,255,255,0.5); transform: rotate(10deg); }

/* Second faint outer arc for depth */
.arc-outer {
  position: absolute;
  left: 42%;
  top: 50%;
  width: 440px;
  height: 440px;
  margin-left: -220px;
  margin-top: -220px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,0.18);
  z-index: 3;
  pointer-events: none;
}

/* ── DISCOUNT BADGE ── */
.discount {
  position: absolute;
  left: 58%;
  top: 62%;
  width: 110px;
  height: 110px;
  border-radius: 50%;
  border: 2px solid #FFFFFF;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 7;
  box-shadow: 0 0 0 6px rgba(255,255,255,0.06);
}
.discount .num {
  font-family: 'Bebas Neue', 'Montserrat', sans-serif;
  font-size: 48px;
  color: var(--text);
  line-height: 1;
  letter-spacing: 1px;
}
.discount .lbl {
  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ── FLOATING LEAF ACCENTS ── */
.leaf {
  position: absolute;
  width: 24px;
  height: 14px;
  border-radius: 50%;
  background: #4ADE80;
  opacity: 0.7;
  z-index: 6;
}
.leaf.l1 { left: calc(42% - 180px); top: calc(50% - 170px); transform: rotate(-25deg); }
.leaf.l2 { left: calc(42% + 140px); top: calc(50% - 160px); transform: rotate(45deg); background: #22C55E; }
.leaf.l3 { left: calc(42% - 200px); top: calc(50% + 120px); transform: rotate(10deg); }
.leaf.l4 { left: calc(42% + 120px); top: calc(50% + 150px); transform: rotate(-40deg); background: #22C55E; width: 20px; height: 12px; }

/* ── ORANGE DOTS VERTICAL COLUMN ── */
.dots-col {
  position: absolute;
  right: 130px;
  top: 30%;
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 4;
}
.dots-col span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  display: block;
}

/* ── BOTTOM BAR ── */
.bottom-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  height: 64px;
  background: var(--bar-bg);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 18px;
  z-index: 20;
  border-top: 1px solid rgba(255,107,0,0.3);
}
.qr {
  width: 40px;
  height: 40px;
  background-color: #FFFFFF;
  background-image:
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%),
    linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%);
  background-size: 10px 10px;
  background-position: 0 0, 5px 5px;
  border-radius: 4px;
  flex-shrink: 0;
}
.cta-pill {
  display: inline-flex;
  align-items: center;
  background: var(--primary);
  color: #FFFFFF;
  padding: 10px 20px;
  border-radius: 22px;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  text-decoration: none;
  flex-shrink: 0;
}
.phone-text, .web-text {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: 0.5px;
}
.phone-text { margin-left: 8px; }
.web-text { margin-left: auto; }
.phone-ic {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #FFFFFF;
  color: var(--bar-bg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  margin-left: 12px;
  flex-shrink: 0;
}

/* edit hover */
.lu-studio-edit [data-field] { cursor: text; outline-offset: 4px; transition: outline 0.12s; border-radius: 2px; }
.lu-studio-edit [data-field]:hover { outline: 2px dashed rgba(108,92,231,0.55); }
.lu-studio-edit [data-field][contenteditable="true"]:focus { outline: 2px solid #6C5CE7; background: rgba(108,92,231,0.08); }
.lu-studio-edit [data-field="image"] { cursor: pointer; }
.lu-studio-edit [data-field="image"]:hover { outline: 2px dashed rgba(108,92,231,0.55); outline-offset: -4px; }
</style>
</head>
<body>
<div class="canvas">

  <!-- D-SHAPE + DELIVERY TEXT -->
  <div class="d-shape"></div>
  <div class="delivery-text" data-field="delivery_text">{{delivery_text}}</div>

  <!-- LIMITED OFFER BADGE -->
  <div class="limited-badge">
    <span class="bt" data-field="badge_top">{{badge_top}}</span>
    <span class="bb" data-field="badge_bottom">{{badge_bottom}}</span>
  </div>

  <!-- LOGO -->
  <div class="logo" data-field="restaurant_name">{{restaurant_name}}</div>

  <!-- SOCIAL ICONS -->
  <div class="socials-top">
    <span title="Facebook">F</span>
    <span title="Instagram">IN</span>
    <span title="Twitter">TW</span>
  </div>

  <!-- HEADLINE -->
  <div class="headline-block">
    <span class="h1" data-field="headline_1">{{headline_1}}</span>
    <span class="h2" data-field="headline_2">{{headline_2}}</span>
    <span class="h3" data-field="headline_3">{{headline_3}}</span>
  </div>

  <!-- ARC DECORATORS -->
  <div class="arc-outer"></div>
  <div class="arc top"></div>
  <div class="arc bottom"></div>

  <!-- FOOD PHOTO -->
  <div class="photo-frame">
    <div data-field="image">
      <img src="{{image}}" alt="">
    </div>
  </div>

  <!-- DISCOUNT BADGE -->
  <div class="discount">
    <span class="num" data-field="discount_num">{{discount_num}}</span>
    <span class="lbl" data-field="discount_label">{{discount_label}}</span>
  </div>

  <!-- LEAF ACCENTS -->
  <div class="leaf l1"></div>
  <div class="leaf l2"></div>
  <div class="leaf l3"></div>
  <div class="leaf l4"></div>

  <!-- ORANGE DOTS COLUMN -->
  <div class="dots-col">
    <span></span><span></span><span></span>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="qr"></div>
    <a class="cta-pill" data-field="cta_text">{{cta_text}}</a>
    <span class="phone-text" data-field="phone">{{phone}}</span>
    <span class="web-text" data-field="website">{{website}}</span>
    <span class="phone-ic">✆</span>
  </div>

</div>
</body>
</html>
