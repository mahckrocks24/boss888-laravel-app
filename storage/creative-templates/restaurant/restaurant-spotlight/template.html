<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>Restaurant Spotlight — Amber Circle Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   STUDIO TEMPLATE — Restaurant Spotlight
   Square 1080×1080. Deep espresso background, amber hero
   circle with full-bleed dim food photo, radial spotlight,
   rotating ring label, CTA + price row.
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: {{primary}};
  --bg:      {{bg}};
  --text:    {{text}};
  --accent:  {{accent}};

  /* local decorative tokens */
  --amber-l: #F5B870;
  --muted:   rgba(250,240,220,0.45);
  --font-h:  'DM Serif Display', Georgia, serif;
  --font-b:  'Work Sans', sans-serif;
}

html, body { background: #060503; }

/* (1) Canvas locked to exactly 1080×1080 */
.canvas {
  position: relative;
  width: 1080px;
  height: 1080px;
  background: var(--bg);
  overflow: hidden;
  font-family: var(--font-b);
  color: var(--text);
}

/* ── Full-bleed dark background image ── */
.bg-img {
  position: absolute;
  inset: 0;
  z-index: 1;
}
.bg-img [data-field="image"] {
  width: 100%;
  height: 100%;
  display: block;
}
.bg-img [data-field="image"] img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.22) saturate(0.70);
  display: block;
}

/* Radial spotlight — the signature device */
.spotlight {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(ellipse 56% 52% at 52% 42%,
    transparent 0%,
    rgba(11,9,5,0.55) 55%,
    rgba(11,9,5,0.95) 100%);
}

/* Amber warmth in centre */
.warm-glow {
  position: absolute;
  z-index: 2;
  width: 640px;
  height: 560px;
  border-radius: 50%;
  background: radial-gradient(ellipse,
    rgba(232,145,58,0.18) 0%,
    transparent 65%);
  top: 50%;
  left: 50%;
  transform: translate(-44%, -46%);
  pointer-events: none;
}

/* ── Circle image frame — the spotlight hero ── */
.circle-frame {
  position: absolute;
  z-index: 4;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  overflow: hidden;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -52%);
  box-shadow:
    0 0 0 3px var(--primary),
    0 0 0 14px rgba(232,145,58,0.14),
    0 60px 120px rgba(0,0,0,0.70);
}
.circle-frame [data-field="hero_image"] {
  width: 100%;
  height: 100%;
  display: block;
}
.circle-frame [data-field="hero_image"] img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  filter: saturate(1.10) contrast(1.05);
  display: block;
}

/* ── Topbar ── */
.topbar {
  position: absolute;
  z-index: 6;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 36px 52px;
}
.logo-name {
  font-family: var(--font-b);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text);
}
.tag {
  font-family: var(--font-b);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--primary);
  border: 1px solid rgba(232,145,58,0.35);
  padding: 8px 18px;
  border-radius: 20px;
}

/* ── Content — bottom third, guaranteed dark overlay ── */
.content {
  position: absolute;
  z-index: 5;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 0 56px 52px;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(11,9,5,0.90) 40%,
    var(--bg) 100%);
}

.content-eyebrow {
  font-family: var(--font-b);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.content-eyebrow::before {
  content: '';
  width: 24px;
  height: 1.5px;
  background: var(--primary);
  flex-shrink: 0;
}

.headline {
  font-family: var(--font-h);
  font-size: 78px;
  font-weight: 400;
  line-height: 0.94;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-bottom: 16px;
}
.headline__line-2 {
  font-style: italic;
  color: var(--amber-l);
  display: block;
}

.sub {
  font-family: var(--font-b);
  font-size: 16px;
  font-weight: 300;
  line-height: 1.65;
  color: var(--muted);
  max-width: 560px;
  margin-bottom: 32px;
}

/* CTA row */
.cta-row {
  display: flex;
  align-items: center;
  gap: 20px;
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-b);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--primary);
  padding: 18px 44px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  border-radius: 2px;
  transition: transform 0.22s, box-shadow 0.22s;
}
.cta:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 36px rgba(232,145,58,0.45);
}
.cta__arrow { transition: transform 0.22s; }
.cta:hover .cta__arrow { transform: translateX(4px); }

.price-badge {
  font-family: var(--font-h);
  font-size: 32px;
  font-weight: 400;
  color: var(--accent);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.price-badge__label {
  font-family: var(--font-b);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Rotating label ring around circle ── */
.ring-label {
  position: absolute;
  z-index: 5;
  width: 570px;
  height: 570px;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -52%);
  pointer-events: none;
}
.ring-label svg {
  width: 100%;
  height: 100%;
}

/* Brand url bottom right */
.brand-url {
  position: absolute;
  z-index: 5;
  bottom: 52px;
  right: 52px;
  font-family: var(--font-b);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--muted);
}

/* edit hover */
.lu-studio-edit [data-field] { cursor: text; outline-offset: 4px; transition: outline 0.12s; border-radius: 2px; }
.lu-studio-edit [data-field]:hover { outline: 2px dashed rgba(108,92,231,0.55); }
.lu-studio-edit [data-field][contenteditable="true"]:focus { outline: 2px solid #6C5CE7; background: rgba(108,92,231,0.08); }
.lu-studio-edit [data-field="image"],
.lu-studio-edit [data-field="hero_image"] { cursor: pointer; }
.lu-studio-edit [data-field="image"]:hover,
.lu-studio-edit [data-field="hero_image"]:hover { outline: 2px dashed rgba(108,92,231,0.55); outline-offset: -4px; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Full-bleed dim background image -->
  <div class="bg-img">
    <div data-field="image">
      <img src="{{image}}" alt="">
    </div>
  </div>

  <!-- Spotlight + warm glow -->
  <div class="spotlight"></div>
  <div class="warm-glow"></div>

  <!-- Topbar -->
  <div class="topbar">
    <span class="logo-name" data-field="logo_text">{{logo_text}}</span>
    <span class="tag" data-field="tag_text">{{tag_text}}</span>
  </div>

  <!-- Circle food image -->
  <div class="circle-frame">
    <div data-field="hero_image">
      <img src="{{hero_image}}" alt="">
    </div>
  </div>

  <!-- Rotating ring text -->
  <div class="ring-label">
    <svg viewBox="0 0 570 570" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="rp" d="M285,285 m-255,0 a255,255 0 1,1 510,0 a255,255 0 1,1 -510,0"/>
      </defs>
      <text font-family="'Work Sans', sans-serif" font-size="12" font-weight="600"
            letter-spacing="7" fill="rgba(232,145,58,0.45)">
        <textPath href="#rp" data-field="ring_text">{{ring_text}}</textPath>
      </text>
    </svg>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">
      <span class="headline__line-1" data-field="headline_1">{{headline_1}}</span><br>
      <span class="headline__line-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <p class="sub" data-field="sub">{{sub}}</p>
    <div class="cta-row">
      <a class="cta" href="#">
        <span data-field="cta_text">{{cta_text}}</span>
        <span class="cta__arrow">→</span>
      </a>
      <div class="price-badge">
        <span class="price-badge__label" data-field="price_label">{{price_label}}</span>
        <span data-field="price_value">{{price_value}}</span>
      </div>
    </div>
  </div>

  <span class="brand-url" data-field="brand_url">{{brand_url}}</span>

</div>
</body>
</html>
