<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>T06 — Food Spotlight Circle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:     #0B0905;
  --amber:  #E8913A;
  --accent:#F5B870;
  --primary: #FFD166;
  --cream:  #FAF0DC;
  --muted:  rgba(250,240,220,.45);
  --font-h: 'DM Serif Display', Georgia, serif;
  --font-b: 'Work Sans', sans-serif;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#060503}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.scale-wrap{transform-origin:top center}
@media(max-width:1160px){.scale-wrap{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.scale-wrap{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:720px){.scale-wrap{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.scale-wrap{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg)}

/* Full-bleed dark bg image */
.bg-img{position:absolute;inset:0;z-index:1}
.bg-img img{width:100%;height:100%;object-fit:cover;filter:brightness(.22) saturate(.70)}
/* Radial spotlight — the signature device */
.spotlight{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 56% 52% at 52% 42%,transparent 0%,rgba(11,9,5,.55) 55%,rgba(11,9,5,.95) 100%)}
/* Amber warmth in centre */
.warm-glow{position:absolute;z-index:2;width:640px;height:560px;border-radius:50%;background:radial-gradient(ellipse,rgba(232,145,58,.18) 0%,transparent 65%);top:50%;left:50%;transform:translate(-44%,-46%);pointer-events:none}

/* Circle image frame — the spotlight hero */
.circle-frame{position:absolute;z-index:4;width:520px;height:520px;border-radius:50%;overflow:hidden;top:50%;left:50%;transform:translate(-50%,-52%);box-shadow:0 0 0 3px var(--amber),0 0 0 14px rgba(232,145,58,.14),0 60px 120px rgba(0,0,0,.70)}
.circle-frame img{width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.10) contrast(1.05)}

/* Topbar */
.topbar{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:28px 44px}
.logo-name{font-family:var(--font-b);font-size:16px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--cream)}
.tag{font-family:var(--font-b);font-size:17px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(232,145,58,.35);padding:8px 18px;border-radius:20px}

/* Content — bottom third, guaranteed dark overlay */
.content{position:absolute;z-index:5;bottom:0;left:0;right:0;padding:0 56px 52px;background:linear-gradient(180deg,transparent 0%,rgba(11,9,5,.90) 40%,var(--bg) 100%)}

.content-eyebrow{font-family:var(--font-b);font-size:18px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:12px;margin-bottom:16px}
.content-eyebrow::before{content:'';width:24px;height:1.5px;background:var(--amber);flex-shrink:0}

.headline{font-family:var(--font-h);font-size:78px;font-weight:400;line-height:.94;letter-spacing:-.01em;color:var(--cream);margin-bottom:16px}
.headline em{font-style:italic;color:var(--accent)}

.sub{font-family:var(--font-b);font-size:16px;font-weight:300;line-height:1.65;color:var(--muted);max-width:560px;margin-bottom:32px}

/* CTA row */
.cta-row{display:flex;align-items:center;gap:20px}
.cta{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-b);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--amber);padding:18px 44px;border:none;cursor:pointer;text-decoration:none;border-radius:2px;transition:transform .22s,box-shadow .22s}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(232,145,58,.45)}
.cta .cta-arrow{transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(4px)}
.price-badge{font-family:var(--font-h);font-size:32px;font-weight:400;color:var(--primary);display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.price-badge small{font-family:var(--font-b);font-size:10px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* Rotating label ring around circle */
.ring-label{position:absolute;z-index:5;width:570px;height:570px;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-52%);pointer-events:none}
.ring-label svg{width:100%;height:100%}

/* Brand url bottom right */
.brand-url{position:absolute;z-index:5;bottom:52px;right:52px;font-family:var(--font-b);font-size:17px;letter-spacing:.18em;color:var(--muted)}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="scale-wrap">
<div class="post">
  <!-- BG -->
  <div class="bg-img"><img data-field="background_image" src="{{background_image}}" alt="Background"/></div>
  <div class="spotlight"></div>
  <div class="warm-glow"></div>

  <!-- Topbar -->
  <div class="topbar">
    <span class="logo-name" data-field="logo_name">{{logo_name}}</span>
    <span class="tag" data-field="tag">{{tag}}</span>
  </div>

  <!-- Circle food image -->
  <div class="circle-frame">
    <img data-field="hero_image" src="{{hero_image}}" alt="Hero"/>
  </div>

  <!-- Static ring text -->
  <div class="ring-label">
    <svg viewBox="0 0 570 570" xmlns="http://www.w3.org/2000/svg">
      <defs><path id="rp" d="M285,285 m-255,0 a255,255 0 1,1 510,0 a255,255 0 1,1 -510,0"/></defs>
      <text font-family="'Work Sans',sans-serif" font-size="12" font-weight="600" letter-spacing="7" fill="rgba(232,145,58,.45)">
        <textPath href="#rp">{{ring_text}}</textPath>
      </text>
    </svg>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline"><span data-field="headline_main">{{headline_main}}</span><br><em data-field="headline_accent">{{headline_accent}}</em></h1>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="cta-row">
      <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
      <div class="price-badge"><small data-field="price_prefix">{{price_prefix}}</small><span data-field="price_value">{{price_value}}</span></div>
    </div>
  </div>

  <span class="brand-url" data-field="brand_url">{{brand_url}}</span>
</div>
</div></div>
</body></html>
