<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>T07 — Creator Pop Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,700;0,900;1,400&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:     #FFFFFF;
  --purple: #6C5CE7;
  --pink:   #FD79A8;
  --accent: #FDCB6E;
  --primary:   #00CEC9;
  --text:   #2D3436;
  --font-h: 'Nunito', sans-serif;
  --font-b: 'Quicksand', sans-serif;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#F0EDFF}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.scale-wrap{transform-origin:top center}
@media(max-width:1160px){.scale-wrap{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.scale-wrap{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:720px){.scale-wrap{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.scale-wrap{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--font-b);display:grid;grid-template-columns:44% 56%}

/* BG squiggles and shapes */
.bg-blob-a{position:absolute;z-index:1;width:440px;height:440px;border-radius:50% 40% 60% 30% / 50% 60% 40% 50%;background:linear-gradient(135deg,var(--purple),var(--pink));opacity:.12;top:-80px;left:-80px;pointer-events:none}
.bg-blob-b{position:absolute;z-index:1;width:280px;height:280px;border-radius:50%;background:var(--accent);opacity:.18;bottom:-40px;right:160px;pointer-events:none}
.bg-blob-c{position:absolute;z-index:1;width:180px;height:180px;border-radius:50%;background:var(--primary);opacity:.14;top:220px;right:40px;pointer-events:none}

/* Dots deco */
.bg-dots{position:absolute;z-index:1;inset:0;background-image:radial-gradient(circle,rgba(108,92,231,.08) 2px,transparent 2px);background-size:36px 36px;pointer-events:none}

/* LEFT — avatar / image panel */
.panel-left{position:relative;z-index:3;background:linear-gradient(160deg,var(--purple) 0%,#9B59B6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:52px 32px}

/* Avatar circle with comic-style border */
.avatar{width:360px;height:360px;border-radius:50%;overflow:hidden;border:6px solid var(--text);box-shadow:8px 8px 0 var(--text),0 0 0 6px var(--accent);position:relative;flex-shrink:0;margin-bottom:36px}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top}

/* Social handle badge */
.handle-badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-h);font-size:18px;font-weight:900;color:var(--text);background:var(--accent);border:3px solid var(--text);padding:12px 28px;box-shadow:4px 4px 0 var(--text);margin-bottom:20px}
.handle-at{color:var(--purple)}

/* Sub in left panel */
.left-sub{font-family:var(--font-b);font-size:14px;font-weight:500;color:rgba(255,255,255,.75);text-align:center;letter-spacing:.04em}

/* Stat pills row */
.stat-pills{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.stat-pill{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.30);padding:14px 18px;border-radius:12px}
.stat-pill-val{font-family:var(--font-h);font-size:22px;font-weight:900;color:var(--bg)}
.stat-pill-label{font-family:var(--font-b);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.60)}

/* RIGHT — content panel */
.panel-right{position:relative;z-index:3;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:52px 48px 52px 36px}

/* Name headline */
.name-tag{font-family:var(--font-h);font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--purple);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.name-tag::before{content:'✦';color:var(--pink)}

.headline{font-family:var(--font-h);font-size:78px;font-weight:900;line-height:.92;color:var(--text);margin-bottom:20px;letter-spacing:-.02em}
.headline .h-accent{color:var(--purple);display:block;font-style:italic}

.sub{font-family:var(--font-b);font-size:17px;font-weight:500;line-height:1.65;color:#636E72;margin-bottom:32px}

/* Topic tags */
.topics{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:36px}
.topic{font-family:var(--font-b);font-size:20px;font-weight:700;color:var(--text);border:2.5px solid var(--text);padding:8px 18px;border-radius:8px;box-shadow:3px 3px 0 var(--text);background:var(--bg)}
.topic--fill{background:var(--purple);color:var(--bg);border-color:var(--purple);box-shadow:3px 3px 0 var(--text)}
.topic--yellow{background:var(--accent);border-color:var(--text);box-shadow:3px 3px 0 var(--text)}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-h);font-size:15px;font-weight:900;color:var(--bg);background:var(--purple);border:3px solid var(--text);padding:18px 44px;cursor:pointer;text-decoration:none;box-shadow:5px 5px 0 var(--text);transition:transform .15s,box-shadow .15s;letter-spacing:.02em;margin-bottom:32px}
.cta:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--text)}
.cta .cta-arrow{transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}

/* Brand row */
.brand-row{display:flex;align-items:center;gap:12px;padding-top:20px;border-top:2px dashed rgba(108,92,231,.20)}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--pink);flex-shrink:0}
.brand-name{font-family:var(--font-b);font-size:20px;font-weight:700;letter-spacing:.10em;color:var(--text)}
.brand-url{font-family:var(--font-b);font-size:18px;color:#B2BEC3;margin-left:auto}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="scale-wrap">
<div class="post">
  <div class="bg-blob-a"></div>
  <div class="bg-blob-b"></div>
  <div class="bg-blob-c"></div>
  <div class="bg-dots"></div>

  <!-- LEFT -->
  <div class="panel-left">
    <div class="avatar">
      <img data-field="avatar" src="{{avatar}}" alt="Avatar"/>
    </div>
    <div class="handle-badge"><span class="handle-at">@</span><span data-field="handle">{{handle}}</span></div>
    <div class="left-sub" data-field="left_sub">{{left_sub}}</div>
    <div class="stat-pills">
      <div class="stat-pill"><span class="stat-pill-val" data-field="stat_1_val">{{stat_1_val}}</span><span class="stat-pill-label" data-field="stat_1_label">{{stat_1_label}}</span></div>
      <div class="stat-pill"><span class="stat-pill-val" data-field="stat_2_val">{{stat_2_val}}</span><span class="stat-pill-label" data-field="stat_2_label">{{stat_2_label}}</span></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div class="name-tag" data-field="name_tag">{{name_tag}}</div>
    <h1 class="headline"><span data-field="headline_main">{{headline_main}}</span><span class="h-accent" data-field="headline_accent">{{headline_accent}}</span></h1>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="topics">
      <span class="topic topic--fill" data-field="topic_1">{{topic_1}}</span>
      <span class="topic topic--yellow" data-field="topic_2">{{topic_2}}</span>
      <span class="topic" data-field="topic_3">{{topic_3}}</span>
      <span class="topic" data-field="topic_4">{{topic_4}}</span>
    </div>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
    <div class="brand-row">
      <div class="brand-dot"></div>
      <span class="brand-name" data-field="brand_name">{{brand_name}}</span>
      <span class="brand-url" data-field="brand_url">{{brand_url}}</span>
    </div>
  </div>
</div>
</div></div>
</body></html>
