<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Bubbly — Ecommerce</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FAFFF4;--green:#16A34A;--green-l:#4ADE80;--purple:#7C3AED;--primary:#FFE600;--accent:#FF2020;--text:#060C00;--fh:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--b:cubic-bezier(.34,1.56,.64,1);--w:1080px;--h:1920px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#90EE90}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}
.b1{position:absolute;width:680px;height:630px;border-radius:50%;background:radial-gradient(ellipse,var(--green-l) 0%,rgba(74,222,128,.55) 50%,transparent 75%);top:-150px;right:-120px;animation:bi .9s var(--b) 0s both}
.b2{position:absolute;width:560px;height:520px;border-radius:50%;background:radial-gradient(ellipse,var(--purple) 0%,rgba(124,58,237,.50) 50%,transparent 75%);bottom:-90px;left:-90px;animation:bi 1.1s var(--b) .15s both}
.b3{position:absolute;width:280px;height:260px;border-radius:50%;background:radial-gradient(ellipse,var(--primary) 0%,transparent 70%);top:800px;right:-30px;animation:bi .8s var(--b) .3s both}
.topbar{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:42px 52px}
.brand{display:flex;align-items:center;gap:14px;opacity:0;animation:pi .7s var(--b) .6s both}
.bi2{width:52px;height:52px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid var(--text);flex-shrink:0;box-shadow:3px 3px 0 var(--text)}
.bn{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--text)}
.bp{font-family:var(--fb);font-size:14px;font-weight:700;color:white;background:var(--accent);padding:12px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);opacity:0;animation:pi .6s var(--b) .8s both;transform:rotate(2deg)}
.hero{position:absolute;z-index:5;top:390px;left:60px;right:60px}
.ew{display:flex;gap:12px;align-items:center;margin-bottom:14px;opacity:0;animation:bl .7s var(--b) 1.2s both}
.ey{font-family:var(--fb);font-size:18px;font-weight:700;color:white;background:var(--accent);padding:10px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);transform:rotate(-2deg);display:inline-block}
.headline{margin-bottom:20px;display:flex;flex-direction:column}
.hl{font-family:var(--fh);line-height:.82;letter-spacing:-.04em;color:var(--text);display:block;opacity:0}
.hb{font-size:175px;font-weight:800}
.hg{font-size:175px;font-weight:800;color:var(--green)}
.hi{font-size:135px;font-weight:400;font-style:italic}
.h1{animation:sr .55s var(--b) 1.4s both}.h2{animation:sr .55s var(--b) 1.62s both}.h3{animation:sr .55s var(--b) 1.84s both}
/* Price mega display */
.price-hero{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;opacity:0;animation:pi .7s var(--b) 2.1s both}
.price-was{font-family:var(--fh);font-size:56px;font-weight:400;color:rgba(6,12,0,.40);text-decoration:line-through;margin-top:20px}
.price-now{font-family:var(--fh);font-size:180px;font-weight:800;line-height:.85;color:var(--green);letter-spacing:-.04em}
.price-off{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.off-badge{font-family:var(--fh);font-size:28px;font-weight:800;color:white;background:var(--accent);padding:10px 20px;border-radius:12px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text)}
.sub{font-size:24px;font-weight:400;line-height:1.65;color:rgba(6,12,0,.58);margin-bottom:36px;opacity:0;animation:pu .8s ease 2.4s both}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:44px;opacity:0;animation:pi .7s var(--b) 2.8s both}
.pill{font-family:var(--fb);font-size:18px;font-weight:700;padding:12px 24px;border-radius:50px;border:2.5px solid var(--text);display:flex;align-items:center;gap:8px}
.p1{background:var(--primary);transform:rotate(-1deg);box-shadow:3px 3px 0 var(--text)}
.p2{background:var(--purple);color:white;transform:rotate(1.5deg);box-shadow:3px 3px 0 var(--text)}
.p3{background:white;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--text)}
.p4{background:var(--green);color:white;transform:rotate(.8deg);box-shadow:3px 3px 0 var(--text)}
.cta-wrap{opacity:0;animation:pi .8s var(--b) 3.2s both}
.cta{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--fh);font-size:28px;font-weight:800;color:white;background:var(--green);padding:28px 64px;border-radius:50px;border:3px solid var(--text);box-shadow:6px 6px 0 var(--text);text-decoration:none;width:100%;transform:rotate(-.4deg);animation:cb 3s ease-in-out 4s infinite}
.ca{display:inline-block;animation:aw 3s ease-in-out 4s infinite}
.footer{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 52px 52px;opacity:0;animation:pu .7s ease 4.0s both}
.fb2{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--text)}
.fu{font-family:var(--fb);font-size:16px;color:rgba(6,12,0,.48)}
.fh2{font-family:var(--fb);font-size:16px;font-weight:700;color:var(--green)}
@keyframes bi{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes pi{from{opacity:0;transform:scale(.60)}to{opacity:1;transform:scale(1)}}
@keyframes pu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes bl{from{opacity:0;transform:translateX(-50px) rotate(-4deg)}70%{transform:translateX(6px)}100%{opacity:1;transform:translateX(0) rotate(-2deg)}}
@keyframes sr{0%{opacity:0;transform:translateY(100px) rotate(-4deg)}65%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cb{0%,100%{box-shadow:6px 6px 0 var(--text);transform:rotate(-.4deg) translateY(0)}50%{box-shadow:9px 9px 0 var(--text);transform:rotate(-.4deg) translateY(-5px)}}
@keyframes aw{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(10px)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  <div class="topbar"><div class="brand"><div class="bi2" data-field="brand_icon">{{brand_icon}}</div><span class="bn" data-field="brand_name">{{brand_name}}</span></div><span class="bp" data-field="brand_tag">{{brand_tag}}</span></div>
  <div class="hero">
    <div class="ew"><span>🔥</span><span class="ey" data-field="eyebrow">{{eyebrow}}</span></div>
    <div class="headline">
      <span class="hl hb h1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hg h2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hi h3" data-field="headline_3">{{headline_3}}</span>
    </div>
    <div class="price-hero">
      <span class="price-was">$299</span>
      <span class="price-now">$99</span>
      <div class="price-off"><span class="off-badge">67% OFF</span></div>
    </div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="pills">
      <span class="pill p1" data-field="pill_1">{{pill_1}}</span>
      <span class="pill p2" data-field="pill_2">{{pill_2}}</span>
      <span class="pill p3" data-field="pill_3">{{pill_3}}</span>
      <span class="pill p4" data-field="pill_4">{{pill_4}}</span>
    </div>
    <div class="cta-wrap"><a class="cta" href="#">SHOP NOW <span class="ca">→</span></a></div>
  </div>
  <div class="footer"><span class="fb2" data-field="footer_brand">{{footer_brand}}</span><span class="fu" data-field="footer_url">{{footer_url}}</span><span class="fh2" data-field="footer_handle">{{footer_handle}}</span></div>
</div></div></div></body></html>
