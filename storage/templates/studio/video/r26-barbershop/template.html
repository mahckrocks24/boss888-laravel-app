<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion Reel — Barbershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080808;--primary:#22C55E;--accent:#4ADE80;--green-d:rgba(34,197,94,.15);--white:#F8F8F8;--muted:rgba(248,248,248,.45);--fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--w:1080px;--h:1920px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#040404}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#030303}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}
.layer-bg{position:absolute;inset:0;z-index:1;opacity:0;animation:fade-in 1s ease 0s both}
.bg-base{position:absolute;inset:0;background:linear-gradient(160deg,#0C0C0C 0%,var(--bg) 55%,#0A0A0A 100%)}
.bg-glow{position:absolute;width:700px;height:600px;border-radius:50%;background:radial-gradient(ellipse,rgba(34,197,94,.14) 0%,transparent 65%);bottom:-80px;left:-60px;animation:float-slow 12s ease-in-out 1s infinite alternate}
.bg-grain{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:160px;opacity:.028;mix-blend-mode:screen}
.layer-shape{position:absolute;inset:0;z-index:2}
/* Green top line */
.shape-top{position:absolute;top:0;left:0;right:0;height:4px;background:var(--primary);transform:scaleX(0);transform-origin:left;animation:scale-x .8s cubic-bezier(.16,1,.3,1) 0s both;box-shadow:0 0 16px rgba(34,197,94,.60)}
/* RAZOR WIPE — vertical blade sweep */
.shape-razor{position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent,var(--primary),rgba(74,222,128,.60),var(--primary),transparent);left:-3px;box-shadow:0 0 16px rgba(34,197,94,.80);animation:razor-sweep .9s cubic-bezier(.65,0,.35,1) .1s both}
/* Barber pole stripes */
.shape-pole{position:absolute;right:80px;top:200px;bottom:200px;width:16px;background:repeating-linear-gradient(-45deg,var(--primary) 0px,var(--primary) 8px,rgba(255,255,255,.20) 8px,rgba(255,255,255,.20) 16px,rgba(0,0,0,.40) 16px,rgba(0,0,0,.40) 24px);opacity:0;animation:fade-in .6s ease 1.0s both;box-shadow:0 0 20px rgba(34,197,94,.30)}
/* Horizontal scan grid */
.shape-hline{position:absolute;left:0;right:0;height:1px;background:rgba(34,197,94,.06)}
.hl-a{top:25%}.hl-b{top:50%}.hl-c{top:75%}
/* Price badge */
.price-badge{position:absolute;z-index:4;top:92px;right:80px;display:flex;flex-direction:column;align-items:center;background:rgba(34,197,94,.12);border:2px solid var(--primary);padding:16px 24px;border-radius:8px;opacity:0;animation:bounce-in .6s cubic-bezier(.34,1.56,.64,1) 1.1s both;box-shadow:0 0 20px rgba(34,197,94,.25)}
.pb-from{font-family:var(--fb);font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--primary)}
.pb-val{font-family:var(--fh);font-size:52px;font-weight:900;color:var(--white);line-height:1}
.layer-brand{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;padding:80px 80px}
.brand-logo{display:flex;align-items:center;gap:14px;opacity:0;animation:slide-down .7s cubic-bezier(.16,1,.3,1) .9s both}
.brand-scissors{width:46px;height:46px;border:2px solid var(--primary);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 0 12px rgba(34,197,94,.30)}
.brand-name{font-family:var(--fh);font-size:28px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}
.layer-text{position:absolute;z-index:6;top:560px;left:80px;right:80px}
.eyebrow{font-family:var(--fb);font-size:16px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:12px;margin-bottom:36px;opacity:0;animation:wipe-right .7s cubic-bezier(.16,1,.3,1) 1.4s both;text-shadow:0 0 12px rgba(34,197,94,.50)}
.eyebrow::before{content:'';width:22px;height:2px;background:var(--primary);flex-shrink:0}
.headline{display:flex;flex-direction:column;gap:0;margin-bottom:44px}
.hl{font-family:var(--fh);font-size:168px;font-weight:900;line-height:.82;letter-spacing:.01em;text-transform:uppercase;color:var(--white);opacity:0;display:block;text-shadow:3px 4px 0 rgba(0,0,0,.45)}
.hl-green{color:var(--primary);text-shadow:0 0 40px rgba(34,197,94,.45),3px 4px 0 rgba(0,0,0,.35)}
.hl-1{animation:razor-reveal .55s cubic-bezier(.16,1,.3,1) 1.9s both}
.hl-2{animation:razor-reveal .55s cubic-bezier(.16,1,.3,1) 2.15s both}
.hl-3{animation:razor-reveal .55s cubic-bezier(.16,1,.3,1) 2.40s both}
.green-rule{height:3px;background:linear-gradient(90deg,var(--primary),rgba(34,197,94,.25),transparent);margin-bottom:44px;width:0;animation:line-draw .7s cubic-bezier(.16,1,.3,1) 2.9s both;box-shadow:0 0 10px rgba(34,197,94,.40)}
.subtext{font-family:var(--fb);font-size:28px;font-weight:300;line-height:1.65;color:var(--muted);margin-bottom:52px;opacity:0;transform:translateY(20px);animation:fade-rise .8s cubic-bezier(.16,1,.3,1) 3.4s both}
/* Services */
.services{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:52px}
.svc{display:flex;flex-direction:column;gap:6px;padding:24px 22px;border:1px solid rgba(34,197,94,.16);background:rgba(34,197,94,.05);opacity:0;animation:fade-rise .5s cubic-bezier(.34,1.56,.64,1) var(--d) both}
.svc-name{font-family:var(--fh);font-size:28px;font-weight:700;letter-spacing:.04em;color:var(--white)}
.svc-time{font-family:var(--fb);font-size:14px;font-weight:300;letter-spacing:.12em;color:var(--muted)}
.svc-price{font-family:var(--fh);font-size:24px;font-weight:700;color:var(--primary)}
.svc:nth-child(1){--d:4.1s}.svc:nth-child(2){--d:4.3s}.svc:nth-child(3){--d:4.5s}.svc:nth-child(4){--d:4.7s}
.cta-wrap{opacity:0;animation:bounce-in .8s cubic-bezier(.34,1.56,.64,1) 5.0s both}
.cta{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--fh);font-size:28px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--primary);padding:36px 80px;text-decoration:none;width:100%;box-shadow:4px 4px 0 rgba(0,0,0,.40);animation:cta-glow 2.5s ease-in-out 6s infinite}
.cta-arrow{display:inline-block;animation:arrow-nudge 2.5s ease-in-out 6s infinite}
.layer-footer{position:absolute;z-index:9;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:28px 80px 60px;border-top:1px solid rgba(34,197,94,.12);opacity:0;transform:translateY(16px);animation:fade-rise .7s ease 5.6s both}
.footer-brand{font-family:var(--fh);font-size:22px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}
.footer-url{font-family:var(--fb);font-size:16px;font-weight:300;letter-spacing:.12em;color:var(--muted)}
.footer-handle{font-family:var(--fb);font-size:16px;font-weight:600;letter-spacing:.10em;color:var(--primary);text-shadow:0 0 10px rgba(34,197,94,.50)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slide-down{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce-in{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes razor-reveal{0%{opacity:0;transform:translateX(-50px);clip-path:inset(0 100% 0 0)}60%{clip-path:inset(0 0% 0 0)}100%{opacity:1;transform:translateX(0)}}
@keyframes razor-sweep{from{left:-3px}to{left:108%}}
@keyframes wipe-right{from{opacity:0;transform:translateX(-20px);clip-path:inset(0 100% 0 0)}to{opacity:1;transform:translateX(0);clip-path:inset(0 0% 0 0)}}
@keyframes line-draw{from{width:0;opacity:0}to{width:100%;opacity:1}}
@keyframes scale-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cta-glow{0%,100%{box-shadow:4px 4px 0 rgba(0,0,0,.40),0 20px 60px rgba(34,197,94,.30)}50%{box-shadow:4px 4px 0 rgba(0,0,0,.40),0 28px 80px rgba(34,197,94,.55)}}
@keyframes arrow-nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(10px)}}
@keyframes float-slow{from{transform:translate(0,0)}to{transform:translate(16px,-12px)}}
</style>
</head>
<body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="layer-bg"><div class="bg-base"></div><div class="bg-glow"></div><div class="bg-grain"></div></div>
  <div class="layer-shape">
    <div class="shape-top"></div><div class="shape-razor"></div><div class="shape-pole"></div>
    <div class="shape-hline hl-a"></div><div class="shape-hline hl-b"></div><div class="shape-hline hl-c"></div>
  </div>
  <div class="price-badge"><span class="pb-from">Cuts from</span><span class="pb-val">$25</span></div>
  <div class="layer-brand"><div class="brand-logo"><div class="brand-scissors">✂️</div><span class="brand-name" data-field="brand_name">{{brand_name}}</span></div></div>
  <div class="layer-text">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <div class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hl-3" data-field="headline_3">{{headline_3}}</span>
    </div>
    <div class="green-rule"></div>
    <p class="subtext" data-field="subheading">{{subheading}}</p>
    <div class="services">
      <div class="svc"><span class="svc-name">Classic Cut</span><span class="svc-time">30 min</span><span class="svc-price">$25</span></div>
      <div class="svc"><span class="svc-name">Fade & Shape</span><span class="svc-time">45 min</span><span class="svc-price">$35</span></div>
      <div class="svc"><span class="svc-name">Shave & Trim</span><span class="svc-time">40 min</span><span class="svc-price">$40</span></div>
      <div class="svc"><span class="svc-name">Full Package</span><span class="svc-time">75 min</span><span class="svc-price">$65</span></div>
    </div>
    <div class="cta-wrap"><a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a></div>
  </div>
  <div class="layer-footer"><span class="footer-brand" data-field="footer_brand">{{footer_brand}}</span><span class="footer-url" data-field="footer_url">{{footer_url}}</span><span class="footer-handle" data-field="footer_handle">{{footer_handle}}</span></div>
</div></div></div>
</body></html>
