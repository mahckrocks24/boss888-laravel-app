<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion Reel — Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07090F; --text:#0B1022; --accent:#C9A56E; --primary:#E8CFA0; --gold-d:rgba(201,165,110,.18);
  --white:#EEF0F8; --muted:rgba(238,240,248,.45);
  --fh:'Cinzel',Georgia,serif; --fb:'Raleway',sans-serif;
  --w:1080px; --h:1920px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#03040A}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#03040A}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}

/* BG */
.layer-bg{position:absolute;inset:0;z-index:1;opacity:0;animation:fade-in 1.4s ease 0s both}
.bg-base{position:absolute;inset:0;background:linear-gradient(160deg,#08091A 0%,#05060F 50%,#070810 100%)}
.bg-blob1{position:absolute;width:800px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(201,165,110,.10) 0%,transparent 65%);top:-150px;right:-150px;animation:float-slow 16s ease-in-out 2s infinite alternate}
.bg-blob2{position:absolute;width:600px;height:500px;border-radius:50%;background:radial-gradient(ellipse,rgba(27,40,82,.60) 0%,transparent 65%);bottom:200px;left:-100px;animation:float-slow 12s ease-in-out 1s infinite alternate-reverse}
.bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(201,165,110,.04) 1px,transparent 1px);background-size:52px 52px}

/* SHAPES */
.layer-shape{position:absolute;inset:0;z-index:2}
/* Gold top rule */
.shape-top-rule{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--primary),var(--accent),transparent);transform:scaleX(0);transform-origin:center;animation:scale-x 1.2s cubic-bezier(.16,1,.3,1) .2s both}
/* Gold bottom rule */
.shape-bot-rule{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,165,110,.35),transparent);transform:scaleX(0);transform-origin:center;animation:scale-x 1.0s cubic-bezier(.16,1,.3,1) .4s both}
/* Outer frame lines */
.shape-frame{position:absolute;top:56px;left:56px;right:56px;bottom:56px;border:1px solid rgba(201,165,110,.10);opacity:0;animation:fade-in .8s ease .6s both}
/* Corner ornaments */
.shape-corner{position:absolute}
.c-tl{top:55px;left:55px;width:28px;height:28px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);opacity:0;animation:fade-in .5s ease .8s both}
.c-tr{top:55px;right:55px;width:28px;height:28px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);opacity:0;animation:fade-in .5s ease .9s both}
.c-bl{bottom:55px;left:55px;width:28px;height:28px;border-bottom:2px solid rgba(201,165,110,.55);border-left:2px solid rgba(201,165,110,.55);opacity:0;animation:fade-in .5s ease 1.0s both}
.c-br{bottom:55px;right:55px;width:28px;height:28px;border-bottom:2px solid rgba(201,165,110,.45);border-right:2px solid rgba(201,165,110,.45);opacity:0;animation:fade-in .5s ease 1.1s both}
/* Vertical gold rules flanking content */
.shape-vline-l{position:absolute;left:120px;top:15%;bottom:15%;width:1px;background:linear-gradient(180deg,transparent,rgba(201,165,110,.20),transparent);opacity:0;animation:fade-in .8s ease 1.2s both}
.shape-vline-r{position:absolute;right:120px;top:15%;bottom:15%;width:1px;background:linear-gradient(180deg,transparent,rgba(201,165,110,.14),transparent);opacity:0;animation:fade-in .8s ease 1.3s both}
/* Diamond ornament */
.shape-diamond{position:absolute;width:12px;height:12px;background:var(--accent);transform:rotate(45deg);top:48%;left:50%;margin-left:-6px;opacity:0;animation:fade-in .5s ease 3.0s both}
.shape-diamond::before{content:'';position:absolute;inset:3px;background:var(--bg);transform:rotate(0deg)}

/* BRAND */
.layer-brand{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:96px 68px 0;gap:14px}
.brand-star{font-family:var(--fb);font-size:16px;letter-spacing:.28em;color:var(--accent);opacity:0;animation:drift-down .7s cubic-bezier(.16,1,.3,1) .9s both}
.brand-name{font-family:var(--fh);font-size:28px;font-weight:700;letter-spacing:.22em;color:var(--white);opacity:0;animation:drift-down .7s cubic-bezier(.16,1,.3,1) 1.05s both}
.brand-sub{font-family:var(--fb);font-size:14px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:0;animation:drift-down .6s cubic-bezier(.16,1,.3,1) 1.2s both}

/* TEXT */
.layer-text{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:580px 80px 0;text-align:center}
.eyebrow{font-family:var(--fb);font-size:16px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:40px;display:flex;align-items:center;gap:18px;opacity:0;animation:fade-in .8s ease 1.4s both}
.eyebrow::before,.eyebrow::after{content:'';width:40px;height:1px;background:var(--accent);flex-shrink:0}

.headline{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:40px}
.hl{font-family:var(--fh);font-size:110px;font-weight:700;line-height:.94;letter-spacing:.04em;color:var(--white);opacity:0;display:block}
.hl-em{color:var(--primary);font-style:italic;font-weight:400}
.hl-1{animation:drift-up .9s cubic-bezier(.16,1,.3,1) 1.9s both}
.hl-2{animation:drift-up .9s cubic-bezier(.16,1,.3,1) 2.3s both}
.hl-3{font-size:88px;animation:drift-up .9s cubic-bezier(.16,1,.3,1) 2.7s both}

.gold-ornament{display:flex;align-items:center;gap:18px;margin-bottom:36px;opacity:0;animation:fade-in .7s ease 3.1s both}
.orn-line{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.orn-line-r{width:80px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.orn-diamond{width:8px;height:8px;background:var(--accent);transform:rotate(45deg);flex-shrink:0}

.divider{width:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:0 auto 48px;animation:line-draw .9s cubic-bezier(.16,1,.3,1) 3.0s both}
.subtext{font-family:var(--fb);font-size:28px;font-weight:300;line-height:1.75;color:var(--muted);max-width:800px;margin-bottom:64px;opacity:0;transform:translateY(24px);animation:fade-rise .9s cubic-bezier(.16,1,.3,1) 3.5s both}

.areas{display:flex;gap:0;width:100%;margin-bottom:80px}
.area{flex:1;padding:32px 20px;border-right:1px solid rgba(201,165,110,.14);display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(18px);animation:fade-rise .6s cubic-bezier(.16,1,.3,1) var(--d) both}
.area:last-child{border-right:none}
.area-name{font-family:var(--fh);font-size:20px;font-weight:600;letter-spacing:.08em;color:var(--white)}
.area-desc{font-family:var(--fb);font-size:21px;font-weight:300;letter-spacing:.08em;color:var(--muted)}
.area:nth-child(1){--d:4.2s}.area:nth-child(2){--d:4.4s}.area:nth-child(3){--d:4.6s}

.cta-wrap{opacity:0;animation:cta-in .8s cubic-bezier(.16,1,.3,1) 5.0s both}
.cta{display:inline-flex;align-items:center;gap:18px;font-family:var(--fb);font-size:18px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--bg);background:linear-gradient(135deg,var(--primary),var(--accent));padding:32px 80px;text-decoration:none;animation:cta-glow 3s ease-in-out 6s infinite}
.cta-arrow{display:inline-block;animation:arrow-nudge 3s ease-in-out 6s infinite}

/* FOOTER */
.layer-footer{position:absolute;z-index:9;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:36px 80px 72px;border-top:1px solid rgba(201,165,110,.12);opacity:0;transform:translateY(20px);animation:fade-rise .7s cubic-bezier(.16,1,.3,1) 5.6s both}
.footer-brand{font-family:var(--fh);font-size:18px;letter-spacing:.14em;color:var(--white)}
.footer-url{font-family:var(--fb);font-size:18px;font-weight:300;letter-spacing:.12em;color:var(--muted)}
.footer-handle{font-family:var(--fb);font-size:18px;font-weight:500;letter-spacing:.10em;color:var(--accent)}

@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift-down{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:translateY(0)}}
@keyframes drift-up{from{opacity:0;transform:translateY(40px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes line-draw{from{width:0;opacity:0}20%{opacity:1}to{width:100%;opacity:1}}
@keyframes scale-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cta-in{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes cta-glow{0%,100%{box-shadow:0 20px 60px rgba(201,165,110,.30)}50%{box-shadow:0 24px 80px rgba(201,165,110,.55)}}
@keyframes arrow-nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(8px)}}
@keyframes float-slow{from{transform:translate(0,0)}to{transform:translate(25px,-20px)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="layer-bg">
    <div class="bg-base"></div><div class="bg-blob1"></div>
    <div class="bg-blob2"></div><div class="bg-dots"></div>
  </div>
  <div class="layer-shape">
    <div class="shape-top-rule"></div><div class="shape-bot-rule"></div>
    <div class="shape-frame"></div>
    <div class="shape-corner c-tl"></div><div class="shape-corner c-tr"></div>
    <div class="shape-corner c-bl"></div><div class="shape-corner c-br"></div>
    <div class="shape-vline-l"></div><div class="shape-vline-r"></div>
    <div class="shape-diamond"></div>
  </div>
  <div class="layer-brand">
    <div class="brand-star" data-field="brand_stars">{{brand_stars}}</div>
    <div class="brand-name" data-field="brand_name">{{brand_name}}</div>
    <div class="brand-sub" data-field="brand_sub">{{brand_sub}}</div>
  </div>
  <div class="layer-text">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <div class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hl-3"><em class="hl-em" data-field="headline_accent">{{headline_accent}}</em></span>
    </div>
    <div class="gold-ornament">
      <div class="orn-line"></div><div class="orn-diamond"></div><div class="orn-line-r"></div>
    </div>
    <div class="divider"></div>
    <p class="subtext" data-field="subheading">{{subheading}}</p>
    <div class="areas">
      <div class="area"><span class="area-name" data-field="area_1_name">{{area_1_name}}</span><span class="area-desc" data-field="area_1_desc">{{area_1_desc}}</span></div>
      <div class="area"><span class="area-name" data-field="area_2_name">{{area_2_name}}</span><span class="area-desc" data-field="area_2_desc">{{area_2_desc}}</span></div>
      <div class="area"><span class="area-name" data-field="area_3_name">{{area_3_name}}</span><span class="area-desc" data-field="area_3_desc">{{area_3_desc}}</span></div>
    </div>
    <div class="cta-wrap"><a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a></div>
  </div>
  <div class="layer-footer">
    <span class="footer-brand" data-field="footer_brand">{{footer_brand}}</span>
    <span class="footer-url" data-field="footer_url">{{footer_url}}</span>
    <span class="footer-handle" data-field="footer_handle">{{footer_handle}}</span>
  </div>
</div></div></div>
</body></html>
