<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Bubbly Reel — Education</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F5F8FF;--blue:#1D4ED8;--blue-l:#60A5FA;--primary:#FF6B00;--accent:#B8FF4A;--text:#070A1F;--fh:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1);--snap:cubic-bezier(.16,1,.3,1);--w:1080px;--h:1920px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#A8C8FF}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}
.b1{position:absolute;width:700px;height:640px;border-radius:50%;background:radial-gradient(ellipse,var(--blue-l) 0%,rgba(96,165,250,.55) 50%,transparent 75%);top:-150px;right:-130px;animation:bi .9s var(--bounce) 0s both,bf 12s ease-in-out 1s infinite alternate}
.b2{position:absolute;width:560px;height:520px;border-radius:50%;background:radial-gradient(ellipse,var(--accent) 0%,rgba(184,255,74,.55) 50%,transparent 75%);bottom:-90px;left:-90px;animation:bi 1.1s var(--bounce) .15s both,bf 14s ease-in-out 3s infinite alternate-reverse}
.b3{position:absolute;width:300px;height:280px;border-radius:50%;background:radial-gradient(ellipse,var(--primary) 0%,transparent 70%);top:780px;right:-40px;animation:bi .8s var(--bounce) .3s both}
.topbar{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:42px 52px}
.brand{display:flex;align-items:center;gap:14px;opacity:0;animation:pi .7s var(--bounce) .6s both}
.bi2{width:52px;height:52px;border-radius:14px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid var(--text);flex-shrink:0;box-shadow:3px 3px 0 var(--text)}
.bn{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--text)}
.bp{font-family:var(--fb);font-size:14px;font-weight:700;color:var(--text);background:var(--accent);padding:12px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);opacity:0;animation:pi .6s var(--bounce) .8s both;transform:rotate(2deg)}
.hero{position:absolute;z-index:5;top:430px;left:60px;right:60px}
.ew{display:flex;gap:12px;align-items:center;margin-bottom:20px;opacity:0;animation:bl .7s var(--bounce) 1.2s both}
.ey{font-family:var(--fb);font-size:18px;font-weight:700;color:var(--text);background:var(--primary);padding:10px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);transform:rotate(-2deg);display:inline-block;color:white}
.headline{margin-bottom:24px;display:flex;flex-direction:column}
.hl{font-family:var(--fh);line-height:.84;letter-spacing:-.04em;color:var(--text);display:block;opacity:0}
.hb{font-size:152px;font-weight:800}
.hbl{color:var(--blue)}
.hi{font-size:152px;font-weight:400;font-style:italic}
.h1{animation:sr .60s var(--bounce) 1.4s both}
.h2{animation:sr .60s var(--bounce) 1.65s both}
.h3{animation:sr .60s var(--bounce) 1.90s both}
.sub{font-size:27px;font-weight:400;line-height:1.65;color:rgba(7,10,31,.58);margin-bottom:40px;opacity:0;animation:pu .8s var(--snap) 2.3s both}
/* Bento cards */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:44px}
.bc{border-radius:22px;padding:28px 24px;border:2.5px solid var(--text);display:flex;flex-direction:column;gap:8px;opacity:0;animation:pi .55s var(--bounce) var(--d) both}
.bc1{background:var(--blue);box-shadow:5px 5px 0 var(--text);transform:rotate(-1.5deg);--d:2.5s}
.bc2{background:var(--accent);box-shadow:5px 5px 0 var(--text);transform:rotate(1.2deg);--d:2.7s}
.bc3{background:var(--primary);box-shadow:5px 5px 0 var(--text);transform:rotate(-.8deg);--d:2.9s}
.bc4{background:white;box-shadow:5px 5px 0 var(--text);transform:rotate(1deg);--d:3.1s}
.bc-emoji{font-size:44px}
.bc-val{font-family:var(--fh);font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;color:white}
.bc2 .bc-val,.bc4 .bc-val{color:var(--text)}
.bc-label{font-family:var(--fb);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.70)}
.bc2 .bc-label,.bc4 .bc-label{color:rgba(7,10,31,.55)}
.cta-wrap{opacity:0;animation:pi .8s var(--bounce) 3.3s both}
.cta{display:inline-flex;align-items:center;gap:16px;font-family:var(--fh);font-size:26px;font-weight:800;color:var(--text);background:var(--accent);padding:28px 64px;border-radius:50px;border:3px solid var(--text);box-shadow:6px 6px 0 var(--text);text-decoration:none;transform:rotate(-.5deg);animation:cb 3s ease-in-out 4s infinite}
.ca{display:inline-block;animation:aw 3s ease-in-out 4s infinite}
.footer{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 52px 52px;opacity:0;animation:pu .7s var(--snap) 4.4s both}
.fb2{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--text)}
.fu{font-family:var(--fb);font-size:16px;color:rgba(7,10,31,.48)}
.fh2{font-family:var(--fb);font-size:16px;font-weight:700;color:var(--blue)}
@keyframes bi{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes bf{from{transform:translate(0,0)}to{transform:translate(18px,-16px)}}
@keyframes pi{from{opacity:0;transform:scale(.60)}to{opacity:1;transform:scale(1)}}
@keyframes pu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes bl{from{opacity:0;transform:translateX(-50px) rotate(-4deg)}70%{transform:translateX(6px)}100%{opacity:1;transform:translateX(0) rotate(-2deg)}}
@keyframes sr{0%{opacity:0;transform:translateY(100px) rotate(-4deg)}65%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0) rotate(0)}}
@keyframes cb{0%,100%{box-shadow:6px 6px 0 var(--text);transform:rotate(-.5deg) translateY(0)}50%{box-shadow:9px 9px 0 var(--text);transform:rotate(-.5deg) translateY(-5px)}}
@keyframes aw{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(10px)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  <div class="topbar"><div class="brand"><div class="bi2" data-field="brand_icon">{{brand_icon}}</div><span class="bn" data-field="brand_name">{{brand_name}}</span></div><span class="bp" data-field="brand_tag">{{brand_tag}}</span></div>
  <div class="hero">
    <div class="ew"><span>🎓</span><span class="ey" data-field="eyebrow">{{eyebrow}}</span></div>
    <div class="headline">
      <span class="hl hb h1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hb hbl h2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hi h3" data-field="headline_3">{{headline_3}}</span>
    </div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="bento">
      <div class="bc bc1"><span class="bc-emoji">📖</span><span class="bc-val">500+</span><span class="bc-label">Courses</span></div>
      <div class="bc bc2"><span class="bc-emoji">🎓</span><span class="bc-val">92%</span><span class="bc-label">Complete</span></div>
      <div class="bc bc3"><span class="bc-emoji">⚡</span><span class="bc-val">14K</span><span class="bc-label">Students</span></div>
      <div class="bc bc4"><span class="bc-emoji">⭐</span><span class="bc-val">4.9</span><span class="bc-label">Rating</span></div>
    </div>
    <div class="cta-wrap"><a class="cta" href="#">Start Learning Free <span class="ca">→</span></a></div>
  </div>
  <div class="footer"><span class="fb2" data-field="footer_brand">{{footer_brand}}</span><span class="fu" data-field="footer_url">{{footer_url}}</span><span class="fh2" data-field="footer_handle">{{footer_handle}}</span></div>
</div></div></div></body></html>
