<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Video Reel — Real Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/*
 ══════════════════════════════════════════════════════════════
  VIDEO REEL — Real Estate   v01
  Format : 1080 × 1920  (9:16)
  Video  : Walking interior/exterior property tour
           Recommended: 8–20s loop, portrait orientation
           Swap: replace src in .video-bg <video> tag
 ══════════════════════════════════════════════════════════════
*/
:root{
  --accent:  #C9A87C;
  --primary:#E2C9A0;
  --bg:  #FAF8F4;
  --w:1080px; --h:1920px;
  --snap: cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#0A0806}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#06040A}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px) {.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px) {.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}

/* ── CANVAS ── */
.reel{
  width:var(--w); height:var(--h);
  position:relative; overflow:hidden;
  background:#0A0806;
}

/* ══ LAYER 1: VIDEO ══════════════════════════════════════════ */
.video-bg{
  position:absolute; inset:0; z-index:1;
  background:#100C08; /* placeholder colour shown before video loads */
}
.video-bg video{
  width:100%; height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
}
/* Placeholder text (remove once real video is added) */
.video-bg::after{display:none!important;}

/* ══ LAYER 2: SCRIM ══════════════════════════════════════════ */
/* Warm bottom-to-top gradient — text lives here */
.scrim{
  position:absolute; inset:0; z-index:2;
  background:linear-gradient(180deg,
      rgba(8,5,2,.60)  0%,        /* top dark for logo */
      transparent       22%,
      transparent       42%,
      rgba(20,10,4,.50) 65%,
      rgba(16,8,2,.82)  80%,
      rgba(12,6,2,.96) 100%
    );
  pointer-events:none;
}
/* Subtle film grain */
.grain{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px; opacity:.025; mix-blend-mode:screen;
}
/* Left-edge vignette */
.vignette{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  background:radial-gradient(ellipse 80% 100% at 50% 50%, transparent 0%, rgba(8,5,2,.35) 100%);
}

/* ══ LAYER 3: BRAND (TOP) ════════════════════════════════════ */
.brand{
  position:absolute; z-index:8;
  top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:64px 72px;
  opacity:0; animation:fade-in .8s var(--snap) .4s both;
}
.brand-logo{
  display:flex; align-items:center; gap:16px;
}
.brand-mark{
  width:40px; height:40px;
  border:1.5px solid var(--accent);
  display:flex; align-items:center; justify-content:center;
}
.brand-mark::after{content:''; width:10px; height:10px; background:var(--accent);}
.brand-name{
  font-family:'Jost',sans-serif; font-size:16px; font-weight:400;
  letter-spacing:.28em; text-transform:uppercase; color:var(--bg);
}
.brand-lic{
  font-family:'Jost',sans-serif; font-size:20px; font-weight:200;
  letter-spacing:.22em; text-transform:uppercase; color:rgba(250,248,244,.42);
}

/* ══ LAYER 4: CONTENT (LOWER-LEFT) ══════════════════════════ */
.content{
  position:absolute; z-index:8;
  bottom:0; left:0; right:0;
  padding:0 72px 96px;
}

/* Property tag */
.prop-tag{
  font-family:'Jost',sans-serif;
  font-size:13px; font-weight:300; letter-spacing:.32em; text-transform:uppercase;
  color:var(--accent);
  display:flex; align-items:center; gap:14px;
  margin-bottom:24px;
  opacity:0; animation:slide-up .7s var(--snap) .8s both;
}
.prop-tag::before{content:''; width:24px; height:1px; background:var(--accent); flex-shrink:0;}

/* Headline — sparse, 2 lines max */
.headline{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:96px; font-weight:300;
  line-height:.96; letter-spacing:-.01em;
  color:var(--bg);
  margin-bottom:24px;
}
.headline em{
  font-style:italic; font-weight:300;
  color:var(--primary);
  display:block;
}
.hl-1{opacity:0; animation:slide-up .8s var(--snap) 1.0s both; display:block;}
.hl-2{opacity:0; animation:slide-up .8s var(--snap) 1.25s both; display:block;}

/* Thin gold rule */
.rule{
  width:0; height:1px;
  background:linear-gradient(90deg, var(--accent), transparent);
  margin-bottom:28px;
  animation:draw-line .9s var(--snap) 1.6s both;
}

/* Subtext — max 1 line */
.sub{
  font-family:'Jost',sans-serif;
  font-size:22px; font-weight:200; letter-spacing:.08em;
  color:rgba(250,248,244,.60);
  margin-bottom:48px;
  opacity:0; animation:slide-up .7s var(--snap) 1.7s both;
}

/* CTA */
.cta{
  display:inline-flex; align-items:center; gap:16px;
  font-family:'Jost',sans-serif;
  font-size:14px; font-weight:400; letter-spacing:.28em; text-transform:uppercase;
  color:rgba(8,5,2,.90); background:var(--accent);
  padding:22px 52px;
  text-decoration:none;
  opacity:0; animation:slide-up .7s var(--snap) 2.0s both;
  transition:transform .22s; border:none;
}
.cta:hover{transform:translateY(-2px);}
.cta-arrow{display:inline-block; transition:transform .22s;}
.cta:hover .cta-arrow{transform:translateX(6px);}

/* ══ KEYFRAMES ══ */
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes slide-up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw-line{from{width:0;opacity:0}to{width:60%;opacity:1}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="sw">
<div class="reel">

  <!-- ── LAYER 1: VIDEO ─────────────────────────────────────────
       SWAP: replace the src below with your actual property video.
       Recommended: 10–20s walking tour (interior + exterior)
       Format: MP4/WebM, portrait (9:16) or landscape cropped
  ─────────────────────────────────────────────────────────────── -->
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>

  <!-- Scrim + grain -->
  <div class="scrim"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- ── BRAND ──────────────────────────────────────────────── -->
  <div class="brand">
    <div class="brand-logo">
      <div class="brand-mark"></div>
      <!-- SWAP: your brand name -->
      <span class="brand-name" data-field="brand_name">{{brand_name}}</span>
    </div>
    <!-- SWAP: license or tagline -->
    <span class="brand-lic" data-field="brand_lic">{{brand_lic}}</span>
  </div>

  <!-- ── CONTENT ────────────────────────────────────────────── -->
  <div class="content">
    <div class="prop-tag">
      <!-- SWAP: property location or type -->
      Downtown Dubai · Penthouse
    </div>
    <h1 class="headline">
      <!-- SWAP: property headline — max 2 short lines -->
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <em class="hl-2">Meet Legacy.</em>
    </h1>
    <div class="rule"></div>
    <p class="sub">
      <!-- SWAP: single key detail — size, price, or one benefit -->
      4 Bed · 4,200 sqft · From AED 6.8M
    </p>
    <a class="cta" href="#">
      <!-- SWAP: CTA text -->
      Book a Viewing <span class="cta-arrow">→</span>
    </a>
  </div>

</div>
</div></div>
</body>
</html>
