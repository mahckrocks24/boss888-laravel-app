<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Travel v03 | Drone landscape / destination footage | Horizon split scrim */
:root{--terra:#C46040;--primary:#0D9488;--accent:#2DD4BF;--bg:#FDF6EE;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#040A08}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#030806}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#040A08}
.video-bg{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#0A1A10 0%,#060C08 60%,#0A1208 100%)}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block}
.video-bg::after{display:none!important;}
/* Horizon split scrim — sky dark, ground bright, bottom dark */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(4,10,8,.80) 0%,rgba(4,10,8,.30) 25%,transparent 42%,rgba(4,10,8,.20) 58%,rgba(4,10,8,.70) 75%,rgba(4,10,8,.96) 100%)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.025;mix-blend-mode:screen}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:64px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--bg);letter-spacing:.06em}
.brand-sub{font-family:'Jost',sans-serif;font-size:12px;font-weight:200;letter-spacing:.22em;text-transform:uppercase;color:rgba(253,246,238,.38)}
/* Location pill */
.location-pill{position:absolute;z-index:8;top:50%;left:72px;transform:translateY(-200%);display:flex;align-items:center;gap:12px;opacity:0;animation:fi .7s var(--snap) .7s both}
.loc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px rgba(45,212,191,.60)}
.loc-text{font-family:'Jost',sans-serif;font-size:14px;font-weight:300;letter-spacing:.18em;text-transform:uppercase;color:rgba(253,246,238,.60)}
/* CONTENT — lower centre */
.content{position:absolute;z-index:8;bottom:0;left:0;right:0;padding:0 72px 96px;text-align:center;display:flex;flex-direction:column;align-items:center}
.headline{font-family:'Fraunces',serif;font-size:100px;line-height:.94;color:var(--bg);margin-bottom:24px;letter-spacing:-.01em}
.hl-1{display:block;font-weight:300;opacity:0;animation:su .8s var(--snap) 1.0s both}
.hl-2{display:block;font-style:italic;font-weight:300;color:var(--accent);opacity:0;animation:su .8s var(--snap) 1.25s both}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);margin-bottom:24px;animation:dl .9s var(--snap) 1.5s both}
.sub{font-family:'Jost',sans-serif;font-size:20px;font-weight:200;letter-spacing:.10em;color:rgba(253,246,238,.52);margin-bottom:48px;opacity:0;animation:su .7s var(--snap) 1.65s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Jost',sans-serif;font-size:13px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:var(--bg);background:transparent;border:1px solid rgba(253,246,238,.35);padding:20px 52px;text-decoration:none;opacity:0;animation:su .7s var(--snap) 1.9s both;transition:all .22s;backdrop-filter:blur(6px)}
.cta:hover{background:rgba(253,246,238,.10);border-color:var(--accent)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 40px;opacity:0;animation:fi .6s var(--snap) 2.2s both}
.bt{font-family:'Jost',sans-serif;font-size:12px;font-weight:200;letter-spacing:.16em;color:rgba(253,246,238,.32)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes dl{from{width:0;opacity:0}to{width:70%;opacity:1}}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><span class="brand-name" data-field="brand_name">{{brand_name}}</span><span class="brand-sub" data-field="brand_sub">{{brand_sub}}</span></div>
  <div class="location-pill"><span class="loc-dot"></span><span class="loc-text">📍 Amalfi Coast, Italy</span></div>
  <div class="content">
    <h1 class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <div class="rule"></div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom"><span class="bt">companyname.com</span><span class="bt">@handle</span></div>
</div></div></div>
</body></html>
