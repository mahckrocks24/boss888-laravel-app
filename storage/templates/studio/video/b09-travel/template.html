<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><title>Bubbly — Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#F0FAFF;--cobalt:#0284C7;--primary:#FF8C00;--accent:#FF4D6D;--sky:#BAE6FD;--lime:#ECFCCB;--text:#041020;--fh:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--b:cubic-bezier(.34,1.56,.64,1);--w:1080px;--h:1920px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#7AC8E8}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}
.b1{position:absolute;width:700px;height:640px;border-radius:50%;background:radial-gradient(ellipse,var(--sky) 0%,rgba(186,230,253,.55) 50%,transparent 75%);top:-150px;right:-130px;animation:bi .9s var(--b) 0s both}
.b2{position:absolute;width:560px;height:520px;border-radius:50%;background:radial-gradient(ellipse,var(--primary) 0%,rgba(255,140,0,.50) 50%,transparent 75%);bottom:-90px;left:-80px;animation:bi 1.1s var(--b) .15s both}
.b3{position:absolute;width:280px;height:260px;border-radius:50%;background:radial-gradient(ellipse,var(--accent) 0%,transparent 70%);top:820px;right:-30px;animation:bi .8s var(--b) .3s both}
.topbar{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:42px 52px}
.brand{display:flex;align-items:center;gap:14px;opacity:0;animation:pi .7s var(--b) .6s both}
.bi2{width:52px;height:52px;border-radius:50%;background:var(--cobalt);display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid var(--text);flex-shrink:0;box-shadow:3px 3px 0 var(--text)}
.bn{font-family:var(--fh);font-size:22px;font-weight:800;color:var(--text)}
.bp{font-family:var(--fb);font-size:14px;font-weight:700;color:var(--text);background:var(--primary);padding:12px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);opacity:0;animation:pi .6s var(--b) .8s both;transform:rotate(2deg)}
.hero{position:absolute;z-index:5;top:420px;left:60px;right:60px}
.ew{display:flex;gap:12px;align-items:center;margin-bottom:20px;opacity:0;animation:bl .7s var(--b) 1.2s both}
.ey{font-family:var(--fb);font-size:18px;font-weight:700;color:white;background:var(--cobalt);padding:10px 24px;border-radius:50px;border:2.5px solid var(--text);box-shadow:3px 3px 0 var(--text);transform:rotate(-2deg);display:inline-block}
.headline{margin-bottom:24px;display:flex;flex-direction:column}
.hl{font-family:var(--fh);line-height:.84;letter-spacing:-.04em;color:var(--text);display:block;opacity:0}
.hb{font-size:158px;font-weight:800}
.hi{font-size:158px;font-weight:400;font-style:italic;color:var(--cobalt)}
.h1{animation:sr .60s var(--b) 1.4s both}.h2{animation:sr .60s var(--b) 1.65s both}.h3{animation:sr .60s var(--b) 1.90s both}
.sub{font-size:27px;font-weight:400;line-height:1.65;color:rgba(4,16,32,.58);margin-bottom:40px;opacity:0;animation:pu .8s ease 2.3s both}
.dest-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:40px;opacity:0;animation:pi .7s var(--b) 2.5s both}
.dc{padding:22px 16px;border-radius:18px;border:2.5px solid var(--text);display:flex;flex-direction:column;align-items:center;gap:8px}
.dc1{background:var(--sky);box-shadow:4px 4px 0 var(--text);transform:rotate(-1.5deg)}
.dc2{background:var(--primary);box-shadow:4px 4px 0 var(--text);transform:rotate(1.2deg)}
.dc3{background:var(--accent);box-shadow:4px 4px 0 var(--text);transform:rotate(-.8deg)}
.dc-flag{font-size:44px}
.dc-name{font-family:var(--fh);font-size:20px;font-weight:700;color:var(--text)}
.dc3 .dc-name{color:white}
.dc-price{font-family:var(--fb);font-size:16px;font-weight:700;color:rgba(4,16,32,.60)}
.dc3 .dc-price{color:rgba(255,255,255,.70)}
.perks{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:44px;opacity:0;animation:pi .7s var(--b) 3.0s both}
.perk{font-family:var(--fb);font-size:18px;font-weight:600;padding:12px 22px;border-radius:50px;border:2.5px solid var(--text);display:flex;align-items:center;gap:8px}
.pk1{background:var(--lime);transform:rotate(-1deg);box-shadow:3px 3px 0 var(--text)}
.pk2{background:white;transform:rotate(1.3deg);box-shadow:3px 3px 0 var(--text)}
.pk3{background:var(--cobalt);color:white;transform:rotate(-.8deg);box-shadow:3px 3px 0 var(--text)}
.cta-wrap{opacity:0;animation:pi .8s var(--b) 3.3s both}
.cta{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--fh);font-size:26px;font-weight:800;color:white;background:var(--cobalt);padding:28px 64px;border-radius:50px;border:3px solid var(--text);box-shadow:6px 6px 0 var(--text);text-decoration:none;width:100%;transform:rotate(-.5deg);animation:cb 3s ease-in-out 4s infinite}
.ca{display:inline-block;animation:aw 3s ease-in-out 4s infinite}
.footer{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px 52px 52px;opacity:0;animation:pu .7s ease 4.2s both}
.fb2{font-family:var(--fh);font-size:20px;font-weight:800;color:var(--text)}.fu{font-family:var(--fb);font-size:16px;color:rgba(4,16,32,.48)}.fh2{font-family:var(--fb);font-size:16px;font-weight:700;color:var(--cobalt)}
@keyframes bi{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes pi{from{opacity:0;transform:scale(.60)}to{opacity:1;transform:scale(1)}}
@keyframes pu{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes bl{from{opacity:0;transform:translateX(-50px) rotate(-4deg)}70%{transform:translateX(6px)}100%{opacity:1;transform:translateX(0) rotate(-2deg)}}
@keyframes sr{0%{opacity:0;transform:translateY(100px) rotate(-4deg)}65%{transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cb{0%,100%{box-shadow:6px 6px 0 var(--text);transform:rotate(-.5deg) translateY(0)}50%{box-shadow:9px 9px 0 var(--text);transform:rotate(-.5deg) translateY(-5px)}}
@keyframes aw{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(10px)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="b1"></div><div class="b2"></div><div class="b3"></div>
  <div class="topbar"><div class="brand"><div class="bi2" data-field="brand_icon">{{brand_icon}}</div><span class="bn" data-field="brand_name">{{brand_name}}</span></div><span class="bp" data-field="brand_tag">{{brand_tag}}</span></div>
  <div class="hero">
    <div class="ew"><span>🌍</span><span class="ey" data-field="eyebrow">{{eyebrow}}</span></div>
    <div class="headline">
      <span class="hl hb h1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hi h2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hb h3" data-field="headline_3">{{headline_3}}</span>
    </div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="dest-grid">
      <div class="dc dc1"><span class="dc-flag">🇦🇪</span><span class="dc-name">Dubai</span><span class="dc-price">from $899</span></div>
      <div class="dc dc2"><span class="dc-flag">🇯🇵</span><span class="dc-name">Tokyo</span><span class="dc-price">from $1,299</span></div>
      <div class="dc dc3"><span class="dc-flag">🇮🇹</span><span class="dc-name">Amalfi</span><span class="dc-price">from $1,499</span></div>
    </div>
    <div class="perks">
      <span class="perk pk1">✈️ Free cancellation</span>
      <span class="perk pk2">🏨 Hand-picked hotels</span>
      <span class="perk pk3">💬 24/7 support</span>
    </div>
    <div class="cta-wrap"><a class="cta" href="#">Find Your Trip <span class="ca">→</span></a></div>
  </div>
  <div class="footer"><span class="fb2" data-field="footer_brand">{{footer_brand}}</span><span class="fu" data-field="footer_url">{{footer_url}}</span><span class="fh2" data-field="footer_handle">{{footer_handle}}</span></div>
</div></div></div></body></html>
