<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Fitness</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Fitness v04 | Athlete training footage | Dark top+bottom, centre punch */
:root{--primary:#FF006E;--accent:#FF4D9A;--yellow:#FFE600;--bg:#F8F8F8;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#050505}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#040404}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#0A0A0A}
.video-bg{position:absolute;inset:0;z-index:1;background:#0A0A0A}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.20) contrast(1.05)}
.video-bg::after{display:none!important;}
/* Top AND bottom bars dark, middle shows through */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(5,5,5,.90) 0%,rgba(5,5,5,.40) 20%,transparent 38%,transparent 62%,rgba(5,5,5,.40) 80%,rgba(5,5,5,.94) 100%)}
/* Neon pink top accent line */
.top-line{position:absolute;z-index:4;top:0;left:0;right:0;height:4px;background:var(--primary);box-shadow:0 0 20px rgba(255,0,110,.60)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.025;mix-blend-mode:screen}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:56px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Anton',Impact,sans-serif;font-size:22px;letter-spacing:.12em;color:var(--bg)}
.brand-tag{font-family:'Barlow',sans-serif;font-size:20px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,0,110,.80)}
/* CONTENT — centre, big impact */
.content{position:absolute;z-index:8;top:50%;left:0;right:0;transform:translateY(-50%);padding:0 72px;text-align:center}
.headline{font-family:'Anton',Impact,sans-serif;font-size:170px;line-height:.82;letter-spacing:.01em;text-transform:uppercase;color:var(--bg);text-shadow:0 0 60px rgba(255,0,110,.30);margin-bottom:28px}
.hl-1{display:block;opacity:0;animation:slam .50s var(--snap) 1.0s both}
.hl-2{display:block;color:var(--primary);text-shadow:0 0 40px rgba(255,0,110,.50);opacity:0;animation:slam .50s var(--snap) 1.25s both}
.hl-3{display:block;-webkit-text-stroke:2px var(--bg);color:transparent;opacity:0;animation:slam .50s var(--snap) 1.50s both}
.sub{font-family:'Barlow',sans-serif;font-size:22px;font-weight:200;letter-spacing:.14em;text-transform:uppercase;color:rgba(248,248,248,.50);margin-bottom:52px;opacity:0;animation:fi .7s var(--snap) 1.8s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#050505;background:var(--primary);padding:22px 56px;text-decoration:none;opacity:0;animation:su .7s var(--snap) 2.0s both;border:none;box-shadow:0 0 30px rgba(255,0,110,.35);animation:su .7s var(--snap) 2.0s both,pg 2.5s ease-in-out 3.5s infinite;transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 56px;opacity:0;animation:fi .6s var(--snap) 2.3s both}
.bt{font-family:'Barlow',sans-serif;font-size:12px;font-weight:300;letter-spacing:.16em;color:rgba(248,248,248,.32)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slam{0%{opacity:0;transform:translateY(80px) skewY(3deg);filter:blur(5px)}70%{filter:blur(0)}100%{opacity:1;transform:translateY(0) skewY(0)}}
@keyframes pg{0%,100%{box-shadow:0 0 30px rgba(255,0,110,.35)}50%{box-shadow:0 0 50px rgba(255,0,110,.65)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="top-line"></div>
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><span class="brand-name" data-field="brand_name">{{brand_name}}</span><span class="brand-tag" data-field="brand_tag">{{brand_tag}}</span></div>
  <div class="content">
    <h1 class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
      <span class="hl hl-3" data-field="headline_3">{{headline_3}}</span>
    </h1>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom"><span class="bt">companyname.com</span><span class="bt">@handle</span></div>
</div></div></div>
</body></html>
