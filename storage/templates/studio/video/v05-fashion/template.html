<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Fashion</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Fashion/Beauty v05 | Runway/editorial footage | Lateral left fade, left column */
:root{--primary:#E8A0B8;--accent:#C9A070;--bg:#FAF8F4;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#0A0508}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#080406}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#0A0508}
.video-bg{position:absolute;inset:0;z-index:1;background:#100810}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.80)}
.video-bg::after{display:none!important;}
/* LEFT side dark — right shows video */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(10,5,8,.96) 0%,rgba(10,5,8,.82) 28%,rgba(10,5,8,.35) 52%,transparent 72%),linear-gradient(180deg,rgba(10,5,8,.65) 0%,transparent 15%,transparent 82%,rgba(10,5,8,.85) 100%)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.022;mix-blend-mode:screen}
/* Thin gold top rule */
.top-rule{position:absolute;z-index:4;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--accent),var(--primary),transparent)}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;padding:72px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Italiana',Georgia,serif;font-size:26px;color:var(--bg);letter-spacing:.12em}
.brand-season{font-family:'Raleway',sans-serif;font-size:11px;font-weight:200;letter-spacing:.30em;text-transform:uppercase;color:rgba(250,248,244,.35);margin-top:5px}
/* CONTENT — left column, vertical centre */
.content{position:absolute;z-index:8;top:50%;left:0;transform:translateY(-50%);padding:0 0 0 72px;max-width:480px}
.eyebrow{font-family:'Raleway',sans-serif;font-size:18px;font-weight:300;letter-spacing:.36em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:14px;margin-bottom:28px;opacity:0;animation:sl .7s var(--snap) .8s both}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--primary);flex-shrink:0}
.headline{font-family:'Italiana',Georgia,serif;font-size:100px;line-height:.94;color:var(--bg);margin-bottom:24px}
.hl-1{display:block;opacity:0;animation:sl .8s var(--snap) 1.0s both}
.hl-2{display:block;font-style:italic;color:var(--primary);opacity:0;animation:sl .8s var(--snap) 1.25s both}
.rule{width:0;height:1px;background:linear-gradient(90deg,var(--primary),rgba(232,160,184,.20));margin-bottom:24px;animation:dl .9s var(--snap) 1.5s both}
.sub{font-family:'Raleway',sans-serif;font-size:18px;font-weight:200;letter-spacing:.10em;color:rgba(250,248,244,.48);margin-bottom:48px;opacity:0;animation:sl .7s var(--snap) 1.65s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Raleway',sans-serif;font-size:12px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:rgba(10,5,8,.90);background:var(--primary);padding:20px 48px;text-decoration:none;opacity:0;animation:sl .7s var(--snap) 1.9s both;border:none;transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 56px;opacity:0;animation:fi .6s var(--snap) 2.2s both}
.bt{font-family:'Raleway',sans-serif;font-size:11px;font-weight:200;letter-spacing:.18em;color:rgba(250,248,244,.28)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes sl{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes dl{from{width:0;opacity:0}to{width:90%;opacity:1}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="top-rule"></div>
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><div class="brand-name" data-field="brand_name">{{brand_name}}</div><div class="brand-season">SS 2025 Collection</div></div>
  <div class="content">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <div class="rule"></div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom"><span class="bt">companyname.com</span><span class="bt">@handle</span></div>
</div></div></div>
</body></html>
