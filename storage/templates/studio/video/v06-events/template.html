<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Events</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Events v06 | Crowd / venue energy footage | Full dark overlay, stacked centre */
:root{--purple:#9333EA;--accent:#E91E8C;--primary:#22D3EE;--bg:#FAF5FF;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#07020E}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#06010C}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#07020E}
.video-bg{position:absolute;inset:0;z-index:1;background:#07020E}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.25) brightness(.60)}
.video-bg::after{display:none!important;}
/* Heavy overlay — video peeks through centre */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 50%, rgba(7,2,14,.20) 0%, rgba(7,2,14,.55) 50%, rgba(7,2,14,.92) 100%)}
/* Neon top bar: 3 colour lines */
.top-lines{position:absolute;z-index:4;top:0;left:0;right:0}
.tl-1{height:3px;background:var(--purple);box-shadow:0 0 14px rgba(147,51,234,.60)}
.tl-2{height:2px;background:var(--accent);box-shadow:0 0 12px rgba(233,30,140,.55)}
.tl-3{height:2px;background:var(--primary);box-shadow:0 0 10px rgba(34,211,238,.45)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.025;mix-blend-mode:screen}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:60px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:.12em;color:var(--bg)}
/* Date badge */
.date-badge{display:flex;flex-direction:column;align-items:center;background:rgba(233,30,140,.15);border:1px solid rgba(233,30,140,.35);backdrop-filter:blur(8px);padding:12px 24px}
.date-num{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;color:var(--bg);line-height:1}
.date-mon{font-family:'Barlow',sans-serif;font-size:12px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
/* CONTENT — centre stacked */
.content{position:absolute;z-index:8;top:50%;left:0;right:0;transform:translateY(-50%);padding:0 72px;text-align:center;display:flex;flex-direction:column;align-items:center}
.headline{font-family:'Bebas Neue',Impact,sans-serif;font-size:180px;line-height:.82;letter-spacing:.01em;color:var(--bg);margin-bottom:28px;text-shadow:0 0 60px rgba(147,51,234,.30)}
.hl-1{display:block;opacity:0;animation:sl .50s var(--snap) 1.0s both}
.hl-2{display:block;color:var(--accent);text-shadow:0 0 40px rgba(233,30,140,.50);opacity:0;animation:sl .50s var(--snap) 1.25s both}
.sub{font-family:'Barlow',sans-serif;font-size:22px;font-weight:200;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,245,255,.45);margin-bottom:52px;opacity:0;animation:fi .7s var(--snap) 1.6s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;letter-spacing:.10em;color:#07020E;background:linear-gradient(90deg,var(--accent),var(--purple));padding:22px 64px;text-decoration:none;opacity:0;animation:su .7s var(--snap) 1.9s both;border:none;box-shadow:0 0 40px rgba(233,30,140,.35);transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 56px;opacity:0;animation:fi .6s var(--snap) 2.2s both}
.bt{font-family:'Barlow',sans-serif;font-size:12px;font-weight:200;letter-spacing:.16em;color:rgba(250,245,255,.28)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sl{0%{opacity:0;transform:translateY(80px) skewY(2deg);filter:blur(4px)}70%{filter:blur(0)}100%{opacity:1;transform:translateY(0) skewY(0)}}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="top-lines"><div class="tl-1"></div><div class="tl-2"></div><div class="tl-3"></div></div>
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand">
    <span class="brand-name" data-field="brand_name">{{brand_name}}</span>
    <div class="date-badge"><span class="date-num">25</span><span class="date-mon">Oct 2025</span></div>
  </div>
  <div class="content">
    <h1 class="headline"><span class="hl hl-1" data-field="headline_1">{{headline_1}}</span><span class="hl hl-2" data-field="headline_2">{{headline_2}}</span></h1>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom"><span class="bt">companyname.com</span><span class="bt">@handle</span></div>
</div></div></div>
</body></html>
