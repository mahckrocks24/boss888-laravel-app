<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Automotive</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Automotive v07 | Driving / car footage | Speed vignette, lower-right */
:root{--primary:#FF2D55;--silver:#C8CDD6;--bg:#F5F5F5;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#060606}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#050505}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#080808}
.video-bg{position:absolute;inset:0;z-index:1;background:#080808}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.10) contrast(1.08) brightness(.72)}
.video-bg::after{display:none!important;}
/* Speed vignette — heavier on edges and bottom */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(160deg,rgba(6,6,6,.70) 0%,transparent 30%,transparent 55%,rgba(6,6,6,.50) 75%,rgba(6,6,6,.96) 100%),radial-gradient(ellipse 85% 85% at 50% 50%,transparent 30%,rgba(6,6,6,.55) 100%)}
/* Red top stripe */
.top-line{position:absolute;z-index:4;top:0;left:0;right:0;height:4px;background:var(--primary);box-shadow:0 0 18px rgba(255,45,85,.55)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.025;mix-blend-mode:screen}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:56px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--bg)}
.brand-model{font-family:'Barlow',sans-serif;font-size:12px;font-weight:200;letter-spacing:.24em;text-transform:uppercase;color:rgba(245,245,245,.40)}
/* CONTENT — lower right */
.content{position:absolute;z-index:8;bottom:0;right:0;padding:0 72px 96px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.eyebrow{font-family:'Barlow',sans-serif;font-size:20px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:14px;margin-bottom:20px;opacity:0;animation:sr .7s var(--snap) .8s both}
.eyebrow::after{content:'';width:20px;height:2px;background:var(--primary);flex-shrink:0}
.headline{font-family:'Orbitron',sans-serif;font-size:88px;line-height:.88;letter-spacing:-.02em;color:var(--bg);margin-bottom:24px;text-align:right}
.hl-1{display:block;font-weight:900;opacity:0;animation:sr .55s var(--snap) 1.0s both}
.hl-2{display:block;font-weight:400;-webkit-text-stroke:1.5px var(--bg);color:transparent;opacity:0;animation:sr .55s var(--snap) 1.22s both}
.rule{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary));margin-bottom:20px;animation:dlr .9s var(--snap) 1.5s both;align-self:flex-end}
.sub{font-family:'Barlow',sans-serif;font-size:20px;font-weight:200;letter-spacing:.10em;color:rgba(245,245,245,.45);margin-bottom:48px;opacity:0;animation:sr .7s var(--snap) 1.65s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--primary);padding:20px 48px;text-decoration:none;opacity:0;animation:sr .7s var(--snap) 1.9s both;border:none;box-shadow:4px 4px 0 rgba(255,45,85,.20);transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.bottom{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 44px;opacity:0;animation:fi .6s var(--snap) 2.2s both}
.bt{font-family:'Barlow',sans-serif;font-size:12px;font-weight:200;letter-spacing:.16em;color:rgba(245,245,245,.28)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes sr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@keyframes dlr{from{width:0;opacity:0}to{width:80%;opacity:1}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="top-line"></div>
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><span class="brand-name" data-field="brand_name">{{brand_name}}</span><span class="brand-model">2025 Model · Performance Division</span></div>
  <div class="content">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <div class="rule"></div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom"><span class="bt">companyname.com</span><span class="bt">@handle</span></div>
</div></div></div>
</body></html>
