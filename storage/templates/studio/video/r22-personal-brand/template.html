<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Motion Reel — Personal Brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080610;--accent:#7C3AED;--primary:#A78BFA;--violet-ll:#DDD6FE;--lime:#A3E635;--white:#FAF8FF;--muted:rgba(250,248,255,.45);--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;--w:1080px;--h:1920px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#04030A}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#03020A}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--fb)}
.layer-bg{position:absolute;inset:0;z-index:1;opacity:0;animation:fade-in 1s ease 0s both}
.bg-base{position:absolute;inset:0;background:linear-gradient(160deg,#0E0820 0%,var(--bg) 55%,#0A0818 100%)}
.bg-v{position:absolute;width:800px;height:700px;border-radius:50%;background:radial-gradient(ellipse,rgba(124,58,237,.22) 0%,transparent 65%);top:-120px;right:-80px;animation:float-slow 14s ease-in-out 1s infinite alternate}
.bg-lime{position:absolute;width:400px;height:300px;border-radius:50%;background:radial-gradient(ellipse,rgba(163,230,53,.08) 0%,transparent 65%);bottom:300px;left:60px;animation:float-slow 10s ease-in-out 3s infinite alternate-reverse}
.bg-grain{position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:160px;opacity:.025;mix-blend-mode:screen}
.layer-shape{position:absolute;inset:0;z-index:2}
.shape-top{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--primary),var(--lime));transform:scaleX(0);transform-origin:left;animation:scale-x .9s cubic-bezier(.16,1,.3,1) 0s both;box-shadow:0 0 14px rgba(124,58,237,.50)}
/* Avatar circle placeholder */
.avatar{position:absolute;z-index:4;width:280px;height:280px;border-radius:50%;border:3px solid var(--primary);top:320px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1A1030,#0E0820);display:flex;align-items:center;justify-content:center;overflow:hidden;opacity:0;animation:pop-in .8s cubic-bezier(.34,1.56,.64,1) 1.0s both;box-shadow:0 0 0 12px rgba(124,58,237,.12),0 0 60px rgba(124,58,237,.25)}
.avatar-inner{font-size:100px;line-height:1}
/* Verified badge */
.badge-v{position:absolute;z-index:5;top:550px;right:calc(50% - 155px);background:var(--accent);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;border:3px solid var(--bg);opacity:0;animation:pop-in .5s cubic-bezier(.34,1.56,.64,1) 1.5s both;box-shadow:0 0 16px rgba(124,58,237,.50)}
/* Social handles floating */
.social{position:absolute;z-index:4;display:flex;align-items:center;gap:10px;font-family:var(--fb);font-size:16px;font-weight:500;letter-spacing:.08em;color:var(--violet-ll);background:rgba(124,58,237,.12);border:1px solid rgba(167,139,250,.22);padding:10px 20px;border-radius:30px;opacity:0;animation:bounce-in .5s cubic-bezier(.34,1.56,.64,1) var(--d) both;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.soc-1{top:680px;left:80px;--d:1.6s}.soc-2{top:680px;right:80px;--d:1.8s}
.layer-text{position:absolute;z-index:6;top:760px;left:80px;right:80px;display:flex;flex-direction:column;align-items:center;text-align:center}
.name{font-family:var(--fh);font-size:80px;font-weight:800;letter-spacing:-.03em;color:var(--white);opacity:0;animation:slam-up .7s cubic-bezier(.16,1,.3,1) 1.6s both;margin-bottom:8px}
.title{font-family:var(--fb);font-size:24px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);opacity:0;animation:fade-in .7s ease 2.0s both;margin-bottom:36px}
.rule{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--lime),transparent);margin:0 auto 40px;border-radius:2px;animation:line-draw .8s cubic-bezier(.16,1,.3,1) 2.4s both}
.bio{font-family:var(--fb);font-size:26px;font-weight:300;line-height:1.70;color:var(--muted);margin-bottom:52px;opacity:0;transform:translateY(18px);animation:fade-rise .9s cubic-bezier(.16,1,.3,1) 2.8s both}
/* Social stats bento */
.stats-bento{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:52px;width:100%}
.sstat{background:rgba(124,58,237,.08);border:1px solid rgba(167,139,250,.16);padding:28px 18px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:scale(.88);animation:card-pop .55s cubic-bezier(.34,1.56,.64,1) var(--d) both}
.sstat-icon{font-size:28px}
.sstat-val{font-family:var(--fh);font-size:40px;font-weight:800;color:var(--white);letter-spacing:-.03em;line-height:1}
.sstat-label{font-family:var(--fb);font-size:12px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sstat:nth-child(1){--d:3.8s}.sstat:nth-child(2){--d:4.0s}.sstat:nth-child(3){--d:4.2s}
.topics{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:56px}
.topic{font-family:var(--fb);font-size:16px;font-weight:500;letter-spacing:.06em;color:var(--violet-ll);border:1px solid rgba(167,139,250,.24);background:rgba(124,58,237,.08);padding:12px 24px;border-radius:30px;opacity:0;transform:scale(.88);animation:card-pop .4s cubic-bezier(.34,1.56,.64,1) var(--d) both}
.topic:nth-child(1){--d:4.4s}.topic:nth-child(2){--d:4.55s}.topic:nth-child(3){--d:4.70s}.topic:nth-child(4){--d:4.85s}
.cta-wrap{opacity:0;animation:bounce-in .8s cubic-bezier(.34,1.56,.64,1) 5.0s both;width:100%}
.cta{display:flex;align-items:center;justify-content:center;gap:16px;font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:.06em;color:var(--bg);background:linear-gradient(90deg,var(--accent),var(--primary));padding:36px 80px;text-decoration:none;width:100%;border-radius:50px;box-shadow:0 0 40px rgba(124,58,237,.35);animation:cta-pulse 2.5s ease-in-out 6s infinite}
.cta-arrow{display:inline-block;animation:arrow-nudge 2.5s ease-in-out 6s infinite}
.layer-footer{position:absolute;z-index:9;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:28px 80px 64px;border-top:1px solid rgba(167,139,250,.12);opacity:0;transform:translateY(16px);animation:fade-rise .7s ease 5.6s both}
.footer-url{font-family:var(--fb);font-size:16px;font-weight:300;letter-spacing:.12em;color:var(--muted)}
.footer-handle{font-family:var(--fh);font-size:18px;font-weight:700;color:var(--primary)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes fade-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce-in{from{opacity:0;transform:scale(.80)}to{opacity:1;transform:scale(1)}}
@keyframes card-pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes pop-in{from{opacity:0;transform:translateX(-50%) scale(0)}to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes slam-up{0%{opacity:0;transform:translateY(60px);filter:blur(4px)}70%{filter:blur(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes line-draw{from{width:0;opacity:0}to{width:100%;opacity:1}}
@keyframes scale-x{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cta-pulse{0%,100%{box-shadow:0 0 40px rgba(124,58,237,.35)}50%{box-shadow:0 0 60px rgba(124,58,237,.60)}}
@keyframes arrow-nudge{0%,80%,100%{transform:translateX(0)}90%{transform:translateX(8px)}}
@keyframes float-slow{from{transform:translate(0,0)}to{transform:translate(18px,-14px)}}
</style>
</head>
<body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="layer-bg"><div class="bg-base"></div><div class="bg-v"></div><div class="bg-lime"></div><div class="bg-grain"></div></div>
  <div class="layer-shape"><div class="shape-top"></div></div>
  <div class="avatar"><div class="avatar-inner">👤</div></div>
  <div class="badge-v">✓</div>
  <div class="social soc-1">📸 @handle</div>
  <div class="social soc-2">▶️ @handle</div>
  <div class="layer-text">
    <div class="name">Your Name</div>
    <div class="title">Content Creator · Speaker</div>
    <div class="rule"></div>
    <p class="bio">Helping 500K+ creators build authentic brands and monetise their expertise online.</p>
    <div class="stats-bento">
      <div class="sstat"><span class="sstat-icon">📸</span><span class="sstat-val">500K</span><span class="sstat-label">Instagram</span></div>
      <div class="sstat"><span class="sstat-icon">▶️</span><span class="sstat-val">1.2M</span><span class="sstat-label">YouTube</span></div>
      <div class="sstat"><span class="sstat-icon">🎙️</span><span class="sstat-val">250K</span><span class="sstat-label">Podcast</span></div>
    </div>
    <div class="topics">
      <span class="topic">Branding</span><span class="topic">Strategy</span><span class="topic">Growth</span><span class="topic">Mindset</span>
    </div>
    <div class="cta-wrap"><a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a></div>
  </div>
  <div class="layer-footer"><span class="footer-url" data-field="footer_url">{{footer_url}}</span><span class="footer-handle" data-field="footer_handle">{{footer_handle}}</span></div>
</div></div></div>
</body></html>
