<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Video Reel — Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@200;300;400&display=swap" rel="stylesheet"/>
<style>
/*
 VIDEO REEL — Restaurant  v02
 Video: Close-up food B-roll — plating, steam, texture
 Text: Centre spotlight, editorial serif
*/
:root{--accent:#E8913A;--primary:#F5B870;--bg:#FAF0DC;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#08050A}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#060403}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#08050A}
/* VIDEO */
.video-bg{position:absolute;inset:0;z-index:1;background:#0C0704}
.video-bg video{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.video-bg::after{display:none!important;}
/* SCRIM — centre spotlight, dark edges */
.scrim{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 60% 55% at 50% 52%, transparent 0%, rgba(8,5,2,.55) 60%, rgba(8,5,2,.92) 100%),
    linear-gradient(180deg, rgba(8,5,2,.75) 0%, transparent 18%, transparent 75%, rgba(8,5,2,.95) 100%);
}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.025;mix-blend-mode:screen}
/* BRAND top */
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:72px 72px 0;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'DM Serif Display',serif;font-size:28px;color:var(--bg);letter-spacing:.08em}
.brand-stars{font-family:'Work Sans',sans-serif;font-size:21px;letter-spacing:.18em;color:var(--accent);margin-top:6px}
/* CONTENT — centre */
.content{position:absolute;z-index:8;top:50%;left:0;right:0;transform:translateY(-50%);padding:0 80px;text-align:center;display:flex;flex-direction:column;align-items:center}
.eyebrow{font-family:'Work Sans',sans-serif;font-size:20px;font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:16px;margin-bottom:28px;opacity:0;animation:su .7s var(--snap) .8s both}
.eyebrow::before,.eyebrow::after{content:'';width:32px;height:1px;background:var(--accent)}
.headline{font-family:'DM Serif Display',serif;font-size:100px;line-height:.94;color:var(--bg);margin-bottom:28px}
.hl-1{display:block;opacity:0;animation:su .8s var(--snap) 1.0s both}
.hl-2{display:block;font-style:italic;color:var(--primary);opacity:0;animation:su .8s var(--snap) 1.25s both}
.rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:24px;animation:dl .9s var(--snap) 1.5s both}
.sub{font-family:'Work Sans',sans-serif;font-size:20px;font-weight:200;letter-spacing:.10em;color:rgba(250,240,220,.55);margin-bottom:52px;opacity:0;animation:su .7s var(--snap) 1.65s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Work Sans',sans-serif;font-size:13px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:rgba(8,5,2,.90);background:var(--accent);padding:22px 52px;text-decoration:none;opacity:0;animation:su .7s var(--snap) 1.9s both;border:none;transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
/* BOTTOM BAR */
.bottom-bar{position:absolute;z-index:8;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 72px 64px;opacity:0;animation:su .6s var(--snap) 2.2s both}
.bb-text{font-family:'Work Sans',sans-serif;font-size:20px;font-weight:200;letter-spacing:.16em;color:rgba(250,240,220,.38)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes dl{from{width:0;opacity:0}to{width:80%;opacity:1}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand">
    <!-- SWAP: restaurant name -->
    <span class="brand-name" data-field="brand_name">{{brand_name}}</span>
    <span class="brand-stars" data-field="brand_stars">{{brand_stars}}</span>
  </div>
  <div class="content">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline">
      <!-- SWAP: hero dish or concept — max 2 lines -->
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <div class="rule"></div>
    <!-- SWAP: one line — cuisine type or key detail -->
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="bottom-bar">
    <span class="bb-text" data-field="bottom_text_1">{{bottom_text_1}}</span>
    <span class="bb-text" data-field="bottom_text_2">{{bottom_text_2}}</span>
  </div>
</div></div></div>
</body></html>
