<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,200;0,300;0,400;1,200&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Architecture v09 | Architectural walkthrough footage | Minimal bottom bar only */
:root{--primary:#CC0000;--bg:#FAFAFA;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#080808}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#070707}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#0A0A0A}
.video-bg{position:absolute;inset:0;z-index:1;background:#0A0A0A}
.video-bg video{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.60) contrast(1.08) brightness(.75)}
.video-bg::after{display:none!important;}
/* Absolutely minimal scrim — just tiny top and bottom */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(10,10,10,.55) 0%,transparent 12%,transparent 80%,rgba(10,10,10,.92) 100%)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.022;mix-blend-mode:screen}
/* Red dot — only decoration */
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:68px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-left{display:flex;align-items:center;gap:12px}
.red-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);flex-shrink:0}
.brand-name{font-family:'Jost',sans-serif;font-size:21px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:rgba(250,250,250,.70)}
.brand-num{font-family:'Jost',sans-serif;font-size:12px;font-weight:200;letter-spacing:.22em;color:rgba(250,250,250,.28)}
/* CONTENT — bottom only, very minimal */
.content{position:absolute;z-index:8;bottom:0;left:0;right:0;padding:0 72px 100px}
/* Horizontal project line */
.project-line{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:24px;opacity:0;animation:su .7s var(--snap) .8s both}
.project-name{font-family:'Jost',sans-serif;font-size:14px;font-weight:200;letter-spacing:.24em;text-transform:uppercase;color:rgba(250,250,250,.45)}
.project-year{font-family:'Jost',sans-serif;font-size:12px;font-weight:200;letter-spacing:.18em;color:rgba(250,250,250,.28)}
.rule{height:1px;background:rgba(250,250,250,.14);margin-bottom:28px;opacity:0;animation:fi .6s var(--snap) 1.0s both}
.headline{font-family:'Jost',sans-serif;font-size:80px;font-weight:200;line-height:.96;letter-spacing:-.02em;color:var(--bg);margin-bottom:20px}
.hl-1{display:block;opacity:0;animation:su .8s var(--snap) 1.1s both}
.hl-2{display:block;font-style:italic;font-weight:200;color:rgba(250,250,250,.50);opacity:0;animation:su .8s var(--snap) 1.35s both}
.cta-row{display:flex;align-items:center;justify-content:space-between;margin-top:36px;opacity:0;animation:su .7s var(--snap) 1.65s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Jost',sans-serif;font-size:12px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:rgba(10,10,10,.90);background:var(--bg);padding:18px 44px;text-decoration:none;border:none;transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
.cta-url{font-family:'Jost',sans-serif;font-size:12px;font-weight:200;letter-spacing:.18em;color:rgba(250,250,250,.30)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><div class="brand-left"><div class="red-dot"></div><span class="brand-name" data-field="brand_name">{{brand_name}}</span></div><span class="brand-num">Portfolio 2025 · 01</span></div>
  <div class="content">
    <div class="project-line"><span class="project-name">Residential · Dubai Hills</span><span class="project-year">2025</span></div>
    <div class="rule"></div>
    <h1 class="headline">
      <span class="hl hl-1" data-field="headline_1">{{headline_1}}</span>
      <span class="hl hl-2" data-field="headline_2">{{headline_2}}</span>
    </h1>
    <div class="cta-row">
      <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
      <span class="cta-url">companyname.com</span>
    </div>
  </div>
</div></div></div>
</body></html>
