<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><title>Video Reel — Personal Brand</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400&display=swap" rel="stylesheet"/>
<style>
/* VIDEO REEL — Personal Brand v10 | Portrait / lifestyle footage | Soft centre scrim, portrait frame */
:root{--accent:#7C3AED;--primary:#A78BFA;--lime:#A3E635;--bg:#F8F5FF;--w:1080px;--h:1920px;--snap:cubic-bezier(.16,1,.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;min-height:100%;background:#06040A}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;background:#050309}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.46);display:block;width:calc(var(--w)*.46);height:calc(var(--h)*.46)}}
@media(max-width:780px){.sw{transform:scale(.33);display:block;width:calc(var(--w)*.33);height:calc(var(--h)*.33)}}
@media(max-width:520px){.sw{transform:scale(.24);display:block;width:calc(var(--w)*.24);height:calc(var(--h)*.24)}}
.reel{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:#06040A}
.video-bg{position:absolute;inset:0;z-index:1;background:#08060E}
.video-bg video{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:saturate(.85) brightness(.70)}
.video-bg::after{display:none!important;}
/* Soft portrait scrim — dark at edges, subject in centre */
.scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(6,4,10,.85) 0%,rgba(6,4,10,.25) 18%,transparent 35%,transparent 65%,rgba(6,4,10,.35) 78%,rgba(6,4,10,.96) 100%),linear-gradient(90deg,rgba(6,4,10,.65) 0%,transparent 20%,transparent 80%,rgba(6,4,10,.65) 100%)}
.grain{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;opacity:.022;mix-blend-mode:screen}
/* Violet top accent */
.top-line{position:absolute;z-index:4;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--primary),var(--lime));opacity:0;animation:fi .6s var(--snap) .2s both}
.brand{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:60px 72px;opacity:0;animation:fi .8s var(--snap) .4s both}
.brand-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;letter-spacing:.06em;color:var(--bg)}
.brand-handle{font-family:'DM Sans',sans-serif;font-size:21px;font-weight:300;letter-spacing:.10em;color:rgba(248,245,255,.45)}
/* Floating social badges — float on the video */
.social-badge{position:absolute;z-index:6;display:flex;align-items:center;gap:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;color:var(--bg);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 20px;border-radius:50px;opacity:0}
.sb-1{top:35%;right:68px;animation:sl .6s var(--snap) 1.0s both}
.sb-2{top:42%;right:68px;animation:sl .6s var(--snap) 1.2s both}
.sb-3{top:49%;right:68px;animation:sl .6s var(--snap) 1.4s both}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sd-violet{background:var(--primary);box-shadow:0 0 8px rgba(167,139,250,.60)}
.sd-lime{background:var(--lime);box-shadow:0 0 8px rgba(163,230,53,.60)}
.sd-white{background:white}
/* CONTENT — lower centre */
.content{position:absolute;z-index:8;bottom:0;left:0;right:0;padding:0 72px 100px;display:flex;flex-direction:column;align-items:flex-start}
.name{font-family:'Syne',sans-serif;font-size:80px;font-weight:800;letter-spacing:-.03em;color:var(--bg);line-height:1;margin-bottom:8px;opacity:0;animation:su .7s var(--snap) 1.6s both}
.title{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:300;letter-spacing:.10em;color:var(--primary);margin-bottom:28px;opacity:0;animation:su .6s var(--snap) 1.8s both}
.rule{height:1px;width:0;background:linear-gradient(90deg,var(--accent),rgba(167,139,250,.20));margin-bottom:24px;animation:dl .8s var(--snap) 2.0s both}
.sub{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:200;color:rgba(248,245,255,.52);line-height:1.65;margin-bottom:44px;opacity:0;animation:su .7s var(--snap) 2.1s both}
.cta{display:inline-flex;align-items:center;gap:14px;font-family:'Syne',sans-serif;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:linear-gradient(90deg,var(--accent),var(--primary));padding:22px 52px;border-radius:50px;text-decoration:none;border:none;opacity:0;animation:su .7s var(--snap) 2.3s both;box-shadow:0 0 30px rgba(124,58,237,.30);transition:transform .22s}
.cta:hover{transform:translateY(-2px)}
.cta-arrow{display:inline-block;transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes sl{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes dl{from{width:0;opacity:0}to{width:70%;opacity:1}}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style></head><body>
<div class="scene"><div class="sw"><div class="reel">
  <div class="top-line"></div>
  <div class="video-bg"><img class="video-bg-fallback" data-field="bg_image" src="{{bg_image}}" alt="Background" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:brightness(1.35) saturate(1.1)"/></div>
  <div class="scrim"></div><div class="grain"></div>
  <div class="brand"><span class="brand-name" data-field="brand_name">{{brand_name}}</span><span class="brand-handle">@yourhandle</span></div>
  <!-- Floating social stat badges -->
  <div class="social-badge sb-1"><span class="sb-dot sd-white">📸</span>&nbsp;500K on Instagram</div>
  <div class="social-badge sb-2"><span class="sb-dot sd-lime"></span>&nbsp;1.2M on YouTube</div>
  <div class="social-badge sb-3"><span class="sb-dot sd-violet"></span>&nbsp;250K Podcast listeners</div>
  <div class="content">
    <!-- SWAP: your name -->
    <div class="name">Your Name.</div>
    <!-- SWAP: your title/niche -->
    <div class="title">Content Creator · Speaker · Coach</div>
    <div class="rule"></div>
    <!-- SWAP: one-line brand promise -->
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
</div></div></div>
</body></html>
