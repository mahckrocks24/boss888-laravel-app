<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>T04 — Bold Offer Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:     #0F0F0F;
  --primary:    #FF2D55;
  --accent: #FFD60A;
  --white:  #F5F5F5;
  --muted:  #666666;
  --font-h: 'Black Han Sans', Impact, sans-serif;
  --font-b: 'Outfit', sans-serif;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#080808}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.scale-wrap{transform-origin:top center}
@media(max-width:1160px){.scale-wrap{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.scale-wrap{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:720px){.scale-wrap{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.scale-wrap{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg)}

/* Full image */
.hero-img{position:absolute;inset:0;z-index:1}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.40) saturate(.80)}
/* heavy vignette */
.hero-img::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 55% 50%,transparent 20%,rgba(15,15,15,.75) 70%,rgba(15,15,15,.95) 100%)}

/* Red accent glow */
.glow{position:absolute;z-index:2;width:600px;height:500px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,45,85,.22) 0%,transparent 65%);bottom:-100px;right:-80px;pointer-events:none}

/* Diagonal slash decoration */
.slash{position:absolute;z-index:2;width:4px;height:800px;background:linear-gradient(180deg,transparent,var(--primary),transparent);top:50%;left:44%;transform:translateY(-50%) rotate(-18deg);pointer-events:none;opacity:.35}

/* Topbar */
.topbar{position:absolute;z-index:6;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:28px 48px}
.logo-name{font-family:var(--font-h);font-size:18px;letter-spacing:.06em;color:var(--white)}
.tag{font-family:var(--font-b);font-size:18px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:8px 18px}

/* Big SALE badge — center star burst */
.sale-badge{position:absolute;z-index:6;top:52px;right:56px;width:150px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary);border-radius:50%;transform:rotate(8deg);box-shadow:0 0 60px rgba(255,45,85,.55)}
.sale-off{font-family:var(--font-h);font-size:46px;line-height:1;color:var(--white)}
.sale-label{font-family:var(--font-b);font-size:18px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.80)}

/* Main content — left-aligned, lower third */
.content{position:absolute;z-index:5;bottom:160px;left:56px;right:340px}
.content-label{font-family:var(--font-b);font-size:20px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:18px}
.content-label::before{content:'';width:24px;height:2px;background:var(--accent);flex-shrink:0}

.headline{font-family:var(--font-h);font-size:110px;line-height:.88;letter-spacing:.01em;color:var(--white);margin-bottom:20px}
.headline .red{color:var(--primary)}
.headline .yellow{color:var(--accent)}

.sub{font-family:var(--font-b);font-size:18px;font-weight:300;line-height:1.65;color:rgba(245,245,245,.65);margin-bottom:36px;max-width:440px}

/* Price row */
.price-row{display:flex;align-items:baseline;gap:16px;margin-bottom:36px}
.price-now{font-family:var(--font-h);font-size:72px;color:var(--accent);line-height:1}
.price-was{font-family:var(--font-b);font-size:24px;font-weight:400;color:var(--muted);text-decoration:line-through}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-b);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--accent);border:none;padding:22px 52px;cursor:pointer;text-decoration:none;transition:transform .22s,box-shadow .22s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,214,10,.35)}
.cta .cta-arrow{transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}

/* Timer strip at bottom */
.timer{position:absolute;z-index:6;bottom:0;left:0;right:0;height:100px;background:rgba(255,45,85,.92);display:flex;align-items:center;justify-content:center;gap:56px}
.timer-block{display:flex;flex-direction:column;align-items:center;gap:4px}
.timer-num{font-family:var(--font-h);font-size:36px;color:var(--white);line-height:1}
.timer-unit{font-family:var(--font-b);font-size:17px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.timer-sep{font-family:var(--font-h);font-size:32px;color:rgba(255,255,255,.40);margin-bottom:14px}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="scale-wrap">
<div class="post">
  <div class="hero-img">
    <img data-field="hero_image" src="{{hero_image}}" alt="Hero"/>
  </div>
  <div class="glow"></div>
  <div class="slash"></div>

  <!-- Topbar -->
  <div class="topbar">
    <span class="logo-name" data-field="logo_name">{{logo_name}}</span>
    <span class="tag" data-field="tag">{{tag}}</span>
  </div>

  <!-- Sale badge -->
  <div class="sale-badge">
    <span class="sale-off" data-field="sale_off">{{sale_off}}</span>
    <span class="sale-label" data-field="sale_label">{{sale_label}}</span>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-label" data-field="content_label">{{content_label}}</div>
    <h1 class="headline"><span class="red" data-field="headline_red">{{headline_red}}</span><br><span class="yellow" data-field="headline_yellow">{{headline_yellow}}</span></h1>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="price-row">
      <span class="price-now" data-field="price_now">{{price_now}}</span>
      <span class="price-was" data-field="price_was">{{price_was}}</span>
    </div>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>

  <!-- Countdown timer -->
  <div class="timer">
    <div class="timer-block"><span class="timer-num" data-field="timer_hours">{{timer_hours}}</span><span class="timer-unit" data-field="timer_hours_label">{{timer_hours_label}}</span></div>
    <span class="timer-sep">:</span>
    <div class="timer-block"><span class="timer-num" data-field="timer_mins">{{timer_mins}}</span><span class="timer-unit" data-field="timer_mins_label">{{timer_mins_label}}</span></div>
    <span class="timer-sep">:</span>
    <div class="timer-block"><span class="timer-num" data-field="timer_secs">{{timer_secs}}</span><span class="timer-unit" data-field="timer_secs_label">{{timer_secs_label}}</span></div>
  </div>
</div>
</div></div>
</body></html>
