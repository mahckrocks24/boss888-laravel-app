<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Construction — Industrial Bold Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:ital,wght@0,300;0,400;0,700;0,900;1,300&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#111111;--surface:#1A1A1A;--primary:#FFD60A;--accent:#FF6B35;
  --white:#F5F5F5;--muted:rgba(245,245,245,.45);--grid:rgba(255,214,10,.06);
  --fh:'Anton',Impact,sans-serif;--fb:'Barlow',sans-serif;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#080808}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.sw{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:700px){.sw{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.sw{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg)}

/* Blueprint grid bg */
.bg-grid{position:absolute;inset:0;z-index:1;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px}
/* Diagonal slash — signature move */
.slash{position:absolute;z-index:2;width:6px;height:1400px;
  background:linear-gradient(180deg,transparent,var(--primary),var(--accent),transparent);
  top:50%;left:42%;transform:translateY(-50%) rotate(-14deg);opacity:.25;pointer-events:none}
.slash2{position:absolute;z-index:2;width:2px;height:1400px;
  background:linear-gradient(180deg,transparent,rgba(255,107,53,.35),transparent);
  top:50%;left:45%;transform:translateY(-50%) rotate(-14deg);opacity:.40;pointer-events:none}
/* Glow */
.glow{position:absolute;z-index:2;width:500px;height:400px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,214,10,.15) 0%,transparent 65%);
  top:-60px;right:-60px;pointer-events:none}

/* HERO IMAGE — left half */
.img-wrap{position:absolute;z-index:3;top:0;left:0;width:52%;height:100%;overflow:hidden}
.img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.55) saturate(.70) contrast(1.10)}
.img-wrap::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(17,17,17,.40) 0%,transparent 40%,var(--bg) 100%),
  linear-gradient(180deg,rgba(17,17,17,.65) 0%,transparent 20%)}

/* Yellow top badge */
.top-badge{position:absolute;z-index:6;top:0;left:0;right:0;height:7px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 55%,transparent 100%)}

/* Topbar */
.topbar{position:absolute;z-index:6;top:24px;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;padding:0 52px}
.logo-sq{width:38px;height:38px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-sq::after{content:'';width:14px;height:14px;background:var(--bg)}
.logo-name{font-family:var(--fh);font-size:18px;letter-spacing:.08em;color:var(--white);margin-left:12px}
.tag{font-family:var(--fb);font-size:18px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bg);background:var(--primary);padding:8px 18px}

/* Main content — right side */
.content{position:absolute;z-index:5;right:0;top:0;width:56%;height:100%;
  display:flex;flex-direction:column;justify-content:center;padding:52px 44px 52px 20px}

.eyebrow{font-family:var(--fb);font-size:20px;font-weight:700;letter-spacing:.30em;text-transform:uppercase;
  color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow::before{content:'';width:24px;height:2.5px;background:var(--accent);flex-shrink:0}

.headline{font-family:var(--fh);font-size:104px;line-height:.86;letter-spacing:.01em;
  text-transform:uppercase;color:var(--white);margin-bottom:16px}
.headline .yl{color:var(--primary)}

/* Diagonal cut box around sub */
.sub-wrap{position:relative;padding:20px 24px;border-left:3px solid var(--primary);
  background:rgba(255,214,10,.04);margin-bottom:36px}
.sub{font-family:var(--fb);font-size:16px;font-weight:300;line-height:1.68;color:var(--muted)}

/* Stats row */
.stats{display:flex;gap:0;margin-bottom:40px}
.stat{flex:1;padding:20px 20px;border-right:1px solid rgba(245,245,245,.08)}
.stat:last-child{border-right:none}
.stat-val{font-family:var(--fh);font-size:40px;color:var(--primary);line-height:1}
.stat-label{font-family:var(--fb);font-size:17px;font-weight:400;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin-top:5px}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--fb);font-size:13px;
  font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bg);background:var(--primary);border:none;padding:20px 48px;
  cursor:pointer;text-decoration:none;transition:transform .22s,box-shadow .22s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,214,10,.35)}
.cta .cta-arrow{transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(5px)}

/* Yellow corner bracket */
.corner{position:absolute;z-index:7}
.corner-tl{top:20px;left:20px;width:20px;height:20px;
  border-top:2.5px solid var(--primary);border-left:2.5px solid var(--primary)}
.corner-br{bottom:20px;right:20px;width:20px;height:20px;
  border-bottom:2.5px solid var(--accent);border-right:2.5px solid var(--accent)}

/* Bottom brand */
.brand-bottom{position:absolute;z-index:5;bottom:32px;right:52px;
  font-family:var(--fb);font-size:10px;letter-spacing:.18em;color:rgba(245,245,245,.30)}

/* Image stat */
.img-stat{position:absolute;z-index:5;bottom:60px;left:44px}
.img-stat-val{font-family:var(--fh);font-size:56px;color:var(--primary);line-height:1}
.img-stat-label{font-family:var(--fb);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body><div class="scene"><div class="sw"><div class="post">
  <div class="bg-grid"></div><div class="slash"></div><div class="slash2"></div><div class="glow"></div>
  <div class="top-badge"></div>
  <div class="corner corner-tl"></div><div class="corner corner-br"></div>
  <div class="img-wrap">
    <img data-field="hero_image" src="{{hero_image}}" alt="Hero"/>
  </div>
  <div class="img-stat"><div class="img-stat-val" data-field="img_stat_val">{{img_stat_val}}</div><div class="img-stat-label" data-field="img_stat_label">{{img_stat_label}}</div></div>
  <div class="topbar">
    <div style="display:flex;align-items:center"><div class="logo-sq"></div><span class="logo-name" data-field="logo_name">{{logo_name}}</span></div>
    <span class="tag" data-field="tag">{{tag}}</span>
  </div>
  <div class="content">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline"><span data-field="headline_1">{{headline_1}}</span><br><span data-field="headline_2">{{headline_2}}</span><br><span class="yl" data-field="headline_accent">{{headline_accent}}</span></h1>
    <div class="sub-wrap"><p class="sub" data-field="subheading">{{subheading}}</p></div>
    <div class="stats">
      <div class="stat"><div class="stat-val" data-field="stat_1_val">{{stat_1_val}}</div><div class="stat-label" data-field="stat_1_label">{{stat_1_label}}</div></div>
      <div class="stat"><div class="stat-val" data-field="stat_2_val">{{stat_2_val}}</div><div class="stat-label" data-field="stat_2_label">{{stat_2_label}}</div></div>
    </div>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
  </div>
  <div class="brand-bottom" data-field="brand_bottom">{{brand_bottom}}</div>
</div></div></div></body></html>
