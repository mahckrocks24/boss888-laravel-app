<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Education — EdTech Bento UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Josefin+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F0F4FF;--text:#1A237E;--blue:#3F51B5;--primary:#FFD600;
  --yellow-d:#B8960A;--sky:#E8EAF6;--accent:#00C853;
  --ink:#1A237E;--muted:rgba(26,35,126,.45);--white:#FFFFFF;
  --fh:'Outfit',sans-serif;--fb:'Josefin Sans',sans-serif;
  --gap:12px;--pad:12px;--r:16px;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#D8DEFF}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.sw{transform-origin:top center}
@media(max-width:1160px){.sw{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.sw{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:700px){.sw{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.sw{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg)}

/* Subtle bg pattern */
.bg-lines{position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(63,81,181,.04) 1px,transparent 1px);
  background-size:40px 40px}

/* BENTO */
.bento{position:absolute;inset:0;z-index:3;display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  grid-template-rows:1.4fr 1fr;
  gap:var(--gap);padding:var(--pad)}
.card{border-radius:var(--r);overflow:hidden;position:relative}

/* A — Hero card (col1, row1-2) */
.ca{grid-column:1;grid-row:1/3;background:var(--text);
  display:flex;flex-direction:column;justify-content:space-between;padding:32px 32px}
.ca::before{content:'';position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,214,0,.14) 0%,transparent 65%);
  bottom:-80px;right:-60px;pointer-events:none}
.ca-brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.ca-mark{width:32px;height:32px;background:var(--primary);border-radius:8px;
  display:flex;align-items:center;justify-content:center}
.ca-mark::after{content:'E';font-family:var(--fh);font-size:16px;font-weight:800;color:var(--text)}
.ca-brand-name{font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--white)}
.ca-brand-url{font-family:var(--fb);font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.35)}

.ca-eyebrow{font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:.26em;
  text-transform:uppercase;color:var(--primary);position:relative;z-index:2;
  display:flex;align-items:center;gap:10px}
.ca-eyebrow::before{content:'';width:16px;height:2px;background:var(--primary);flex-shrink:0}

.ca-headline{font-family:var(--fh);font-size:64px;font-weight:800;line-height:.92;
  letter-spacing:-.03em;color:var(--white);position:relative;z-index:2}
.ca-headline .yl{color:var(--primary)}

.ca-sub{font-family:var(--fh);font-size:21px;font-weight:300;line-height:1.65;
  color:rgba(255,255,255,.55);max-width:320px;position:relative;z-index:2}

.ca-cta{display:inline-flex;align-items:center;gap:12px;font-family:var(--fh);
  font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text);background:var(--primary);padding:16px 28px;border-radius:50px;
  text-decoration:none;position:relative;z-index:2;
  transition:transform .22s,box-shadow .22s}
.ca-cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,214,0,.35)}
.ca-cta .cta-arrow{transition:transform .22s}
.ca-cta:hover .cta-arrow{transform:translateX(4px)}

/* B — courses image */
.cb{grid-column:2;grid-row:1;background:var(--blue);overflow:hidden}
.cb img{width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(.70)}
.cb::after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(26,35,126,.85) 100%)}
.cb-stat{position:absolute;z-index:2;bottom:24px;left:24px}
.cb-val{font-family:var(--fh);font-size:42px;font-weight:800;color:var(--white);letter-spacing:-.03em;line-height:1}
.cb-label{font-family:var(--fb);font-size:17px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:4px}

/* C — progress card */
.cc{grid-column:3;grid-row:1;background:var(--primary);padding:22px 22px;
  display:flex;flex-direction:column;justify-content:space-between}
.cc-label{font-family:var(--fb);font-size:18px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:rgba(26,35,126,.55)}
.cc-val{font-family:var(--fh);font-size:52px;font-weight:800;color:var(--text);letter-spacing:-.04em;line-height:1}
.cc-bar{height:5px;background:rgba(26,35,126,.12);border-radius:3px;overflow:hidden}
.cc-bar::after{content:'';display:block;height:100%;width:92%;
  background:var(--text);border-radius:3px}
.cc-note{font-family:var(--fh);font-size:13px;font-weight:600;color:var(--text)}

/* D — feature */
.cd{grid-column:2;grid-row:2;background:var(--white);padding:22px 22px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(63,81,181,.10)}
.cd-emoji{font-size:36px;margin-bottom:8px}
.cd-title{font-family:var(--fh);font-size:22px;font-weight:700;color:var(--text)}
.cd-sub{font-family:var(--fb);font-size:20px;font-weight:400;letter-spacing:.06em;color:var(--muted)}

/* E — live */
.ce{grid-column:3;grid-row:2;background:var(--sky);padding:22px 22px;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(63,81,181,.12)}
.live-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--fb);
  font-size:10px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:var(--accent)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.ce-num{font-family:var(--fh);font-size:36px;font-weight:800;color:var(--text);letter-spacing:-.03em;line-height:1}
.ce-label{font-family:var(--fb);font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body><div class="scene"><div class="sw"><div class="post">
  <div class="bg-lines"></div>
  <div class="bento">

    <!-- A: Hero -->
    <div class="card ca">
      <div class="ca-brand">
        <div class="ca-mark"></div>
        <div><div class="ca-brand-name" data-field="brand_name">{{brand_name}}</div><div class="ca-brand-url" data-field="brand_url">{{brand_url}}</div></div>
      </div>
      <div>
        <div class="ca-eyebrow" data-field="eyebrow">{{eyebrow}}</div>
        <h1 class="ca-headline"><span data-field="headline_1">{{headline_1}}</span><br><span class="yl" data-field="headline_accent">{{headline_accent}}</span><br><span data-field="headline_2">{{headline_2}}</span></h1>
      </div>
      <p class="ca-sub" data-field="subheading">{{subheading}}</p>
      <a class="ca-cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
    </div>

    <!-- B: Image/courses -->
    <div class="card cb">
      <img data-field="hero_image" src="{{hero_image}}" alt="Hero"/>
      <div class="cb-stat"><div class="cb-val" data-field="cb_val">{{cb_val}}</div><div class="cb-label" data-field="cb_label">{{cb_label}}</div></div>
    </div>

    <!-- C: Completion -->
    <div class="card cc">
      <span class="cc-label" data-field="cc_label">{{cc_label}}</span>
      <div class="cc-val" data-field="cc_val">{{cc_val}}</div>
      <div class="cc-bar"></div>
      <span class="cc-note" data-field="cc_note">{{cc_note}}</span>
    </div>

    <!-- D: Feature -->
    <div class="card cd">
      <div class="cd-emoji" data-field="cd_emoji">{{cd_emoji}}</div>
      <div class="cd-title" data-field="cd_title">{{cd_title}}</div>
      <div class="cd-sub" data-field="cd_sub">{{cd_sub}}</div>
    </div>

    <!-- E: Live -->
    <div class="card ce">
      <div class="live-badge"><span class="live-dot"></span><span data-field="ce_live_label">{{ce_live_label}}</span></div>
      <div class="ce-num" data-field="ce_num">{{ce_num}}</div>
      <div class="ce-label" data-field="ce_label">{{ce_label}}</div>
    </div>

  </div>
</div></div></div></body></html>
