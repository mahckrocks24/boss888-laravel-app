<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>T05 — Floating Glass Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:     #060A1F;
  --text:   #0A1035;
  --gold:   #C9A84C;
  --accent: #E8CFA0;
  --gold-g: rgba(201,168,76,.14);
  --primary:   #2B5CE6;
  --white:  #EEF0FF;
  --muted:  rgba(238,240,255,.45);
  --glass:  rgba(255,255,255,.06);
  --glass-b:rgba(255,255,255,.13);
  --font-h: 'Libre Baskerville', Georgia, serif;
  --font-b: 'Nunito Sans', sans-serif;
  --w:1080px;--h:1080px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#030510}
.scene{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px}
.scale-wrap{transform-origin:top center}
@media(max-width:1160px){.scale-wrap{transform:scale(.80);display:block;width:calc(var(--w)*.80);height:calc(var(--h)*.80)}}
@media(max-width:940px){.scale-wrap{transform:scale(.62);display:block;width:calc(var(--w)*.62);height:calc(var(--h)*.62)}}
@media(max-width:720px){.scale-wrap{transform:scale(.44);display:block;width:calc(var(--w)*.44);height:calc(var(--h)*.44)}}
@media(max-width:500px){.scale-wrap{transform:scale(.30);display:block;width:calc(var(--w)*.30);height:calc(var(--h)*.30)}}

.post{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--bg);font-family:var(--font-b);display:grid;grid-template-columns:1fr 1fr}

/* BG layers */
.bg-glow-1{position:absolute;z-index:1;width:700px;height:600px;border-radius:50%;background:radial-gradient(ellipse,rgba(43,92,230,.20) 0%,transparent 65%);top:-150px;left:-100px;pointer-events:none}
.bg-glow-2{position:absolute;z-index:1;width:500px;height:400px;border-radius:50%;background:radial-gradient(ellipse,rgba(201,168,76,.16) 0%,transparent 65%);bottom:-80px;right:100px;pointer-events:none}
.bg-grid{position:absolute;inset:0;z-index:1;background-image:radial-gradient(circle,rgba(238,240,255,.05) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}

/* LEFT panel — image with graph overlay */
.panel-left{position:relative;z-index:3;overflow:hidden}
.panel-left img{width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.35) saturate(.60)}
.panel-left::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,var(--bg) 100%),linear-gradient(180deg,rgba(6,10,31,.65) 0%,transparent 30%)}

/* Chart decorative SVG */
.chart-wrap{position:absolute;z-index:4;bottom:120px;left:40px;right:0}
.chart-line{fill:none;stroke:var(--gold);stroke-width:2;opacity:.70}
.chart-fill{fill:url(#chartGrad);opacity:.25}

/* Stats floating in left panel */
.stat-card{position:absolute;z-index:5;top:60px;left:40px;background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:20px 22px;border-radius:14px}
.stat-card-val{font-family:var(--font-h);font-size:42px;font-weight:700;color:var(--accent);line-height:1}
.stat-card-label{font-family:var(--font-b);font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stat-card-delta{font-family:var(--font-b);font-size:13px;color:#4ADE80;margin-top:8px;display:flex;align-items:center;gap:5px}
.stat-card-delta::before{content:'↑'}

/* RIGHT panel — content */
.panel-right{position:relative;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:52px 48px 52px 32px}

.eyebrow{font-family:var(--font-b);font-size:18px;font-weight:700;letter-spacing:.30em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:28px}
.eyebrow::before{content:'';width:22px;height:1.5px;background:var(--gold);flex-shrink:0}

.headline{font-family:var(--font-h);font-size:60px;font-weight:700;line-height:1.06;letter-spacing:-.02em;color:var(--white);margin-bottom:10px}
.headline em{font-style:italic;font-weight:400;color:var(--accent);display:block}

.rule{width:48px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:22px 0;border-radius:2px}

.sub{font-family:var(--font-b);font-size:16px;font-weight:300;line-height:1.70;color:var(--muted);margin-bottom:36px}

/* Glass metrics row */
.metrics{display:flex;gap:0;margin-bottom:40px;border:1px solid var(--glass-b);border-radius:12px;overflow:hidden}
.metric{flex:1;padding:20px 20px;background:var(--glass);border-right:1px solid var(--glass-b);text-align:center}
.metric:last-child{border-right:none}
.metric-val{font-family:var(--font-h);font-size:26px;font-weight:700;color:var(--white);letter-spacing:-.02em;line-height:1}
.metric-label{font-family:var(--font-b);font-size:17px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}

/* CTA */
.cta{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-b);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:linear-gradient(135deg,var(--accent),var(--gold));padding:20px 44px;border:none;cursor:pointer;text-decoration:none;border-radius:2px;transition:transform .22s,box-shadow .22s}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(201,168,76,.35)}
.cta .cta-arrow{transition:transform .22s}
.cta:hover .cta-arrow{transform:translateX(4px)}

/* Brand */
.brand-bar{display:flex;align-items:center;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid rgba(238,240,255,.08)}
.brand-logo{display:flex;align-items:center;gap:10px}
.brand-sq{width:28px;height:28px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center}
.brand-sq::after{content:'';width:8px;height:8px;background:var(--gold)}
.brand-name{font-family:var(--font-b);font-size:20px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--white)}
.brand-url{font-family:var(--font-b);font-size:17px;letter-spacing:.14em;color:var(--muted)}

/* phone-readability safety: clip overflow rather than overlap */
.card,.ca,.cb,.cc,.cd,.ce,.float-card,.review-card,.rating-card,.trust-badge,.stat-float,.panel-img,.panel-right,.content,.bento>*{overflow:hidden!important}
.sub,.subtext,.subheading,.subheadline,.card-sub,.cb-sub,.cc-sub,.cd-sub,.ce-sub,.ca-sub,.desc,.description,.feat-item,.check-item,.feature-text,.feat-text,.float-card-sub,.review-text,.tagline{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;min-width:0}
</style>
</head>
<body>
<div class="scene"><div class="scale-wrap">
<div class="post">
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="bg-grid"></div>

  <!-- LEFT -->
  <div class="panel-left">
    <img data-field="hero_image" src="{{hero_image}}" alt="Hero"/>
    <!-- Chart SVG -->
    <div class="chart-wrap">
      <svg width="100%" height="200" viewBox="0 0 500 180" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#C9A84C"/>
            <stop offset="100%" stop-color="transparent"/>
          </linearGradient>
        </defs>
        <path class="chart-fill" d="M0,160 C60,120 100,140 160,90 C220,40 280,80 340,50 C400,20 460,40 500,20 L500,180 L0,180 Z"/>
        <path class="chart-line" d="M0,160 C60,120 100,140 160,90 C220,40 280,80 340,50 C400,20 460,40 500,20"/>
      </svg>
    </div>
    <!-- Floating stat -->
    <div class="stat-card">
      <div class="stat-card-val" data-field="stat_value">{{stat_value}}</div>
      <div class="stat-card-label" data-field="stat_label">{{stat_label}}</div>
      <div class="stat-card-delta" data-field="stat_delta">{{stat_delta}}</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <div class="eyebrow" data-field="eyebrow">{{eyebrow}}</div>
    <h1 class="headline"><span data-field="headline_main">{{headline_main}}</span><em data-field="headline_accent">{{headline_accent}}</em></h1>
    <div class="rule"></div>
    <p class="sub" data-field="subheading">{{subheading}}</p>
    <div class="metrics">
      <div class="metric"><div class="metric-val" data-field="metric_1_val">{{metric_1_val}}</div><div class="metric-label" data-field="metric_1_label">{{metric_1_label}}</div></div>
      <div class="metric"><div class="metric-val" data-field="metric_2_val">{{metric_2_val}}</div><div class="metric-label" data-field="metric_2_label">{{metric_2_label}}</div></div>
      <div class="metric"><div class="metric-val" data-field="metric_3_val">{{metric_3_val}}</div><div class="metric-label" data-field="metric_3_label">{{metric_3_label}}</div></div>
    </div>
    <a class="cta" href="#"><span data-field="cta_label">{{cta_label}}</span> <span class="cta-arrow">&rarr;</span></a>
    <div class="brand-bar">
      <div class="brand-logo">
        <div class="brand-sq"></div>
        <span class="brand-name" data-field="brand_name">{{brand_name}}</span>
      </div>
      <span class="brand-url" data-field="brand_url">{{brand_url}}</span>
    </div>
  </div>

</div>
</div></div>
</body></html>
